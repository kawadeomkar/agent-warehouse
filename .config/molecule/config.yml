---
# Molecule base configuration shared by every scenario (roles/*/molecule/* and
# molecule/*). Scenario molecule.yml files only add what differs.
#
# Each names its own platforms, since Molecule replaces a list rather than
# merging it, and with them the one image: geerlingguy/docker-ubuntu2404-ansible
# :latest as of 2026-11-01, pinned by digest (docs/architecture/ci.md says how
# to bump it; tests/unit/test_ci.py holds every copy to one).
dependency:
  # The collections come from just install, into the checkout's own folder, and
  # just test checks them before any scenario (tools/check collections); the
  # galaxy step would install them again, or skip a requirements file it reads
  # relative to the directory just test runs Molecule from.
  enabled: false
driver:
  name: docker
provisioner:
  config_options:
    defaults:
      callback_result_format: yaml
      # As ansible.cfg: gathered facts only under ansible_facts.
      inject_facts_as_vars: false
      # As ansible.cfg too, and as every real run has it: a module goes over
      # the connection's stdin, not as files put, run and removed one docker
      # exec at a time. 16% off the ten scenarios, configure 20%.
      pipelining: true
