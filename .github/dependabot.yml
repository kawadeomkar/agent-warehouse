---
# Each pull request asks for its review through .github/CODEOWNERS, which names
# the files these updates change: GitHub no longer reads a `reviewers` option
# here. An ecosystem or directory added below needs its files there too.
version: 2
updates:
  # Bumps the pins in pyproject.toml, uv included, and re-locks uv.lock.
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    # A release must be a week old before Dependabot proposes it: a malicious
    # release is usually found and yanked within days.
    cooldown:
      default-days: 7
    # Without this only the packages pyproject.toml names move, and the ones
    # the lock pins for them stay put unless an advisory names them.
    allow:
      - dependency-type: all
    # One pull request a week for the tooling; ansible-core on its own, since
    # its releases change what the playbooks may do; and the wiki's tools on
    # their own, since a release that changes what they render fails the docs
    # tests until `just docs` runs. A package goes to the first group it
    # matches, so docs comes before tooling.
    groups:
      docs:
        patterns: [zensical, docsible, markdown, pymdown-extensions, markdown-it-py]
      tooling:
        patterns: ["*"]
        exclude-patterns: ["ansible-core"]

  # The workflows' actions, and the composite setup action's, which are only
  # picked up where a directory points at it. Grouped by name, an action used
  # in both (actions/cache) moves in both in one pull request, never two that
  # leave the files apart while one waits.
  - package-ecosystem: github-actions
    directories:
      - /
      - /.github/actions/setup
    schedule:
      interval: weekly
    groups:
      actions:
        group-by: dependency-name
