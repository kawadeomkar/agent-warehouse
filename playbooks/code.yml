---
# Open one VM in VS Code, over SSH: its whole projects directory, or one
# project in it.
#
#   just code alpha                              -> ~/projects
#   just code alpha --project discord-music-bot    -> ~/projects/discord-music-bot
#
# The quick way to an existing VM: the alias step of `just deploy --only configure` and
# `just deploy --only ssh-config` for this one VM - its address is read from Proxmox again,
# so a lease that moved since the last run is corrected before connecting -
# followed by the one step those never do, launching the editor. The folder is
# looked for on the VM first, read-only and over SSH as the VM user, so a
# --project that is mistyped, or a VM never configured and so without a projects
# directory yet, is said here, with what is there, rather than in a VS Code
# window opened on a folder that does not exist. The Remote - SSH extension is
# installed first if VS Code does not have it.
#
# `just deploy` ends with this playbook (code_in_deploy) for its one VM: the
# one vm_name names, or the default VM of a bare deploy. There, whatever stops
# the window - a VM the deploy left stopped, no alias, no `code` command, an
# SSH failure, an extension that would not install - is said with the command
# that opens it later, instead of failing a deploy whose VM is done. A deploy
# for several VMs opens none: this ends at once with each VM's just code line.
#
# With editor_claude_terminal (the default), VS Code is handed a workspace
# file rather than the folder. It names the folder and holds one task, run when
# the window opens: a terminal named Claude that starts claude there, signing
# in to Claude, and to GitHub, first on a VM that has not been. With
# editor_session_notes (the default) it also holds a "Session notes" task,
# run beside the Claude task, which opens a page about the VM beside the
# terminal each time the window opens, its "Signed in" section read from the
# VM then (docs/guides/vscode.md). The workspace file, those notes and the
# helpers the two tasks run (playbooks/files/, copied unchanged) are written
# on the VM in a directory of its own beside the projects
# (<projects>/.claude-on-proxmox/), never in a repository; cloud-init placed
# the key at provisioning, so nothing else needs changing. VS Code runs the
# tasks only in a window the user has trusted, and only once they have
# allowed automatic tasks; this playbook reads their VS Code settings to say
# which of those to expect, and never writes them (docs/guides/vscode.md).
#
# With claude_sessions_sync (the default) it also copies this machine's
# Claude Code sessions of the last 30 days to the VM, the ones of the
# repositories the VM has checked out, so that /resume there lists them
# (Ctrl+A); --session <id> (vm_session) has the Claude terminal resume that
# one, with the VM's checkout first brought to the commit its branch is at
# here, by fast-forward only. The copies go in ~/.claude/projects/ on the VM,
# under the folders they have here, beside a mirror of them in that directory
# of its own, and the fast-forward is the one write in a repository. Nothing
# is written on this machine (tasks/session_read.yml, tasks/session_write.yml,
# docs/architecture/lifecycle.md §4.9).
#
# vm_project (--project) is one folder name, as a GitHub repository is named,
# and is checked again here so that a direct ansible-playbook run cannot point
# VS Code outside the projects directory either.
#
# Every name this playbook sets starts with code_, a prefix no role uses: just
# deploy runs the roles in the same run, and a fact or register of theirs
# would outrank a play var of the same name without a word. What it reads from
# the inventory keeps its own name (claude_code_remote_control,
# github_projects_auth and the like), and the names about VS Code's own
# settings say vscode.
- name: Open a VM in the editor
  hosts: localhost
  gather_facts: false
  module_defaults:
    group/community.proxmox.proxmox: "{{ proxmox_api_module_defaults }}"
  # Each editor's own variables, in a file of its own; only its task files
  # (tasks/vscode_*.yml, later zed_*.yml) read them.
  vars_files:
    - vars/vscode.yml
  vars:
    # The editor whose task files open the window: the editor setting, or
    # --editor for one run (vm_editor), among the editors the inventory
    # defaults list (claude_editors): how each is said, and whether its window
    # runs just code's tasks when it opens, which is what the Claude terminal,
    # the notes' refresh and --session's terminal take.
    code_editors: "{{ claude_editors }}"
    code_editor: "{{ vm_editor | default(editor | default('vscode', true), true) | string }}"
    code_editor_name: "{{ (code_editors[code_editor] | default({})).name | default(code_editor) }}"
    code_editor_tasks: "{{ (code_editors[code_editor] | default({})).window_tasks | default(false) | bool }}"
    # code_ssh is the result of whichever task connected. ssh's error can hold
    # line breaks, and text the VM sent before the login: said on one line,
    # with no control character reaching this terminal.
    code_ssh_failed: >-
      {{ claude_vm_names[0] }} is running at {{ code_reach }}, but SSH to it as {{ vm_user }}
      failed, so {{ code_editor_name }} could not connect either:
      {{ code_ssh.msg | default('no reason given') | plain_text | regex_replace('\s+', ' ') | trim }}
      A VM that has just booted can need another minute; `ssh {{ claude_vm_names[0] }}` shows why.
    # Each setting by its name from 1.1, else by its name in 1.0, which the
    # inventory defaults feed it from - and a run without them, from -e.
    code_terminal: "{{ editor_claude_terminal | default(vscode_claude_terminal | default(true)) | bool }}"
    # The session notes: where the window runs just code's tasks, they need
    # the workspace file's, and come with the terminal; elsewhere they are a
    # page just code writes, and nothing more.
    code_notes: >-
      {{ (code_terminal or not code_editor_tasks)
         and editor_session_notes | default(vscode_session_notes | default(true)) | bool }}

    # Whether anything goes into just code's own directory on the VM: the
    # workspace file and VS Code's helpers, the notes, or session copies.
    code_writes_its_directory: >-
      {{ (code_terminal and code_editor_tasks) or code_notes | bool
         or code_session_plan.sessions | default([]) | length > 0 }}

    # The session handoff (tasks/session_read.yml, tasks/session_write.yml):
    # the sync, on unless claude_sessions_sync is false, and --session, which
    # copies its one session with the sync off too. Claude Code's directory
    # here is CLAUDE_CONFIG_DIR's when the shell running just sets it; on the
    # VM, the VM user's ~/.claude. Every test points both at a directory of its
    # own: what is read and written there is a developer's own otherwise
    # (tests/unit/test_code_session.py holds that).
    code_sessions: "{{ claude_sessions_sync | default(vscode_claude_sessions | default(true)) | bool }}"
    code_session_id: "{{ vm_session | default('', true) | string }}"
    code_session_on: "{{ code_sessions or code_session_id | length > 0 }}"
    code_session_days: 30
    code_session_here: >-
      {{ code_session_source_dir | default('', true)
         or lookup('ansible.builtin.env', 'CLAUDE_CONFIG_DIR') or code_here_home ~ '/.claude' }}
    code_session_there: "{{ code_session_dest_dir | default('', true) or code_vm_home ~ '/.claude' }}"
    # just code's own directory on the VM holds the mirror rsync brings and the
    # manifest of the copies written from it. A VM reached locally, as the
    # provision scenario reaches its stand-in, is a local path to rsync.
    code_session_dir: "{{ code_ws_dir }}/claude-sessions"
    code_session_mirror_target: >-
      {{ ('' if hostvars[claude_vm_names[0]].ansible_connection | default('ssh') == 'local'
          else claude_vm_names[0] ~ ':') ~ code_session_dir ~ '/mirror' }}
    # --session's branch here: the commit the VM checkout is brought to, and the branch of origin it tracks.
    code_session_commit: "{{ code_session_git_here.checkouts[0].branch_head }}"
    code_session_upstream: "{{ code_session_git_here.checkouts[0].upstream_branch }}"
    # Where the code lives on the VM, read there as configure reads it: the VM
    # user's home, unless vm_projects_dir says it outright. A trailing "/" is
    # dropped so the path VS Code is given is the one listed.
    code_vm_home: "{{ code_home.ansible_facts.getent_passwd[vm_user][4] }}"
    code_projects_dir: >-
      {{ (vm_projects_dir | default('', true) or code_vm_home ~ '/projects') | regex_replace('(.)/+$', '\1') }}
    code_remote_control_unit: "{{ claude_code_remote_control_service | default('claude-remote-control') }}"
    # The time zone the notes' time is said in: this machine's, the user's, where the VM's clock keeps
    # common_timezone (UTC). TZ first, as the shell running just has it, then the zone /etc/localtime
    # links into a zoneinfo directory for (macOS, most Linux), then /etc/timezone (Debian, where
    # /etc/localtime may be a copy). Only a zone's name, such as Europe/Berlin, is taken, anything else
    # falls through, and with none it is UTC; the helper says UTC too for a zone the VM's tzdata lacks.
    # Read by a filter and lookups rather than a task: nothing in this play runs here but which and code.
    # /etc/timezone is read only where it is a file: macOS has none, and a lookup's ignored error still
    # lands in the run log, which read as a failure of every just code there.
    code_tz_env: "{{ lookup('ansible.builtin.env', 'TZ') }}"
    code_localtime: /etc/localtime
    code_timezone_file: /etc/timezone
    code_timezone: >-
      {{ [code_tz_env, code_localtime | realpath,
          lookup('ansible.builtin.file', code_timezone_file, errors='ignore') if code_timezone_file is file else '']
         | map('default', '', true) | map('trim') | map('regex_replace', '^:?(?:.*/zoneinfo/)?(?:posix/|right/)?', '')
         | select('match', '^[A-Za-z0-9_+-]{1,32}(?:/[A-Za-z0-9_+-]{1,32}){0,3}$') | first | default('UTC', true) }}

    code_here_home: "{{ lookup('ansible.builtin.env', 'HOME') }}"
    # What the window step says of the session handoff, whichever editor opens the window.
    # The sessions carried over: IDs by their first eight characters, as
    # /resume lists them, and nothing of a transcript but IDs, folders,
    # branches and counts.
    code_copies: "{{ code_session_copied.written + code_session_copied.unchanged + code_session_copied.continued }}"
    # rsync's failure, which the sync goes on past (tasks/session_write.yml): what it printed names
    # files, never what is in them.
    code_sync_failed: "{{ code_session_sent.rc | default(0) != 0 }}"
    code_sync_why: >-
      {{ (code_session_sent.stderr | default('', true) or code_session_sent.msg | default('', true))
         | plain_text | regex_replace('\s+', ' ') | trim }}
    # The sessions the sync left out, list by list: what is said before their IDs, the IDs, and after.
    code_sessions_left: >-
      {{ [[' Left as they are, continued on ' ~ claude_vm_names[0] ~ ' since they were copied: ',
           code_session_copied.continued, '.'],
          [' Left as they are, changed both there and here since they were copied: ',
           code_session_copied.diverged, '; a copy moved out of the way is copied again.'],
          [' Not copied, written by a Claude Code newer than ' ~ claude_vm_names[0] ~ "'s "
           ~ code_session_vm.version ~ ': ', code_session_plan.newer, '.'],
          [' Not copied, of a repository ' ~ claude_vm_names[0] ~ ' has more than one checkout of: ',
           code_session_plan.ambiguous | map(attribute='id') | list, '.'],
          [' Not copied, in more than one folder here, so claude --resume could not tell which: ',
           code_session_plan.twice, '.'],
          [' Left as they are, open in a claude on ' ~ claude_vm_names[0] ~ ': ', code_session_plan.open, '.'],
          [' Not copied: ', code_session_copied.unreadable | map(attribute='id') | list,
           ', ' ~ code_session_copied.unreadable | map(attribute='why') | unique | join('; ') ~ '.']] }}
    code_sessions_listed: "{{ code_sessions_left | claude_sessions_listed }}"
    code_sessions_said: >-
      {{ '' if not (code_sessions | bool)
         else 'Claude Code is not installed on ' ~ claude_vm_names[0] ~ ' yet, so no session of this machine was'
              ~ ' copied there.'
         if not code_session_plan.claude
         else ((code_copies | length ~ " of this machine's Claude Code sessions of the last "
                ~ code_session_days ~ ' days, of ' ~ code_session_plan.repositories | join(', ') ~ ', '
                ~ ('is' if code_copies | length == 1 else 'are') ~ ' on ' ~ claude_vm_names[0]
                ~ ' (' ~ code_session_copied.written | length ~ ' copied now): in claude there, /resume'
                ~ ' and then Ctrl+A lists them.')
               if code_copies | length > 0
               else 'No Claude Code session of this machine was copied to ' ~ claude_vm_names[0] ~ '.'
               if code_sessions_listed | length > 0
               else "No Claude Code session of this machine's from the last " ~ code_session_days
                    ~ ' days is of a repository ' ~ claude_vm_names[0] ~ ' has checked out, so none was copied.')
              ~ code_sessions_listed
              ~ (' rsync could not send them all to ' ~ claude_vm_names[0] ~ ' (it exited '
                 ~ code_session_sent.rc | default('') ~ (': ' ~ code_sync_why if code_sync_why else '')
                 ~ '), so a session it did not send is there as an earlier run left it, or not at all.'
                 if code_sync_failed | bool else '')
              ~ ' claude_sessions_sync: false turns the copying off.' }}
    # --session: whether the VM's checkout was moved to the commit it is at here.
    code_session_moved: >-
      {{ code_session_id | length > 0
         and code_session_git_there.checkouts[0].head != code_session_commit }}
    # --session, whichever editor's terminal resumes it: what just code did to
    # the checkout, and what to know before claude continues there. Each
    # editor's report says how the session is resumed in it, then these.
    code_session_moved_said: "{{ ', where just code moved it' if code_session_moved | bool else '' }}"
    code_session_cautions: >-
      {{ '' if code_session_id | length == 0
         else ' The first time claude opens there it asks whether you trust the folder, and its first answer'
              ~ " reads the whole conversation again, uncached: its recorded prompt now names the VM's memory folder."
              ~ (' Remote Control runs on ' ~ claude_vm_names[0] ~ ': a session it started works from ' ~ code_root
                 ~ ', where just code cannot see it, so make sure none was editing ' ~ code_target ~ '.'
                 if code_session_remote_control.rc | default(1) == 0 else '')
              ~ (' github_projects_update_existing is on, so the next just deploy ' ~ claude_vm_names[0]
                 ~ ' --only configure switches ' ~ code_target ~ ' back to its default branch.'
                 if github_projects_update_existing | default(false) | bool else '') }}
    # The one VM this play opens, among the tagged ones: claude_vm_names[0].
    # Not claude_vm_requested, which narrows by name only when vm_name is
    # defined and is the whole tagged fleet otherwise - as in a bare just
    # deploy, whose one VM is the default one.
    code_vm_tagged: >-
      {{ claude_vm_tagged | selectattr('name', 'defined')
         | selectattr('name', 'equalto', claude_vm_names[0]) | list }}

    # What the rescue below says, or raises again outside just deploy: the
    # failed task's own message, or for a command, the command and what it
    # printed, since "non-zero return code" names neither. On one line, which
    # an SSH error need not be, and ending a sentence, as the line after it
    # starts one.
    code_failure: >-
      {{ (code_failure_text ~ ('' if code_failure_text is search('[.!?]$') else '.')) | plain_text
         | regex_replace('\s*\n\s*', ' ') }}
    code_failure_text: >-
      {{ ('`' ~ (ansible_failed_result.cmd if ansible_failed_result.cmd is string else ansible_failed_result.cmd | join(' '))
          ~ '` failed' ~ (': ' ~ ansible_failed_result.stderr | trim
                         if ansible_failed_result.stderr | default('') | trim | length > 0
                         else ' with exit code ' ~ ansible_failed_result.rc | default('?')))
         if ansible_failed_result.cmd is defined
         else ansible_failed_result.msg | default('The window step failed', true) | trim }}
    # What just deploy says when its window step failed: the failure, then the
    # just code line that opens the window once it is dealt with. A VM found
    # stopped is the exception: the deploy left it so, configured nothing on
    # it and signed nothing in, so the next step is the deploy again with the
    # VM started, which just code alone would not do.
    code_later: >-
      {{ claude_vm_names[0] ~ ' is stopped, and this deploy left it so: it was not configured, signed in or opened in'
         ~ ' ' ~ code_editor_name ~ '. To start it and finish the deploy: just deploy ' ~ claude_vm_names[0] ~ ' --start'
         if code_status | default('') == 'stopped'
         else code_failure ~ ' ' ~ code_editor_name ~ ' was not opened; to open it later: just code ' ~ claude_vm_names[0] }}

  tasks:
    # VS Code opens one VM at a time, so a deploy for several opens none, and
    # gives each VM's line here, at the end of the run where it is seen.
    - name: Leave the windows of a fleet for later
      when:
        - code_in_deploy | default(false) | bool
        - claude_vm_names | length > 1
      block:
        - name: Say how to open each VM
          ansible.builtin.debug:
            msg: >-
              {{ [code_editor_name ~ ' opens one VM at a time, so this deploy for ' ~ claude_vm_names | length
                  ~ ' VMs opened none. To open one:']
                 + claude_vm_names | map('regex_replace', '^', 'just code ') | list }}
          register: code_fleet_reported

        # NEXT STEPS (callback_plugins/claude_on_proxmox.py): the lines above,
        # once for the fleet.
        - name: Keep what is left to do for the end of the run
          ansible.builtin.set_stats:
            data:
              code_next: "{{ {claude_vm_names | join(', '): {'editor': code_fleet_reported.msg | join('\n')}} }}"
            aggregate: true
            per_host: false

        - name: Stop before the window
          ansible.builtin.meta: end_play

    # One block, so that in just deploy whatever stops the window - the
    # causes expected here, and any other, an SSH failure or an extension that
    # would not install - is said with the line that opens it later, and the
    # deploy, whose VM is done, goes on. Outside just deploy the failure
    # stands. Ansible rescues no unreachable host, which is why the first two
    # connections to the VM ignore that and say it with an assert.
    - name: Open the VM in the editor
      block:
        # The setting, or --editor, names an editor this play opens; said
        # before anything is read, here or on the VM.
        # Said by where it came from: --editor, or the setting, whose file
        # `just settings editor` names - a name a setup may have used for a
        # variable of its own before 1.1.
        - name: Refuse an editor just code cannot open
          vars:
            code_editor_given: >-
              {{ ('--editor is "' ~ vm_editor ~ '"') if vm_editor | default('', true) | length > 0
                 else 'The editor setting is "' ~ code_editor ~ '" (just settings editor says where it is set)' }}
          ansible.builtin.assert:
            that: code_editor in code_editors
            fail_msg: >-
              {{ code_editor_given }}, which just code cannot open: it opens
              {{ code_editors | dict2items | map(attribute='key') | join(' or ') }}.
            quiet: true

        # just deploy may have no vm_name: the default VM, one name all the same.
        - name: Refuse anything but one VM
          ansible.builtin.assert:
            that:
              - vm_name is defined or code_in_deploy | default(false) | bool
              - claude_vm_names | length == 1
            fail_msg: "{{ code_editor_name }} opens one VM at a time: just code <name>."
            quiet: true

        # A GitHub repository name: ASCII letters, digits, ".", "-" and "_", at
        # most 100 of them. No "/", so nothing outside the projects directory or
        # nested in it, and not "." or "..", which name the directory or its parent.
        - name: Refuse a project that is not one folder name
          vars:
            code_asked: "{{ vm_project | default('', true) | string }}"
          ansible.builtin.assert:
            that:
              - code_asked is match('^[A-Za-z0-9._-]{1,100}$')
              - code_asked not in ['.', '..']
            fail_msg: >-
              --project names one project folder on the VM, the way a GitHub repository is named: up to 100
              letters, digits, ".", "-" and "_". "{{ code_asked }}" is not one.
            quiet: true
          when: vm_project | default('', true) | string | length > 0

        - name: Refuse to run with the managed file switched off
          ansible.builtin.assert:
            that: claude_ssh_config | default(true) | bool
            fail_msg: >-
              claude_ssh_config is false, so this project keeps no SSH alias for the VM and has nothing
              to hand {{ code_editor_name }}. Set it true, or open the VM by address yourself.
            quiet: true

        - name: Refuse a VM named after a host of the inventory, or as no alias may be
          ansible.builtin.import_tasks: tasks/vm_names.yml
          vars:
            claude_vm_names_alias: true

        - name: List every VM in the cluster
          ansible.builtin.import_tasks: tasks/cluster_vms.yml

        # Tagged VMs only, as everywhere: a VM of this name without the tag is
        # not this project's, and is named as such rather than opened. With no
        # tagged VM of that name, any VM that has the name is an untagged one.
        - name: Find the VM
          vars:
            code_same_name: >-
              {{ claude_vm_all.json.data | selectattr('type', 'equalto', 'qemu')
                 | selectattr('name', 'defined') | selectattr('name', 'equalto', claude_vm_names[0]) | list }}
          ansible.builtin.assert:
            that: code_vm_tagged | length == 1
            fail_msg: >-
              {{ 'No VM named ' ~ claude_vm_names[0] ~ ' is tagged "' ~ claude_vm_tag ~ '".'
                 ~ (" A VM of that name exists but is not tagged, so it is not this project's to open."
                    if code_same_name | length > 0 else ' `just status` shows what this project created.')
                 if code_vm_tagged | length == 0
                 else 'More than one VM tagged "' ~ claude_vm_tag ~ '" is named ' ~ claude_vm_names[0]
                      ~ '; rename or remove the duplicates first.' }}
            quiet: true

        - name: Ask the VM's guest agent for its address
          ansible.builtin.import_tasks: tasks/vm_addresses.yml
          vars:
            claude_vm_query: "{{ code_vm_tagged }}"

        # What VS Code will connect to is the alias's HostName - the address, or
        # <name>.<domain> - and this run connects to the same, so the two cannot
        # disagree about whether the VM is reachable. The status is a fact, as
        # the rescue reads it too.
        - name: Settle where the VM is reached
          ansible.builtin.set_fact:
            code_reach: >-
              {{ claude_vm_names[0] ~ '.' ~ claude_ssh_host_domain
                 if claude_ssh_host_domain | default('') | length > 0 else claude_vm_addressed[0].address }}
            code_status: "{{ claude_vm_addressed[0].status | default('unknown') }}"

        # A stopped VM is refused even when its name still resolves. One line
        # of Jinja per line of text: a more-indented line in a folded scalar
        # keeps its line break.
        - name: Fail when the VM cannot be reached
          ansible.builtin.assert:
            that:
              - code_status == 'running'
              - code_reach | length > 0
            fail_msg: >-
              {{ claude_vm_names[0] }} is {{ code_status }}{{ ' and reported no address' if code_status == 'running' else '' }},
              so there is nothing to connect to. `just status` shows the fleet; start the VM, or wait for its agent, and run this again.
            quiet: true

        # The connection Ansible makes to configure the VM: its own ssh settings
        # and accept-new, not the user's ssh config, which is VS Code's business.
        # In claude_vms, so connection variables set on that group in the
        # inventory - a key, a port - apply here as they do to just deploy --only configure.
        - name: Reach the VM the way just deploy --only configure does
          ansible.builtin.add_host:
            name: "{{ claude_vm_names[0] }}"
            groups: claude_vms
            ansible_host: "{{ code_reach }}"
            ansible_user: "{{ vm_user }}"
          changed_when: false

        # Where the code lives, read on the VM as configure reads it: the VM
        # user's home, so nothing is guessed from this machine. Not needed when
        # vm_projects_dir says it outright, and the sessions' directory there
        # is given too or not needed.
        - name: Look up the VM user's home on the VM
          ansible.builtin.getent:
            database: passwd
            key: "{{ vm_user }}"
          delegate_to: "{{ claude_vm_names[0] }}"
          register: code_home
          ignore_unreachable: true
          when: >-
            vm_projects_dir | default('', true) | length == 0
            or (code_session_on | bool and code_session_dest_dir | default('', true) | length == 0)

        - name: Fail when SSH to the VM does not work
          vars:
            code_ssh: "{{ code_home }}"
          ansible.builtin.assert:
            that: not (code_ssh.unreachable | default(false))
            fail_msg: "{{ code_ssh_failed }}"
            quiet: true

        # Which of this machine's sessions go to which checkout on the VM, and
        # with --session whether it can be opened there; read-only at both ends.
        - name: Read the sessions to carry to the VM
          ansible.builtin.import_tasks: tasks/session_read.yml

        # The workspace, or one project in it: --project's, or --session's
        # checkout, which session_read.yml found by its origin. The task's own
        # names differ from the facts it sets, which would outrank them if it
        # ever ran again.
        - name: Settle the folder to open
          vars:
            code_root_given: "{{ code_projects_dir }}"
            code_project_given: "{{ vm_project | default('', true) | string or code_session_project | default('') }}"
            # just_code_dir, which just destroy's save reads the session copies'
            # manifest by too (tasks/session_save.yml).
            # editor_files_dir, its name in 1.0 only where it is not set at all:
            # an empty one is the default directory, never the old name's.
            code_ws_dir_given: >-
              {{ code_root_given | just_code_dir(editor_files_dir | default(vscode_workspaces_dir | default('', true))) }}
          ansible.builtin.set_fact:
            code_project: "{{ code_project_given }}"
            code_root: "{{ code_root_given }}"
            code_target: "{{ code_root_given ~ ('/' ~ code_project_given if code_project_given | length > 0 else '') }}"
            code_ws_dir: "{{ code_ws_dir_given }}"
            # The session notes, one file per VM, in a directory of their own.
            code_notes_dir: "{{ code_ws_dir_given ~ '/session' }}"
            code_notes_file: "{{ code_ws_dir_given ~ '/session/' ~ claude_vm_names[0] ~ '-session.md' }}"
            # One project's file in project/, so a repository that shares the
            # projects directory's name cannot collide with the whole directory's.
            code_ws_file: >-
              {{ code_ws_dir_given
                 ~ ('/project/' ~ code_project_given if code_project_given | length > 0
                    else '/' ~ (code_root_given | basename or 'projects'))
                 ~ '.code-workspace' }}

        # Paths on the VM are absolute here, with no "~" to expand: VS Code is
        # handed them as written, from this machine.
        - name: Refuse a projects directory that is not an absolute path
          ansible.builtin.assert:
            that: code_root is match('/')
            fail_msg: >-
              vm_projects_dir is a path on the VM, and must be an absolute one, not "{{ code_root }}":
              {{ code_editor_name }} is handed it as written.
            quiet: true

        # The workspace files' directory is not a project, though a --project can
        # name it, and is not the projects directory either: its files would sit
        # among the repositories, and project/ would be listed as one. Only with
        # the terminal or the sessions on, which is when the directory is used at all; it
        # is the folder opened only for the terminal, whose workspace files it holds.
        - name: Refuse a workspace directory that is not absolute, is the projects directory, or is the folder
          ansible.builtin.assert:
            that:
              - code_ws_dir is match('/')
              - code_ws_dir != code_root
              - code_target != code_ws_dir or not code_terminal
            fail_msg: >-
              {{ 'editor_files_dir is a path on the VM, and must be an absolute one, not "' ~ code_ws_dir
                 ~ '": ' ~ code_editor_name ~ ' is handed it as written.'
                 if not code_ws_dir is match('/')
                 else 'editor_files_dir is the projects directory, ' ~ code_root
                      ~ ', whose folders are the projects; name a directory of its own.'
                 if code_ws_dir == code_root
                 else code_ws_dir ~ ' on ' ~ claude_vm_names[0]
                      ~ ' is where just code keeps its own files, not a project.' }}
            quiet: true
          when: code_terminal or code_session_on | bool

        # The one VM opened is always one the person chose: named, or the
        # default of a bare deploy, which has no vm_name and runs discovery
        # here, so group_vars' claude_vm_names_chosen would be empty for it.
        - name: Refresh the alias
          ansible.builtin.import_tasks: tasks/ssh_config.yml
          vars:
            claude_ssh_state: present
            claude_ssh_vms:
              - name: "{{ claude_vm_addressed[0].name }}"
                address: "{{ claude_vm_addressed[0].address }}"
                user: "{{ vm_user }}"
                workspace: "{{ code_root }}"
            claude_vm_names_chosen: "{{ claude_vm_names }}"

        - name: Look for the folder on the VM
          ansible.builtin.stat:
            path: "{{ code_target }}"
            follow: true
            get_checksum: false
          delegate_to: "{{ claude_vm_names[0] }}"
          register: code_found
          ignore_unreachable: true

        # The first connection of this run when vm_projects_dir is set.
        - name: Fail when SSH to the VM does not work for the folder
          vars:
            code_ssh: "{{ code_found }}"
          ansible.builtin.assert:
            that: not (code_ssh.unreachable | default(false))
            fail_msg: "{{ code_ssh_failed }}"
            quiet: true

        # Only to explain a miss: what the projects directory does hold, and a
        # name that differs from the one asked for only in case - Linux paths are
        # case-sensitive, and ParkBnb is not parkbnb.
        - name: List the projects on the VM
          ansible.builtin.find:
            paths: "{{ code_root }}"
            file_type: directory
            recurse: false
          delegate_to: "{{ claude_vm_names[0] }}"
          register: code_listing
          when:
            - code_project | length > 0
            - not (code_found.stat.isdir | default(false))

        - name: Fail when the folder is not there
          vars:
            code_names: >-
              {{ code_listing.files | default([]) | map(attribute='path') | map('basename') | map('plain_text') | sort | list }}
            code_close: >-
              {{ code_names | select('match', '(?i)^' ~ (code_project | regex_escape) ~ '$') | list }}
            # find lists a path that does not exist under skipped_paths.
            code_root_there: >-
              {{ code_listing is not skipped
                 and code_listing.skipped_paths | default({}) | length == 0 }}
          ansible.builtin.assert:
            that: code_found.stat.isdir | default(false)
            fail_msg: >-
              {%- if code_project and code_found.stat.exists | default(false) -%}
              {{ code_target }} on {{ claude_vm_names[0] }} is a file, not a project folder.
              {%- elif code_project and code_names -%}
              There is no project named {{ code_project }} in {{ code_root }} on {{ claude_vm_names[0] }}.
              {{ 'Did you mean ' ~ code_close | join(' or ') ~ '? Folder names are case-sensitive.'
                 if code_close else 'The projects there are: ' ~ code_names | join(', ') ~ '.' }}
              {%- elif code_project and code_root_there | bool -%}
              {{ code_root }} on {{ claude_vm_names[0] }} holds no projects yet.
              `just deploy {{ claude_vm_names[0] }} --only configure` clones your repositories into it.
              {%- else -%}
              {{ code_root }} does not exist on {{ claude_vm_names[0] }} yet: the VM has not been configured,
              or vm_projects_dir points somewhere else. `just deploy {{ claude_vm_names[0] }} --only configure` creates it and
              clones your repositories into it.
              {%- endif -%}
            quiet: true

        # The editor on this machine, before anything is written on the VM: each
        # editor's own file, imported for that editor alone. Each registers names
        # of its own, since a skipped task still overwrites its register.
        - name: Check VS Code on this machine
          ansible.builtin.import_tasks: tasks/vscode_check.yml
          when: code_editor == 'vscode'

        - name: Check Zed on this machine
          ansible.builtin.import_tasks: tasks/zed_check.yml
          when: code_editor == 'zed'

        # The first writes on the VM, after every refusal above. just code's
        # own directory first, wherever anything goes into it: 0755 where it is
        # new - the session copies' and the notes' own directories, 0700, would
        # otherwise give it theirs as they were made - and one that exists keeps
        # its mode, since editor_files_dir may name one of the user's own, the
        # home directory included.
        - name: Look for just code's own directory on the VM
          ansible.builtin.stat:
            path: "{{ code_ws_dir }}"
            get_checksum: false
          delegate_to: "{{ claude_vm_names[0] }}"
          register: code_ws_dir_found
          when: code_writes_its_directory | bool

        - name: Make just code's own directory on the VM
          ansible.builtin.file:
            path: "{{ code_ws_dir }}"
            state: directory
            mode: "{{ omit if code_ws_dir_found.stat.exists | default(false) else '0755' }}"
          delegate_to: "{{ claude_vm_names[0] }}"
          when: code_writes_its_directory | bool

        # Then the session copies, and with --session the checkout's
        # fast-forward.
        - name: Carry the sessions to the VM
          ansible.builtin.import_tasks: tasks/session_write.yml

        # The writes on the VM, as the VM user, last: every refusal above
        # leaves the VM as it was. An unchanged file is not rewritten, so a run
        # that only reopens a window reports no change there, and a directory
        # that already exists keeps its mode: editor_files_dir may name one
        # of the user's own, the home directory included. The notes' "Signed
        # in" section is the window's to write, each time it opens: read here
        # and carried into the notes written below, so a VM whose facts did not
        # change gets the same file again.
        - name: Read the session notes already on the VM
          ansible.builtin.slurp:
            src: "{{ code_notes_file }}"
          delegate_to: "{{ claude_vm_names[0] }}"
          register: code_notes_found
          failed_when: false
          when: code_notes | bool

        # The notes say who is signed in where and the VM's addresses: the
        # VM user's alone.
        - name: Make the directory for the session notes on the VM
          ansible.builtin.file:
            path: "{{ code_notes_dir }}"
            state: directory
            mode: "0700"
          delegate_to: "{{ claude_vm_names[0] }}"
          when: code_notes | bool

        - name: Write the session notes on the VM
          vars:
            code_notes_live: >-
              {{ (code_notes_found.content | default('') | b64decode)
                 | regex_search('(?s)<!-- claude-on-proxmox:live -->.*?<!-- /claude-on-proxmox:live -->')
                 or '' }}
          ansible.builtin.copy:
            dest: "{{ code_notes_file }}"
            content: "{{ lookup('ansible.builtin.template', 'vm_session.md.j2') }}"
            mode: "0600"
          delegate_to: "{{ claude_vm_names[0] }}"
          when: code_notes | bool

        # The window: each editor's own file, imported for that editor alone -
        # what it writes on the VM beside the notes, the window it opens, and
        # what it says.
        - name: Open the window in VS Code
          ansible.builtin.import_tasks: tasks/vscode_open.yml
          when: code_editor == 'vscode'

        - name: Open the window in Zed
          ansible.builtin.import_tasks: tasks/zed_open.yml
          when: code_editor == 'zed'

      rescue:
        # Outside just deploy the failure stands, said once more: for a
        # command, with what it printed.
        - name: Fail as just code does, outside just deploy
          ansible.builtin.fail:
            msg: "{{ code_failure }}"
          when: not (code_in_deploy | default(false) | bool)

        - name: Say how to open the VM later
          ansible.builtin.debug:
            msg: "{{ code_later }}"
          register: code_later_reported

        # NEXT STEPS: the line above. For a VM the deploy left stopped it takes
        # the place of provision's line about the same thing.
        - name: Keep what is left to do for the end of the run
          ansible.builtin.set_stats:
            data:
              code_next: >-
                {{ {claude_vm_names[0]: {('vm' if code_status | default('') == 'stopped' else 'editor'):
                                         code_later_reported.msg}} }}
            aggregate: true
            per_host: false
