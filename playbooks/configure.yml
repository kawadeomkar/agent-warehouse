---
# Configure the VMs: OS baseline, developer tooling, Claude Code, a checkout
# of every GitHub project and, last, Tailscale. Finds them by tag, so it works
# on its own and not only straight after provisioning.
#
#   just deploy --only configure                    -> every VM tagged claude-on-proxmox
#   just deploy alpha,beta --only configure
#
# deploy.yml imports this with claude_vm_discovery: false, because provisioning
# has already put the VMs it was asked for into claude_vms.
- name: Discover VMs on Proxmox
  ansible.builtin.import_playbook: discover.yml
  when: claude_vm_discovery | default(true) | bool
  # tags propagate to the imported play's tasks, and "always" is what keeps
  # them running under --tags. Without it, `--tags claude_code` skips discovery,
  # claude_vms stays empty and the play below matches no hosts - so every role
  # tag silently does nothing at all.
  tags: [always]

- name: Configure Claude development VMs
  hosts: claude_vms
  become: true

  pre_tasks:
    - name: Wait for the VM to accept connections
      ansible.builtin.wait_for_connection:
        timeout: 300
      tags: [always]

    # Exit code 2 means "done with recoverable errors", which is fine for us;
    # 1 means the VM's first boot failed, which is said below with what failed.
    - name: Wait for cloud-init to finish
      ansible.builtin.command:
        cmd: cloud-init status --wait
      register: configure_cloud_init
      changed_when: false
      check_mode: false
      failed_when: false
      when: configure_wait_for_cloud_init | default(true) | bool
      tags: [always]

    - name: Read what cloud-init reported
      ansible.builtin.command:
        cmd: cloud-init status --long
      register: configure_cloud_init_long
      changed_when: false
      check_mode: false
      failed_when: false
      when:
        - configure_wait_for_cloud_init | default(true) | bool
        - configure_cloud_init.rc | default(0) not in [0, 2]
      tags: [always]

    # The VM chooses what cloud-init prints, so only the names of the modules
    # that failed are quoted, through plain_text. A first boot that failed has
    # left the VM half set up - a package upgrade cut short, say - and building
    # it again is the sure way past one that will not happen twice: a mirror,
    # a download corrupted on its way to the disk.
    - name: Fail with what cloud-init reported
      vars:
        configure_cloud_init_failed: >-
          {{ (configure_cloud_init_long.stdout | default('') | plain_text)
             | regex_findall("\('([A-Za-z0-9_]+)',") | unique | list }}
        # One line of Jinja per line of text: a more-indented line in a folded
        # scalar keeps its line break.
        configure_cloud_init_where: >-
          {{ ('in ' ~ (configure_cloud_init_failed | join(', '))) if configure_cloud_init_failed | length > 0
             else (configure_cloud_init.stdout | default('') | plain_text | regex_replace('^[.\s]+', '') | trim
                   or 'no status') }}
      ansible.builtin.fail:
        msg: >-
          {{ inventory_hostname }}: cloud-init's first boot ended in an error
          ({{ configure_cloud_init_where }}), so the VM may be half set up. /var/log/cloud-init-output.log on it says why.
          Building it again is the sure way past a failure that will not repeat - a mirror, a corrupted download:
          just destroy {{ inventory_hostname }}, then just deploy {{ inventory_hostname }}. Or
          repair it by hand, then ANSIBLE_ARGS='-e configure_wait_for_cloud_init=false'
          just deploy {{ inventory_hostname }} --only configure.
      when:
        - configure_wait_for_cloud_init | default(true) | bool
        - configure_cloud_init.rc | default(0) not in [0, 2]
      tags: [always]

    # Before the roles, whose modules would make it and warn; tagged like the
    # waits, since a role run alone by --tags can be a new VM's first.
    - name: Make root's Ansible temporary directory
      ansible.builtin.import_tasks: tasks/remote_tmp.yml
      tags: [always]

  roles:
    - role: common
      tags: [common]
    # After common, which owns the user and sshd: this adds a second sshd
    # drop-in and checks the result against what sshd runs with.
    - role: vscode_server
      tags: [vscode_server]
    - role: dev_tools
      tags: [dev_tools]
    - role: claude_code
      tags: [claude_code]
    - role: github_projects
      tags: [github_projects]

  # Tailscale last, and never the VM's undoing: it is optional, so a failure in
  # it is recorded here and raised at the end of the run - by the last play
  # below, or under just deploy by deploy's own, after the editor - while the VM
  # still gets its alias. From tasks:, which run after roles: and before
  # post_tasks:. import_role, not include_role: a static import takes the
  # block's tag, so just deploy <vm> --tags tailscale runs every task of the role,
  # where an include's tag would reach only the include.
  #
  # Off (vpn not tailscale: tailscale_wanted), the role runs only on a VM where it
  # installed Tailscale, or began to - the marker install.yml writes first - to
  # log it out and remove it, saying so; a VM without one gets this one read and
  # nothing else of Tailscale's. The condition is the import's, so each of the
  # role's tasks carries it, and on the task rather than the block, whose
  # condition would be its rescue's too.
  tasks:
    - name: Install Tailscale and keep it joined
      tags: [tailscale]
      block:
        - name: Look for a Tailscale this project installed, now that it is off
          ansible.builtin.stat:
            path: "{{ tailscale_installed_marker_path }}"
          register: claude_vm_tailscale_marker
          when: not (tailscale_wanted | bool)

        - name: Run the tailscale role
          ansible.builtin.import_role:
            name: tailscale
          when: tailscale_wanted | bool or claude_vm_tailscale_marker.stat.exists | default(false)
      rescue:
        - name: Remember that Tailscale failed, for the end of the run
          vars:
            claude_vm_tailscale_why: "{{ ansible_failed_result.msg | default('no message', true) | one_line(none) }}"
          ansible.builtin.set_fact:
            claude_vm_configure_failures: >-
              {{ claude_vm_configure_failures | default([])
                 + [(inventory_hostname ~ ': Tailscale failed at "' ~ (ansible_failed_task.name | default('a task'))
                     ~ '": ' ~ claude_vm_tailscale_why)
                    | retry_line('just deploy ' ~ inventory_hostname ~ ' --tags tailscale')] }}

        - name: Say why, and go on
          ansible.builtin.debug:
            msg: "{{ claude_vm_configure_failures | last }}"

    # WireGuard's key, made on the VM, and its public key read for the members'
    # plan in the play after this one, which gives each VM its address; the
    # link itself is set up by the play after that. Off (vpn not wireguard:
    # wireguard_wanted), the role runs only on a VM where its marker is, to take
    # off what it set up. Like Tailscale's: a failure is recorded and raised at
    # the end of the run, the import static for --tags wireguard, and the
    # conditions on the tasks rather than the block.
    - name: Make the VM's WireGuard key, or take WireGuard off
      tags: [wireguard]
      block:
        - name: Look for a WireGuard this project set up, now that it is off
          ansible.builtin.stat:
            path: "{{ wireguard_installed_marker_path }}"
          register: claude_vm_wireguard_marker
          when: not (wireguard_wanted | bool)

        - name: Make the VM's WireGuard key
          ansible.builtin.import_role:
            name: wireguard
            tasks_from: key
          when: wireguard_wanted | bool

        - name: Take WireGuard off
          ansible.builtin.import_role:
            name: wireguard
          when: not (wireguard_wanted | bool) and claude_vm_wireguard_marker.stat.exists | default(false)
      rescue:
        - name: Remember that WireGuard failed, for the end of the run
          vars:
            claude_vm_wireguard_why: "{{ ansible_failed_result.msg | default('no message', true) | one_line(none) }}"
          ansible.builtin.set_fact:
            claude_vm_configure_failures: >-
              {{ claude_vm_configure_failures | default([])
                 + [(inventory_hostname ~ ': WireGuard failed at "' ~ (ansible_failed_task.name | default('a task'))
                     ~ '": ' ~ claude_vm_wireguard_why)
                    | retry_line('just deploy ' ~ inventory_hostname ~ ' --tags wireguard')] }}

        - name: Say why WireGuard failed, and go on
          ansible.builtin.debug:
            msg: "{{ claude_vm_configure_failures | last }}"

  # What the editor opens: vm_projects_dir, or ~/projects of the VM user,
  # resolved here on the VM where the home directory is known rather than
  # guessed on the controller (Ansible's own user_dir fact is the connecting
  # user's home, which under Molecule is root's). Last, so a host that failed
  # a role never records one and never gets an alias. Tagged "always" like
  # discovery, so a `just deploy <vm> --tags ...` still refreshes the alias.
  post_tasks:
    - name: Look up the VM user's home directory
      ansible.builtin.getent:
        database: passwd
        key: "{{ vm_user }}"
      tags: [always]

    - name: Record where the code lives, for the alias play below
      ansible.builtin.set_fact:
        claude_vm_workspace: >-
          {{ vm_projects_dir | default('', true) | projects_dir(ansible_facts.getent_passwd[vm_user][4]) }}
      tags: [always]

# Records in Proxmox, where the VM cannot change it, each VM whose Tailscale has
# held a login - Tailscale's plan (tasks/vpn_members.yml), its marks applied
# (tasks/vpn_apply.yml) - so that the vault's key is never sent to it again:
# right after the role, which says which ones have.
- name: Record in Proxmox each VM whose Tailscale has had a login
  hosts: localhost
  gather_facts: false
  tags: [tailscale]
  module_defaults:
    group/community.proxmox.proxmox: "{{ proxmox_api_module_defaults }}"

  tasks:
    - name: Plan Tailscale's record of each VM
      ansible.builtin.import_tasks: tasks/vpn_members.yml
      vars:
        claude_vpn_planned: tailscale
        claude_vpn_hosts: "{{ groups['claude_vms'] | default([]) }}"
        claude_vpn_phase: configure

    - name: Record each VM
      ansible.builtin.import_tasks: tasks/vpn_apply.yml

# WireGuard's plan of its members (tasks/vpn_members.yml): each VM's address,
# kept as a mark in Proxmox, its tunnel, and the peer its server is to have,
# said (docs/guides/wireguard.md). After the configure play, which read each
# VM's public key; the plan refuses before anything is written when the
# settings cannot work (wireguard_hub_network, wireguard_vm_prefix, the
# server's key and endpoint).
- name: Plan each VM's place on the WireGuard network
  hosts: localhost
  gather_facts: false
  tags: [wireguard]
  module_defaults:
    group/community.proxmox.proxmox: "{{ proxmox_api_module_defaults }}"

  # In a block whose rescue records the failure on every VM, raised at the end
  # of the run like the roles': a refusal of the settings, or a hub that cannot
  # be read or written, never costs a VM its SSH alias, nor deploy its editor.
  tasks:
    - name: Plan and apply WireGuard's members
      block:
        - name: Plan WireGuard's members
          ansible.builtin.import_tasks: tasks/vpn_members.yml
          vars:
            claude_vpn_planned: wireguard
            claude_vpn_hosts: "{{ groups['claude_vms'] | default([]) }}"
            claude_vpn_phase: configure
          when: wireguard_wanted | bool

        - name: Apply WireGuard's plan
          ansible.builtin.import_tasks: tasks/vpn_apply.yml
          when: wireguard_wanted | bool
      rescue:
        # No plan: the play below changes no VM's link this run.
        - name: Drop WireGuard's plan
          ansible.builtin.set_fact:
            claude_vpn_plans: "{{ claude_vpn_plans | default({}) | combine({'wireguard': {}}) }}"

        - name: Remember that WireGuard's plan failed, on each VM, for the end of the run
          vars:
            claude_vm_wireguard_why: "{{ ansible_failed_result.msg | default('no message', true) | one_line(none) }}"
          ansible.builtin.set_fact:
            claude_vm_configure_failures: >-
              {{ hostvars[claude_vm_wireguard_of].claude_vm_configure_failures | default([])
                 + [(claude_vm_wireguard_of ~ ': WireGuard failed at "' ~ (ansible_failed_task.name | default('a task'))
                     ~ '": ' ~ claude_vm_wireguard_why)
                    | retry_line('just deploy ' ~ claude_vm_wireguard_of ~ ' --tags wireguard')] }}
          delegate_to: "{{ claude_vm_wireguard_of }}"
          delegate_facts: true
          loop: "{{ groups['claude_vms'] | default([]) }}"
          loop_control:
            loop_var: claude_vm_wireguard_of

        - name: Say why WireGuard's plan failed, and go on
          vars:
            claude_vm_wireguard_why: "{{ ansible_failed_result.msg | default('no message', true) | one_line(none) }}"
          ansible.builtin.debug:
            msg: >-
              WireGuard failed at "{{ ansible_failed_task.name | default('a task') }}":
              {{ claude_vm_wireguard_why | full_stop }} No VM's link is changed this run.

# Each VM's link, as the plan has it: the role's main, in a block whose rescue
# records a failure, raised at the end of the run, so the VM still gets its
# alias.
- name: Join each VM to the WireGuard network
  hosts: claude_vms
  gather_facts: false
  become: true
  tags: [wireguard]

  tasks:
    - name: Join the WireGuard network
      block:
        - name: Set the VM's link up as the plan has it
          ansible.builtin.import_role:
            name: wireguard
          vars:
            wireguard_tunnel: >-
              {{ (hostvars['localhost'].claude_vpn_plans | default({})).wireguard.tunnels | default([])
                 | selectattr('vm.name', 'equalto', inventory_hostname) | first | default({}, true) }}
          when: wireguard_wanted | bool
      rescue:
        - name: Remember that WireGuard's link failed, for the end of the run
          vars:
            claude_vm_wireguard_why: "{{ ansible_failed_result.msg | default('no message', true) | one_line(none) }}"
          ansible.builtin.set_fact:
            claude_vm_configure_failures: >-
              {{ claude_vm_configure_failures | default([])
                 + [(inventory_hostname ~ ': WireGuard failed at "' ~ (ansible_failed_task.name | default('a task'))
                     ~ '": ' ~ claude_vm_wireguard_why)
                    | retry_line('just deploy ' ~ inventory_hostname ~ ' --tags wireguard')] }}

        - name: Say why WireGuard's link failed, and go on
          ansible.builtin.debug:
            msg: "{{ claude_vm_configure_failures | last }}"

# One SSH alias per VM on this machine, so `ssh alpha` and the editor follow
# the address DHCP gave it (docs/guides/vscode.md). A localhost play after the
# roles: the alias must not exist before the VM is ready, and the configure play
# has just recorded where each VM's code lives. Only a VM that finished that
# play gets one.
# Tagged "always" like discovery, so `just deploy <vm> --tags ...` still
# refreshes an address that moved; `claude_ssh_config: false` keeps this
# project out of ~/.ssh entirely.
- name: Keep an SSH alias for each configured VM
  hosts: localhost
  gather_facts: false
  tags: [always]

  tasks:
    - name: Collect each configured VM's name, address and workspace
      vars:
        claude_ssh_vm_vars: "{{ hostvars[claude_ssh_host] }}"
        # Under vpn_reach: tunnel, the address WireGuard's plan gave the VM this run, which its marks read at
        # discovery may not hold yet; else the one they hold, else its LAN address (vpn_alias_address).
        claude_ssh_planned_alias: >-
          {{ ((claude_vpn_plans | default({})).get('wireguard') or {}).get('aliases', [])
             | selectattr('vm.name', 'equalto', claude_ssh_host) | map(attribute='address') | first | default('') }}
      ansible.builtin.set_fact:
        claude_ssh_configured: >-
          {{ claude_ssh_configured | default([]) + [{
               'name': claude_ssh_host,
               'address': claude_ssh_planned_alias
                          or (claude_ssh_vm_vars.ansible_host | default(claude_ssh_host)
                              | vpn_alias_address(claude_ssh_vm_vars.claude_vm_marks | default([]),
                                                  claude_vpn_key | default('none'), vpn_reach | default('lan'))),
               'user': claude_ssh_vm_vars.vm_user | default(vm_user),
               'workspace': claude_ssh_vm_vars.claude_vm_workspace,
             }] }}
      loop: "{{ groups['claude_vms'] | default([]) }}"
      loop_control:
        loop_var: claude_ssh_host
      when:
        - claude_ssh_config | default(true) | bool
        - hostvars[claude_ssh_host].claude_vm_workspace is defined

    - name: Write the aliases
      ansible.builtin.import_tasks: tasks/ssh_config.yml
      vars:
        claude_ssh_state: present
        claude_ssh_vms: "{{ claude_ssh_configured | default([]) }}"
      when:
        - claude_ssh_config | default(true) | bool
        - claude_ssh_configured | default([]) | length > 0

# What failed in a configured VM - Tailscale's role, which configure carries on
# past - fails it here, at the end, after its alias is written. just deploy
# imports this playbook with claude_vm_configure_in_deploy and raises the same
# list in its own last play, after the sign-ins and the editor's window.
- name: Fail each VM whose configuration failed past a rescue
  hosts: claude_vms
  gather_facts: false
  tags: [always]

  tasks:
    - name: Fail where Tailscale failed
      ansible.builtin.fail:
        msg: "{{ claude_vm_configure_failures | join(' ') }}"
      when:
        - claude_vm_configure_failures | default([]) | length > 0
        - not (claude_vm_configure_in_deploy | default(false) | bool)
