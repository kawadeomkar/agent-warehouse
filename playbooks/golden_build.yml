---
# The golden template the next deploy's VMs will clone
# (docs/architecture/lifecycle.md §4.14). Last in just deploy: this run's VMs are
# ready and the editor is open, so no VM waits for it. What earlier runs left
# is deleted whether golden templates are on or off. Every play reaches Proxmox
# only through proxmox_template's golden entry points, so no line here reads its
# API (tests/unit/test_ratchets.py). A build that fails, or one another run has
# under way, is said once and never fails the deploy.

- name: Build the golden template the next VMs will clone
  hosts: localhost
  gather_facts: false
  vars:
    claude_vm_golden_pending_vms: "{{ groups['claude_vm_golden_pending'] | default([]) }}"
    # What to build: one key, as the VMs that want a golden share their options
    # and their base.
    claude_vm_golden_target: >-
      {{ dict(claude_vm_golden_pending_vms
              | zip(claude_vm_golden_pending_vms | map('extract', hostvars, 'proxmox_template_golden_choice')
                    | map('default', {})))
         | golden_targets }}
    claude_vm_golden_wanted: >-
      {{ proxmox_template_golden | default(false) | bool and claude_vm_golden_target | length > 0
         and not ansible_check_mode }}
  tasks:
    - name: Delete what earlier runs left
      ansible.builtin.include_role:
        name: proxmox_template
        tasks_from: golden_collect
      vars:
        proxmox_template_golden_target: "{{ claude_vm_golden_target }}"
      when: not ansible_check_mode

    - name: Say that another run is building it
      ansible.builtin.debug:
        msg: >-
          Another run is building the golden template these VMs would use ({{ claude_vm_golden_target.vms
          | join(', ') }}), so this one builds none.
      when:
        - claude_vm_golden_wanted | bool
        - proxmox_template_build_busy | default(false) | bool

    - name: Build the golden template
      block:
        - name: Build its VM
          ansible.builtin.include_role:
            name: proxmox_template
            tasks_from: golden_build
          vars:
            proxmox_template_golden_target: "{{ claude_vm_golden_target }}"
          when:
            - claude_vm_golden_wanted | bool
            - not (proxmox_template_build_busy | default(false) | bool)

        - name: Make the folder a build VM's host key is kept in
          ansible.builtin.file:
            path: "{{ proxmox_template_build_vm.known_hosts | dirname }}"
            state: directory
            mode: "0700"
          when: (proxmox_template_build_vm | default({})).name is defined

        # Through the Proxmox host: its login, if this run put it off, and its
        # forward, where the run's VMs made none (each brought a jump of its
        # own). A hop either found unusable fails into the rescue here.
        - name: Check the route to the build VM
          ansible.builtin.import_tasks: tasks/vm_route.yml
          vars:
            claude_vm_route_vms: "{{ [proxmox_template_build_vm] }}"
          when: (proxmox_template_build_vm | default({})).name is defined

        # The aliases go on past a hop they found unusable (tasks/vm_route.yml
        # records it): a build VM that would go through it is never added, so
        # the build fails here, not after a 300 s wait.
        - name: Refuse a build VM that would go through a Proxmox host this run could not use
          vars:
            claude_vm_build_through: >-
              {{ claude_vm_route | default({})
                 | vm_hop(proxmox_template_build_vm.address, ansible_ssh_common_args | default(lookup(
                          'ansible.builtin.config', 'ssh_common_args', plugin_type='connection', plugin_name='ssh')),
                          ansible_ssh_extra_args | default('')) }}
          ansible.builtin.assert:
            that: >-
              claude_vm_build_through.via | length == 0
              or 'failed' not in [claude_vm_route.login | default(''), claude_vm_route.forward | default('')]
            fail_msg: >-
              The build VM is reached through {{ claude_vm_route.hop.label | default('the Proxmox host') }}, which
              this run found could not be used as the hop (said above).
            quiet: true
          when: (proxmox_template_build_vm | default({})).name is defined

        # How to reach it goes on the host, never on a play (CLAUDE.md). An
        # empty become password: cloud-init's own rule covers the build, and the
        # vault's password is never sent to it.
        - name: Add the build VM as a host
          ansible.builtin.add_host:
            name: "{{ proxmox_template_build_vm.name }}"
            groups: claude_vm_build
            ansible_host: "{{ proxmox_template_build_vm.address }}"
            ansible_user: "{{ vm_user }}"
            ansible_python_interpreter: "{{ claude_vm_python }}"
            ansible_become_password: ""
            # Its key in a file of the build's own, by its address: the VM lives
            # for the build alone. No agent forwarded, as no VM of the fleet is
            # (vm_ssh_args); ssh, sftp and scp alike, the configured common args
            # after them (discover.yml says why). Through the Proxmox host, the
            # hop between the two and a socket named with it; otherwise none of
            # its own, which Ansible reads as its own default.
            claude_vm_ssh_via: "{{ claude_vm_build_hop.via }}"
            ansible_ssh_common_args: >-
              {{ '' | vm_ssh_args(proxmox_template_build_vm.known_hosts) }} -o StrictHostKeyChecking=accept-new
              {{ (claude_vm_build_hop.option ~ ' ') if claude_vm_build_hop.option else '' }}{{ ansible_ssh_common_args
                 | default(lookup('ansible.builtin.config', 'ssh_common_args', plugin_type='connection',
                                  plugin_name='ssh')) }}
            ansible_control_path: >-
              {{ '%(directory)s/' ~ ('' | vm_control_name(proxmox_template_build_vm.address, claude_vm_build_hop.name))
                 ~ '-%%r-%%p' if claude_vm_build_hop.name else '' }}
          vars:
            claude_vm_build_hop: >-
              {{ claude_vm_route | default({})
                 | vm_hop(proxmox_template_build_vm.address, ansible_ssh_common_args | default(lookup(
                          'ansible.builtin.config', 'ssh_common_args', plugin_type='connection', plugin_name='ssh')),
                          ansible_ssh_extra_args | default('')) }}
          changed_when: false
          when: (proxmox_template_build_vm | default({})).name is defined

        # A host var or an extra var of the same name outranks the options above, and would reach the build VM on the
        # user's own file without a word, as tasks/host_keys.yml refuses for a VM of the fleet.
        - name: Refuse a build VM whose connection would not check its host key as the build files it
          vars:
            claude_vm_build_unheld: >-
              {{ [proxmox_template_build_vm.name] | vm_ssh_unheld(hostvars, proxmox_template_build_vm.known_hosts) }}
          ansible.builtin.assert:
            that: claude_vm_build_unheld | length == 0
            fail_msg: >-
              ansible_ssh_common_args is set somewhere that outranks the build VM's own (a host var or -e), so the
              connection would not hold its host key to {{ proxmox_template_build_vm.known_hosts }}. Set
              ansible_ssh_extra_args for options of your own instead.
            quiet: true
          when: (proxmox_template_build_vm | default({})).name is defined

        - name: Hold the build VM to the route
          ansible.builtin.import_tasks: tasks/vm_route_held.yml
          vars:
            claude_vm_route_held: "{{ [proxmox_template_build_vm.name] }}"
          when: (proxmox_template_build_vm | default({})).name is defined
      rescue:
        - name: Delete what the build made
          ansible.builtin.include_role:
            name: proxmox_template
            tasks_from: golden_discard

        - name: Say the build failed
          ansible.builtin.debug:
            msg: >-
              The golden template could not be built ({{ ansible_failed_task.name | default('') }}:
              {{ ansible_failed_result.msg | default('no reason') | plain_text }}). The VMs are not affected.

# The group by its hosts, which may be none: named, every run that builds no
# golden has Ansible warn that the pattern matched nothing.
- name: Set up the golden template's build VM
  hosts: "{{ groups['claude_vm_build'] | default([]) }}"
  gather_facts: false
  become: true
  # A build VM that stops answering is the build failed, never the deploy.
  ignore_unreachable: true
  tasks:
    # Through the Proxmox host, its shared connection made sure of before the
    # VMs are reached at once (tasks/vm_route.yml). Fails no host: a hop that is
    # gone shows as each VM not answering, which this play already handles.
    - name: Make sure of the connection through the Proxmox host
      vm_route:
        do: held
        route: "{{ hostvars['localhost'].claude_vm_route | default({}) }}"
      delegate_to: localhost
      run_once: true
      become: false
      check_mode: false
      failed_when: false
      when: >-
        ansible_play_hosts_all | map('extract', hostvars) | map(attribute='claude_vm_ssh_via', default='')
        | select | list | length > 0

    # claude_vm_golden_image false, for the tests alone, skips what reaches
    # the VM, so the plays around it can be run against the fake Proxmox
    # (tests/unit/test_golden_play.py); the image is the image scenario's.
    - name: Set up the build VM
      when: claude_vm_golden_image | default(true) | bool
      block:
        - name: Wait for the build VM to accept connections
          ansible.builtin.wait_for_connection:
            timeout: 300

        - name: Wait for the build VM's first boot to finish
          ansible.builtin.command:
            cmd: cloud-init status --wait
          register: claude_vm_golden_first_boot
          changed_when: false
          failed_when: claude_vm_golden_first_boot.rc not in [0, 2]

        - name: Read the build VM's facts
          ansible.builtin.setup:

        - name: Make root's Ansible temporary directory
          ansible.builtin.import_tasks: tasks/remote_tmp.yml

        - name: Put common's part of the image on it
          ansible.builtin.include_role:
            name: common
            tasks_from: image

        - name: Put dev_tools' part of the image on it
          ansible.builtin.include_role:
            name: dev_tools
            tasks_from: image

        - name: Put claude_code's part of the image on it
          ansible.builtin.include_role:
            name: claude_code
            tasks_from: image

        # Before the scrub: it deletes the host keys, after which sshd cannot start.
        - name: Restart what the image's changes need
          ansible.builtin.meta: flush_handlers

        - name: Make the build VM a VM of no one
          ansible.builtin.import_tasks: tasks/golden_generalize.yml
      rescue:
        - name: Record why the image was not built
          ansible.builtin.set_fact:
            claude_vm_golden_failure: >-
              {{ ansible_failed_task.name | default('') }}: {{ ansible_failed_result.msg | default('no reason') | plain_text }}

    # Built only once the scrub's last step ran: ignore_unreachable keeps a VM
    # that stopped answering in the play, and its rescue never sees that.
    - name: Record the image as built
      ansible.builtin.set_fact:
        claude_vm_golden_built: >-
          {{ claude_vm_golden_failure is not defined
             and (not (claude_vm_golden_image | default(true) | bool)
                  or (golden_generalize_done is defined and golden_generalize_done is succeeded
                      and not (golden_generalize_done.unreachable | default(false) | bool))) }}

- name: Make the build VM a golden template
  hosts: localhost
  gather_facts: false
  vars:
    claude_vm_golden_build_host: "{{ (proxmox_template_build_vm | default({})).name | default('') }}"
    claude_vm_golden_image_built: >-
      {{ claude_vm_golden_build_host | length > 0
         and hostvars[claude_vm_golden_build_host].claude_vm_golden_built | default(false) | bool }}
  tasks:
    # The condition on the task, never the block: a block's when is its rescue's
    # too, and the rescue's discard forgets the build VM that when reads.
    - name: Make it a template
      block:
        - name: Make the golden template
          ansible.builtin.include_role:
            name: proxmox_template
            tasks_from: golden_template
          when: claude_vm_golden_image_built | bool
      rescue:
        - name: Delete the build VM the template step failed on
          ansible.builtin.include_role:
            name: proxmox_template
            tasks_from: golden_discard

        - name: Say the golden template could not be made
          ansible.builtin.debug:
            msg: >-
              The golden template could not be made ({{ ansible_failed_task.name | default('') }}:
              {{ ansible_failed_result.msg | default('no reason') | plain_text }}). The VMs are not affected.

    # A build VM that never answered, through the Proxmox host: that it did not
    # answer there, read from the build VM's own variables, and never just
    # status, which cannot read a build VM.
    - name: Say the image could not be built
      vars:
        claude_vm_golden_failure_said: >-
          {{ hostvars[claude_vm_golden_build_host].claude_vm_golden_failure | default('the build VM stopped answering') }}
      ansible.builtin.debug:
        msg: >-
          The golden template's image could not be built ({{ claude_vm_golden_failure_said }}). The VMs are not affected.
          {{ claude_vm_route | default({}) | vm_gone_said(hostvars[claude_vm_golden_build_host].claude_vm_ssh_via
                                                          | default(''))
             if hostvars[claude_vm_golden_build_host].claude_vm_golden_failure is not defined
                or claude_vm_golden_failure_said is search('^Wait for the build VM to accept connections')
             else '' }}
      when:
        - claude_vm_golden_build_host | length > 0
        - not (claude_vm_golden_image_built | bool)

    - name: Delete the build VM whose image failed
      ansible.builtin.include_role:
        name: proxmox_template
        tasks_from: golden_discard
      when:
        - claude_vm_golden_build_host | length > 0
        - not (claude_vm_golden_image_built | bool)
