---
# Sign the VMs in to Tailscale by its web login, or say how each one is on it.
#
#   just login alpha --only tailscale        -> signs alpha in: a page opens here
#   just login alpha,beta --only tailscale   -> the same, one VM after the other
#   just login --only tailscale                      -> reports every VM's state
#
# With vault_tailscale_auth_key set, just deploy --only configure joins each new VM by
# itself. Without one the join is Tailscale's web login, which ends with a
# person approving a page: this runs it as far as it goes - one `tailscale up`
# on the VM, the page read from its state, the page opened on this machine
# (login_desktop), the approval waited for, up to tailscale_login_timeout. A VM
# approved after that joins by itself; this says so. just deploy imports this
# playbook for the VMs it configured, after GitHub's sign-in, and asks VM by
# VM first: Enter signs in a VM whose Claude code was entered, "y" one that
# showed no Claude prompt, and one whose Claude prompt got Enter is left. A run
# with no terminal asks nothing, and signs in no VM it would have asked about.
- name: Discover VMs on Proxmox
  ansible.builtin.import_playbook: discover.yml
  when: claude_vm_discovery | default(true) | bool

# Every VM at once, before any prompt: rescue never sees an unreachable host,
# and under serial an unreachable VM is a whole batch failed, which ends the
# run. One that does not answer is said, skipped below, and failed at the end.
- name: Reach each VM before its sign-in
  hosts: claude_vms
  gather_facts: false

  tasks:
    - name: Reach the VM
      ansible.builtin.ping:
      ignore_unreachable: true
      register: claude_vm_reach

    # Said, and kept for NEXT STEPS under the sign-in's own matter, which a
    # later record of the VM would replace.
    - name: Remember, say and record that the VM could not be reached
      ansible.builtin.import_tasks: tasks/sign_in_failed.yml
      vars:
        claude_vm_sign_in: tailscale
        claude_vm_sign_in_why: >-
          {{ inventory_hostname }} could not be reached, so it was not signed in to Tailscale:
          {{ claude_vm_reach.msg | default('no answer', true) | one_line(none) }}
      when: claude_vm_reach is unreachable

# One VM at a time where a sign-in can prompt - names given, or just deploy -
# since each opens its own page and waits for its own approval; a report reads
# the fleet at once. A failure is caught here, said, and raised by the last
# play, unless it is the person aborting at a prompt.
- name: Sign each VM in to Tailscale, or say how it is on it
  hosts: claude_vms
  become: true
  gather_facts: false
  # Names given, whether the sign-in starts or asks, a VM held back or left
  # unasked, one VM at a time: the rules the sign-in plays share.
  vars_files:
    - vars/sign_in.yml
  vars:
    # The switch those rules read for this sign-in: off, just deploy and just
    # login ask before they start it.
    claude_vm_login_auto_start: "{{ tailscale_login_auto_start | default(true) }}"
  serial: "{{ 1 if claude_vm_login_batched | bool else '100%' }}"

  tasks:
    - name: Sign this VM in
      block:
        # The decision is the tailscale role's, so this and just deploy --only configure
        # cannot disagree about how a VM is on Tailscale.
        # tests/unit/test_tailscale.py runs this playbook against stand-ins.
        - name: Report how the VM is on Tailscale, and sign it in when asked to
          ansible.builtin.include_role:
            name: tailscale
            tasks_from: login
          vars:
            # Names given (any number), or just deploy for a VM whose Claude
            # code was entered: sign in. Asked first where the rules say so -
            # but never where nobody can answer (claude_vm_login_unasked), and
            # then nothing starts.
            tailscale_login_interactive: "{{ claude_vm_login_starts | bool and not (claude_vm_login_unasked | bool) }}"
            tailscale_login_ask: "{{ claude_vm_login_asks | bool and not (claude_vm_login_unasked | bool) }}"
          # On the task, not the block: a block's condition is its rescue's
          # too, read again for each task, and the rescue sets this fact.
          when: claude_vm_tailscale_login_failure is not defined

        # The role's report says the VM is not signed in; this says why
        # nothing signed it in, where the web login would have run - so a VM
        # on Tailscale already, joined by the key, or with a Tailscale of its
        # own hears nothing of it.
        - name: Say why Tailscale's sign-in was not started, where it was held back
          ansible.builtin.import_tasks: tasks/sign_in_held.yml
          vars:
            claude_vm_sign_in: tailscale
            claude_vm_sign_in_service: Tailscale
            claude_vm_sign_in_due: "{{ tailscale_login_due | default(false) }}"
            # In NEXT STEPS only for a VM merely signed out
            # (tailscale_login_signed_out, the role's): a page still waiting,
            # an expired login or a refused key keeps the role's own line,
            # which says what to do about it - a new key in the vault, or the
            # page to approve, which a fresh one would end.
            claude_vm_sign_in_replaces_report: "{{ tailscale_login_signed_out | default(false) }}"
          when: claude_vm_tailscale_login_failure is not defined
      rescue:
        - name: Stop the run when the person aborted at the prompt
          ansible.builtin.fail:
            msg: "{{ ansible_failed_result.msg }}"
          when: ansible_failed_result.msg | default('') is search('user requested abort')

        # Said with the command that retries it, and kept for NEXT STEPS in
        # place of whatever an earlier report of the run left for this VM's
        # sign-in.
        - name: Remember, say and record why the sign-in failed
          ansible.builtin.import_tasks: tasks/sign_in_failed.yml
          vars:
            claude_vm_sign_in: tailscale
            claude_vm_sign_in_why: "{{ ansible_failed_result.msg | default('the sign-in failed', true) | string | trim }}"

# Records in Proxmox each VM whose Tailscale has had a login, as configure.yml
# does after the role (tasks/tailscale_record.yml): a login this sign-in made, a
# page still waiting, one found. After the last prompt, so that it holds no VM's
# sign-in back, and before the last play, since a play in which every VM fails
# ends the run.
- name: Record in Proxmox each VM whose Tailscale has had a login
  hosts: localhost
  gather_facts: false
  module_defaults:
    group/community.proxmox.proxmox: "{{ proxmox_api_module_defaults }}"

  tasks:
    - name: Record each VM
      ansible.builtin.import_tasks: tasks/tailscale_record.yml
      vars:
        claude_vm_tailscale_record_vms: "{{ groups['claude_vms'] | default([]) }}"

# just deploy carries on past a sign-in that failed - the person's to finish
# later with just login --only tailscale; this command exists to sign in, so here the
# run fails, VM by VM - unless just login runs the three sign-ins
# (claude_vm_login_raised_later), whose own last play raises it.
- name: Fail each VM whose sign-in failed
  hosts: claude_vms
  gather_facts: false

  tasks:
    - name: Fail where the sign-in failed
      ansible.builtin.fail:
        msg: "{{ claude_vm_tailscale_login_failure }}"
      when:
        - claude_vm_tailscale_login_failure is defined
        - not (claude_vm_login_in_deploy | default(false) | bool)
        - not (claude_vm_login_raised_later | default(false) | bool)
