---
# just init's second step: check, read-only, what just deploy will need of
# Proxmox, with the settings exactly as just deploy will read them - this run
# loads the project's inventory and the vault, where init_settings.yml could
# not.
#
#   just init            after its questions, when the vault can be opened
#
# Configured yet? With the host's address or the token's secret still the
# example's, nothing is checked, and the run says what is missing. Then: the
# vault is encrypted; the API answers and takes the token; the token holds
# every privilege the project uses on /vms; the template exists, and while it
# does not, root SSH to the Proxmox host works (the template is built over it),
# which also says the host's node name. Then what the defaults leave to the
# host: the node, worked out - the template's, the only one, or the one SSH
# reached - and never chosen; and the storage for VM disks and the template's
# bridge, each listed with what the token can use. Last, the VMs will get an SSH
# key. Each check reports ok, a problem, or why it was skipped, and the run
# fails when any found a problem - a scripted just init then exits non-zero -
# though "not configured yet" is none. NEXT STEPS then gives each problem with
# its fix, or, once there is none, just deploy; and a note, which fails
# nothing, while the API's certificate is not checked.
#
# Before the first request that carries the token, while nothing checks the
# API's certificate, it works out what makes the certificate verify and keeps
# it in the host's trust file (proxmox_trust_file), which turns checking on.
#
# It writes only local.yml, through tasks/init_local_setting.yml, and that
# trust file, and only at a terminal (init_ask) or for a value given on the
# command line (--storage, --bridge): the node when the default is not it, the
# storage or bridge chosen, proxmox_validate_certs where this machine's trust
# store verifies the API. A certificate that verifies but is not kept is
# copied into the checkout's .cache for the rest of the run to be checked
# against, and removed. Everything else is a read (tests/unit/test_init_check.py
# holds both) - over root SSH, hostname -s and the host's two certificates; and
# where the VMs will be reached through the host (vm_ssh_route), the hop's
# login, an SSH connection that runs nothing - and root SSH, or the hop's, may
# add the host's key to ~/.ssh/known_hosts, as the template build would, one of
# the two files the project writes there. Every name it sets
# starts with init_, like init_settings.yml's, whose init_ask, init_given,
# files, placeholders and reads of local.yml and the vault it shares through
# vars/init.yml.
#
# For another host (init_host: just init --host), the run reads that host's
# sources over the shared ones, as every run against it does, and once every
# check has passed it writes into the host's own local.yml each setting the host
# sets for itself that it does not set yet - the node, the storage and the bridge
# as the checks settled them, the rest as the shared files have them - and its
# default VM's name: a run against the host refuses it until then.
- name: Check what just deploy will need of Proxmox
  hosts: localhost
  gather_facts: false
  vars_files:
    - vars/init.yml
  vars:
    # Where to look for a public key when the VMs would get none.
    init_ssh_dir: "{{ lookup('ansible.builtin.env', 'HOME') }}/.ssh"
    # The privileges the token needs on /vms, as the pveum role in
    # docs/getting-started/proxmox-access.md grants them; the guest agent's
    # depends on the version (init_agent_privilege). The storage's and the
    # bridge's are checked where each is settled on, on its own path.
    init_token_privileges:
      vms:
        - VM.Allocate
        - VM.Clone
        - VM.Config.CPU
        - VM.Config.Cloudinit
        - VM.Config.Disk
        - VM.Config.Memory
        - VM.Config.Network
        - VM.Config.Options
        - VM.PowerMgmt
        - VM.Audit
      storage: [Datastore.AllocateSpace, Datastore.Audit]
      bridge: [SDN.Use]
    init_endpoint: >-
      {{ '[' ~ proxmox_api_host ~ ']' if proxmox_api_host is search(':.*:') and proxmox_api_host is not match('[[]')
         else proxmox_api_host }}:{{ proxmox_api_port }}
    init_token: "{{ proxmox_api_user }}!{{ proxmox_api_token_id }}"
    init_proxmox_host: "{{ groups['proxmox'][0] if groups['proxmox'] | default([]) else '' }}"
    # The certificate (lib/claude_vm/trust.py), worked out at every run, before
    # the token goes anywhere; a test that is not about it turns it off. The
    # files read over root SSH (a test points them into its own directory):
    # Proxmox's CA, and the node's certificate pveproxy serves - a custom or ACME
    # one where that is there, else the one Proxmox made - each only up to the
    # size a certificate file is.
    init_trust_wanted: true
    init_trust_most: 65536
    init_trust_given: "{{ init_given.certificate | default('') | upper }}"
    init_trust_paths:
      ca: /etc/pve/pve-root-ca.pem
      custom: /etc/pve/local/pveproxy-ssl.pem
      node: /etc/pve/local/pve-ssl.pem
    # Where a certificate that verifies but is not kept is copied for the rest of the run to be checked against, since
    # uri reads a CA from a file: in the checkout's .cache, removed as the run ends (a test points it into its own
    # directory).
    init_trust_run_file: "{{ playbook_dir | dirname }}/.cache/init/proxmox-trust.pem"
    init_trust_said: "{{ init_hosts_said | dirname }}/proxmox-trust.pem"
    init_trust_read: "{{ init_trust_ca.content is defined or init_trust_node.content is defined }}"
    init_trust_kind: "{{ {'ca': 'its CA', 'node': \"the node's own certificate\"}[init_trust.name] | default('') }}"
    init_trust_store_set: "{{ 'proxmox_validate_certs' in init_local_settings }}"
    init_missing: >-
      {{ (['the Proxmox host address (' ~ init_hosts_said ~ ')']
          if proxmox_api_host | default('') in ['', init_host_placeholder] else [])
         + (['the API token secret (' ~ init_vault_said ~ ')']
            if lookup('ansible.builtin.vars', init_secret_var, default='') | default('', true)
               in ['', init_secret_placeholder] else []) }}
    init_api_ok: "{{ init_version.status | default(0) == 200 }}"
    init_major: "{{ (init_version.json.data.version | default('0')).split('.')[0] | int }}"
    init_agent_privilege: "{{ 'VM.GuestAgent.Audit' if init_major | int >= 9 else 'VM.Monitor' }}"
    # Listed with 1: granted on /vms and, propagated, on each VM under it,
    # where Proxmox checks them; 0 is granted on /vms alone.
    init_vms_privileges: "{{ (init_permissions.json.data | default({}, true))['/vms'] | default({}, true) }}"
    init_privileges_wanted: "{{ init_token_privileges.vms + [init_agent_privilege] }}"
    init_privileges_missing: "{{ init_privileges_wanted | reject('in', init_vms_privileges) | list }}"
    init_privileges_unpropagated: >-
      {{ init_privileges_wanted | select('in', init_vms_privileges)
         | select('in', init_vms_privileges | dict2items | selectattr('value', 'equalto', 0) | map(attribute='key') | list)
         | list }}
    # The template as just deploy finds it: a VM of that name that is a
    # template. Without one, deploy builds it at proxmox_template_vmid, which
    # must then be free.
    init_listing: "{{ claude_vm_all.json.data | default([]) if init_listed | default(false) | bool else [] }}"
    init_template: "{{ init_listing | built_template(proxmox_template_name) }}"
    init_template_built: "{{ init_template | length > 0 }}"
    # Its configuration can be read: it is on a node that is up.
    init_template_readable: "{{ init_template_built | bool and init_template.node in init_online_nodes }}"
    init_vmid_holder: >-
      {{ init_listing | selectattr('vmid', 'equalto', proxmox_template_vmid | int) | list | first | default({}) }}
    init_down_nodes: "{{ init_nodes.json.data | default([]) | rejectattr('status', 'equalto', 'online') | map(attribute='node') | list }}"
    # A template just deploy rebuilds, as it rebuilds one that differs from what its settings would build, unless
    # proxmox_template_rebuild is off; it needs root SSH as a missing one does.
    init_template_rebuilt: >-
      {{ init_template_built | bool and proxmox_template_drift | default([]) | length > 0
         and proxmox_template_rebuild | bool and not init_template_refused | bool }}
    # One with no record of its build is refused rather than rebuilt: roles/proxmox_template's main.
    init_template_refused: >-
      {{ init_template_built | bool and proxmox_template_rebuild | bool and init_template_config.json.data is defined
         and not (init_template_config.json.data | template_recorded) }}
    init_ssh_wanted: >-
      {{ init_proxmox_host | length > 0 and (not init_template_built | bool or init_template_rebuilt | bool) }}
    init_ssh_address: "{{ hostvars[init_proxmox_host].ansible_host | default(init_proxmox_host) }}"

    # The node is worked out, never chosen: the clone is sent to proxmox_node,
    # which must hold the template, and the template is built on the host
    # hosts.yml reaches. So it is the template's node; without a template, the
    # only node there is, or the node the host SSH reached says it is. Only a
    # name Proxmox gives a node counts (proxmox_name): it is written into
    # local.yml, which every later run reads as a template, and an answer that
    # was not the host's could otherwise put {{ ... }} there.
    init_nodes_listed: "{{ init_nodes.json.data | default([]) | map(attribute='node', default='') | list }}"
    init_online_listed: >-
      {{ init_nodes.json.data | default([]) | selectattr('status', 'equalto', 'online')
         | map(attribute='node', default='') | list }}
    init_all_nodes: "{{ init_nodes_listed | proxmox_names('node') }}"
    init_online_nodes: "{{ init_online_listed | proxmox_names('node') }}"
    init_node_reported: >-
      {{ init_template.node | default('') if init_template_built | bool
         else init_online_listed[0] if init_online_listed | length == 1
         else init_ssh_node | default('') }}
    init_node_derived: "{{ init_node_reported | string | proxmox_name('node') }}"
    init_node_why: >-
      {{ 'the template is on ' ~ init_node_derived if init_template_built | bool
         else init_node_derived ~ ' is the only node' if init_online_nodes | length == 1
         else init_ssh_address ~ ' is node ' ~ init_node_derived }}
    init_node_set: "{{ 'proxmox_node' in init_local_settings }}"
    init_node_writes: >-
      {{ init_node_derived | length > 0 and init_node_derived in init_all_nodes and init_node_derived != proxmox_node
         and not init_node_set | bool }}
    # The node the storages and bridges are listed on: the one worked out, once
    # it is known and up. Before that, nothing is listed, asked or written for them.
    init_node: "{{ init_node_derived }}"
    init_node_known: >-
      {{ init_listed | default(false) | bool and init_nodes.status | default(0) == 200
         and init_node_derived | length > 0 and init_node_derived in init_all_nodes }}
    init_node_listable: "{{ init_node_known | bool and init_node in init_online_nodes }}"
    # What the node listed: its storages for VM disks, and, while there is no
    # template, its bridges. A choice is made, or a value given checked, only
    # among what it listed.
    init_storages_listed: "{{ init_node_listable | bool and init_storages.status | default(0) == 200 }}"
    init_bridges_listed: >-
      {{ init_node_listable | bool and not init_template_built | bool and init_bridges.status | default(0) == 200 }}
    # Why the storage and the bridge could not be checked, when they could not.
    init_unchecked_why: >-
      {{ 'the API did not answer' if not init_api_ok | bool
         else 'Proxmox would not list the cluster' if not init_listed | default(false) | bool
         else 'Proxmox would not list its nodes' if init_nodes.status | default(0) != 200
         else 'the node is not known yet' if not init_node_known | bool
         else 'node ' ~ init_node ~ ' is not up' }}
    init_template_bridge: >-
      {{ (init_template_config.json.data.net0 | default('')) | regex_findall('bridge=([^,]+)') | first | default('') }}
    # The VMs would get no SSH key, and no password either.
    init_keyless: "{{ vm_ssh_public_keys | length == 0 and vault_vm_password | default('', true) | string | length == 0 }}"

    # What the checks found wrong, which fails the run; and what they could
    # not check, which is no problem of its own, its cause usually one.
    init_problems: "{{ init_results | default([]) | rejectattr('ok') | rejectattr('skipped', 'defined') | list }}"
    init_unchecked: "{{ init_results | default([]) | selectattr('skipped', 'defined') | list }}"
    # What is no problem for just deploy but is said with what to do: the API's
    # certificate not checked. It goes in NEXT STEPS whatever else does.
    init_notes: "{{ init_results | default([]) | selectattr('note', 'defined') | list }}"
    # The one value init_settings.yml asks for that just deploy needs and no
    # check here reads: while it is the example's, init_settings.yml's NEXT
    # STEPS names it, and just deploy is not next.
    init_github_set: "{{ github_username | default('', true) | string not in ['', init_github_placeholder] }}"
    init_deploy_next: >-
      {{ 'Next: just deploy alpha, which creates a VM named alpha (any name will do).' if init_host_name | length == 0
         else 'Next: just deploy alpha --host ' ~ init_host_name ~ ', which creates a VM named alpha on ' ~ init_host_name
              ~ (' (any name will do).' if init_host.current | default(false) | bool
                 else ' (any name will do), or just host ' ~ init_host_name ~ ' to make it the current host.') }}
    # What is left to do, as the report and the failure say it, for NEXT
    # STEPS: each problem with its fix; what could not be checked, when
    # nothing is wrong; otherwise just deploy. A template that renders nothing
    # is none, hence the string beside it.
    init_left: "{{ init_left_lines | default('', true) | trim }}"
    init_left_lines: |-
      {% if init_problems | length > 0 %}
      {% set one = init_problems | length == 1 %}
      just init found {{ init_problems | length }} problem{{ '' if one else 's' }} for just deploy: fix {{ 'it' if one else 'them' }}, then run just init again.
      {% for result in init_problems %}
        !!   {{ result.text }}
      {% endfor %}
      {% elif init_unchecked | length > 0 %}
      just init could not check all that just deploy needs: run it again once it can.
      {% for result in init_unchecked %}
        --   {{ result.text }}
      {% endfor %}
      {% elif init_github_set | bool %}
      {{ init_deploy_next }}
      {% endif %}
      {% for result in init_notes %}
        note {{ result.text }}
      {% endfor %}
  tasks:
    - name: Say what is not set yet
      ansible.builtin.debug:
        msg: >-
          Proxmox is not checked yet: {{ init_missing | join(' and ') }} {{ 'is' if init_missing | length == 1
          else 'are' }} still the example's. just init asks for {{ 'it' if init_missing | length == 1 else 'them' }}.
      when: init_missing | length > 0

    - name: Stop until there is something to check
      ansible.builtin.meta: end_play
      when: init_missing | length > 0

    - name: Read local.yml
      ansible.builtin.slurp:
        src: "{{ init_local_file }}"
      register: init_local_read

    # -------------------------------------------------------------- the vault ---
    # Plaintext, it holds the secret: only whether it starts as an encrypted
    # vault does is kept (init_vault_encrypted, vars/init.yml).
    - name: Read the vault's first line
      ansible.builtin.slurp:
        src: "{{ init_vault_file }}"
      register: init_vault_read
      no_log: true

    - name: Record the vault's result
      ansible.builtin.set_fact:
        init_results: >-
          {{ init_results | default([]) + [{'ok': init_vault_encrypted | bool, 'text':
             'vault.yml is encrypted' if init_vault_encrypted | bool
             else 'vault.yml is not encrypted, and every recipe refuses it: just vault encrypts it'}] }}

    # -------------------------------------------------------- the certificate ---
    # Before the token is sent anywhere: whether the API's certificate is
    # checked, and against what (docs/getting-started/proxmox-access.md,
    # lib/claude_vm/trust.py). No probe here sends the token. First, what
    # checking uses now - the host's trust file beside its hosts.yml
    # (proxmox_trust_file), or this machine's trust store with
    # proxmox_validate_certs - and where that verifies, nothing more. Else the
    # host's CA and node certificate are read over root SSH, the one channel to
    # the host already trusted, and tried with the trust store: Python 3.13 and
    # later refuse Proxmox's CA where it has no keyUsage (every Proxmox VE 8
    # host's) and take the node's certificate as an anchor of its own. The first
    # that verifies is kept: in a new file at a terminal (init_ask), or for the
    # fingerprint given (--certificate), with proxmox_validate_certs turned on
    # where local.yml does not set it, so that a copy of the checkout without the
    # file refuses rather than sends the token unchecked; in place of a file that
    # no longer verifies only on a yes that shows both fingerprints, or the new
    # one given. Checking is never turned off for it. Where nothing verifies, what
    # the address presents is compared with the host's own: the host's under
    # another name is a name to fix, and anything else - another certificate, or
    # none read - is not shown to be the host, so no task that carries the token
    # runs (init_token_held), as none does while a kept certificate no longer
    # verifies. Settled once, here: a file written turns checking on.
    - name: Settle whether the certificate is to be worked out, and against what it is checked now
      ansible.builtin.set_fact:
        init_trust_working: "{{ init_trust_wanted | bool }}"
        init_trust_checked: "{{ proxmox_api_validate | bool }}"
        init_trust_had_file: "{{ proxmox_trust_kept | bool }}"

    - name: Read the certificate the API is checked against now
      ansible.builtin.slurp:
        src: "{{ proxmox_trust_file }}"
      register: init_trust_kept_read
      check_mode: false
      when: init_trust_working | bool and init_trust_had_file | bool

    - name: Find whether the API's certificate verifies as it is checked now
      ansible.builtin.set_fact:
        init_trust_now: >-
          {{ (init_trust_kept_read.content | b64decode if init_trust_had_file | bool else '')
             | proxmox_trust_holds(proxmox_api_url) }}
      when: init_trust_working | bool and init_trust_checked | bool

    - name: Settle whether the host's certificates are needed
      ansible.builtin.set_fact:
        init_trust_fine: "{{ init_trust_checked | bool and init_trust_now.verified | default(false) | bool }}"
        init_trust_reading: >-
          {{ init_trust_working | bool and init_proxmox_host | length > 0
             and not (init_trust_checked | bool and init_trust_now.verified | default(false) | bool) }}

    # A file larger than a certificate file is no certificate file, and is never read whole.
    - name: Look for the host's certificates over root SSH
      ansible.builtin.stat:
        path: "{{ init_trust_path }}"
        get_checksum: false
      delegate_to: "{{ init_proxmox_host | default('localhost', true) }}"
      register: init_trust_files
      check_mode: false
      failed_when: false
      ignore_unreachable: true
      loop: "{{ [init_trust_paths.ca, init_trust_paths.custom, init_trust_paths.node] if init_trust_reading | bool else [] }}"
      loop_control:
        loop_var: init_trust_path

    # pveproxy serves the custom certificate where there is one, else the one Proxmox made.
    - name: Settle which of the host's files to read
      vars:
        init_trust_found: >-
          {{ init_trust_files.results | default([]) | selectattr('stat', 'defined') | selectattr('stat.exists')
             | selectattr('stat.size', 'le', init_trust_most) | map(attribute='init_trust_path') | list }}
      ansible.builtin.set_fact:
        init_trust_reached: >-
          {{ init_trust_files.results | default([]) | selectattr('unreachable', 'defined') | selectattr('unreachable')
             | list | length == 0 and init_trust_reading | bool }}
        init_trust_ca_path: "{{ init_trust_found | select('equalto', init_trust_paths.ca) | first | default('') }}"
        init_trust_node_path: >-
          {{ (init_trust_found | select('equalto', init_trust_paths.custom) | list
              + init_trust_found | select('equalto', init_trust_paths.node) | list) | first | default('') }}

    # no_log: what is kept of them is their certificates alone (pem_certificates), never anything else they hold.
    - name: Read Proxmox's CA over root SSH
      ansible.builtin.slurp:
        src: "{{ init_trust_ca_path }}"
      # Rendered even when the task is skipped: never empty.
      delegate_to: "{{ init_proxmox_host | default('localhost', true) }}"
      register: init_trust_ca
      check_mode: false
      failed_when: false
      ignore_unreachable: true
      no_log: true
      when: init_trust_reached | bool and init_trust_ca_path | length > 0

    - name: Read the certificate the node serves over root SSH
      ansible.builtin.slurp:
        src: "{{ init_trust_node_path }}"
      delegate_to: "{{ init_proxmox_host | default('localhost', true) }}"
      register: init_trust_node
      check_mode: false
      failed_when: false
      ignore_unreachable: true
      no_log: true
      when: init_trust_reached | bool and init_trust_node_path | length > 0

    - name: Find what makes Proxmox's certificate verify here, and what the address presents
      vars:
        init_trust_candidates: >-
          {{ [{'name': 'store', 'pem': none},
              {'name': 'ca', 'pem': init_trust_ca.content | default('') | b64decode | pem_certificates},
              {'name': 'node', 'pem': init_trust_node.content | default('') | b64decode | pem_first}] }}
      ansible.builtin.set_fact:
        init_trust: "{{ init_trust_candidates | proxmox_trust_pick(proxmox_api_url) }}"
        init_trust_presented: "{{ init_trust_candidates | proxmox_trust_presented(proxmox_api_url) }}"
      when: init_trust_working | bool and not init_trust_fine | bool

    # Whether this run may keep what it found, and whether that replaces a file that no longer verifies.
    - name: Settle what the certificate's step may do
      ansible.builtin.set_fact:
        init_trust_found_host: "{{ init_trust.name | default('') in ['ca', 'node'] }}"
        init_trust_replacing: >-
          {{ init_trust_had_file | bool and init_trust.name | default('') in ['ca', 'node']
             and init_trust.fingerprint | default('') != init_trust_now.fingerprint | default('') }}
        init_trust_given_matches: >-
          {{ init_trust_given | length > 0 and init_trust_given == init_trust.fingerprint | default('') }}
      when: init_trust_working | bool and not init_trust_fine | bool

    - name: Ask whether to trust the certificate that verifies in place of the one kept
      ansible.builtin.include_tasks: tasks/init_ask.yml
      vars:
        init_ask_name: proxmox_trust_replace
        init_ask_label: Trust it in its place? y or n
        init_ask_kind: yes_no
        init_ask_hidden: false
        init_ask_given: ""
        init_ask_flag: ""
        init_ask_text: >-
          {{ ["Proxmox's API at " ~ init_endpoint ~ ' no longer verifies against ' ~ init_trust_said
              ~ ', whose certificate is', '  SHA-256 ' ~ init_trust_now.fingerprint,
              (init_trust_now.why | plain_text | trim | truncate(200)) ~ '. ' ~ init_trust_kind[:1] | upper
              ~ init_trust_kind[1:] ~ ', read just now over root SSH, verifies:', '  SHA-256 ' ~ init_trust.fingerprint,
              'Proxmox renews the node certificate within two years, and a reinstalled host has a new CA; a'
              ~ ' certificate that changed is also what someone answering in its place would present. Compare it with'
              ~ ' what the host prints: openssl x509 -noout -fingerprint -sha256 -in ' ~ init_trust_paths.node ~ '.',
              'y puts it in place of the one kept; n, or Enter, keeps the old one, and the token is not sent.'] }}
      when: >-
        init_trust_working | bool and not init_trust_fine | bool and init_trust_replacing | default(false) | bool
        and not init_trust_given_matches | default(false) | bool and init_ask | bool

    - name: Settle what is written
      vars:
        init_trust_replace_ok: >-
          {{ init_trust_given_matches | default(false) | bool
             or (init_answers | default({})).proxmox_trust_replace | default('') == 'y' }}
      ansible.builtin.set_fact:
        init_trust_keep_file: >-
          {{ init_trust_found_host | default(false) | bool and proxmox_trust_file | length > 0
             and (init_trust_replace_ok | bool if init_trust_replacing | default(false) | bool
                  else (init_ask | bool or init_trust_given_matches | default(false) | bool)) }}
        init_trust_keep_store: >-
          {{ init_trust.name | default('') == 'store' and init_ask | bool and not init_trust_checked | bool
             and not init_trust_store_set | bool }}
      when: init_trust_working | bool and not init_trust_fine | bool

    - name: Keep the certificate the API is checked against from now on
      ansible.builtin.copy:
        content: "{{ init_trust.pem }}"
        dest: "{{ proxmox_trust_file }}"
        mode: "0644"
        force: "{{ init_trust_replacing | bool }}"
      when: >-
        (init_ask | bool or init_trust_given_matches | default(false) | bool) and init_trust_working | bool
        and not init_trust_fine | bool and init_trust_keep_file | bool

    # So that a copy of this checkout without the file - another worktree, another machine - refuses the run rather
    # than send the token unchecked; never over a value local.yml sets.
    - name: Turn checking on in local.yml
      ansible.builtin.include_tasks: tasks/init_local_setting.yml
      vars:
        init_setting_key: proxmox_validate_certs
        init_setting_value: true
      when: >-
        (init_ask | bool or init_trust_given_matches | default(false) | bool) and init_trust_working | bool
        and not init_trust_fine | bool and (init_trust_keep_file | bool or init_trust_keep_store | bool)
        and not init_trust_store_set | bool

    # Not kept - no terminal, and no --certificate - what verifies still checks the rest of this run, which would
    # otherwise send the token unchecked: the store as it is, the CA or the node's certificate from a copy for the run.
    - name: Settle what checks the rest of the run where nothing is kept
      ansible.builtin.set_fact:
        init_trust_run_copy: >-
          {{ not init_trust_checked | bool and init_trust_found_host | default(false) | bool
             and not init_trust_keep_file | bool }}
        init_trust_run_store: >-
          {{ not init_trust_checked | bool and init_trust.name | default('') == 'store'
             and not init_trust_keep_store | bool }}
      when: init_trust_working | bool and not init_trust_fine | bool

    - name: Make the folder the run's copy of the certificate goes in
      ansible.builtin.file:
        path: "{{ init_trust_run_file | dirname }}"
        state: directory
        mode: "0700"
      when: init_trust_run_copy | default(false) | bool

    - name: Copy the certificate that verifies for this run alone
      ansible.builtin.copy:
        content: "{{ init_trust.pem }}"
        dest: "{{ init_trust_run_file }}"
        mode: "0600"
      when: init_trust_run_copy | default(false) | bool

    # And for the rest of this run, which read local.yml before it was written.
    - name: Check the API's certificate for the rest of the run
      ansible.builtin.set_fact:
        proxmox_validate_certs: true
      when: >-
        init_trust_working | bool and not init_trust_fine | bool
        and (init_trust_keep_file | bool or init_trust_keep_store | bool
             or init_trust_run_copy | default(false) | bool or init_trust_run_store | default(false) | bool)

    - name: Check it against the run's copy
      ansible.builtin.set_fact:
        proxmox_api_ca_path: "{{ init_trust_run_file }}"
      when: init_trust_run_copy | default(false) | bool

    - name: Record the certificate's result
      ansible.builtin.set_fact:
        init_results: "{{ init_results + [init_trust_result] }}"
        init_token_held: "{{ init_trust_hold | bool }}"
      vars:
        # Root SSH read the host's certificates, nothing verified, and what answers was not shown to be the host:
        # whether a certificate was read there or not, since what answers may say nothing to a request with no token.
        init_trust_unshown: >-
          {{ not init_trust_fine | bool and init_trust.name | default('') == '' and init_trust_read | bool
             and not init_trust_presented.host | default(false) | bool }}
        init_trust_impostor: >-
          {{ init_trust_unshown | bool and init_trust_presented.fingerprint | default('') | length > 0 }}
        init_trust_hold: >-
          {{ init_trust_unshown | bool
             or (init_trust_checked | bool and not init_trust_fine | bool and not init_trust_keep_file | bool) }}
        init_trust_kept_where: "{{ init_trust_said if init_trust_had_file | bool else \"this machine's trust store\" }}"
        init_trust_off_said: >-
          {{ '; local.yml sets proxmox_validate_certs: false, so a copy of this checkout without the file checks'
             ~ ' nothing: set it to true' if init_trust_store_set | bool and not proxmox_validate_certs | bool else '' }}
        init_trust_given_said: >-
          {{ ' (--certificate ' ~ init_trust_given ~ ' is not it, so nothing was kept)'
             if init_trust_given | length > 0 and not init_trust_given_matches | default(false) | bool else '' }}
        init_trust_result: >-
          {{ {'ok': true, 'text': "Proxmox's certificate verifies against " ~ init_trust_kept_where
               ~ ': every run checks it'}
             if init_trust_fine | bool else
             {'ok': false, 'text': 'https://' ~ init_endpoint ~ ' presents a certificate (SHA-256 '
               ~ init_trust_presented.fingerprint ~ ") that is none of the host's, as root SSH to " ~ init_ssh_address
               ~ ' reads them, so something other than the Proxmox host answers there, and the token was not sent.'
               ~ ' Check the address in ' ~ init_hosts_said ~ ', and what answers at it'}
             if init_trust_impostor | bool else
             {'ok': true, 'text': "Proxmox's certificate no longer verified against " ~ init_trust_said ~ ' (SHA-256 '
               ~ init_trust_now.fingerprint ~ '), and ' ~ init_trust_kind ~ ', read over root SSH, does (SHA-256 '
               ~ init_trust.fingerprint ~ '): kept in its place' ~ init_trust_off_said}
             if init_trust_replacing | default(false) | bool and init_trust_keep_file | bool else
             {'ok': false, 'text': "Proxmox's certificate no longer verifies against " ~ init_trust_kept_where
               ~ (' (SHA-256 ' ~ init_trust_now.fingerprint ~ ')' if init_trust_had_file | bool else '') ~ ' ('
               ~ (init_trust_now.why | default('') | plain_text | trim | truncate(200)) ~ '), and ' ~ init_trust_kind
               ~ ', read over root SSH, does (SHA-256 ' ~ init_trust.fingerprint ~ '), so the token was not sent: just'
               ~ ' init at a terminal asks whether to trust it in its place, and just init --certificate '
               ~ init_trust.fingerprint ~ ' puts it there once you have compared it with what the host prints'
               ~ init_trust_given_said}
             if init_trust_checked | bool and init_trust_found_host | default(false) | bool
                and not init_trust_keep_file | bool else
             {'ok': false, 'text': "Proxmox's certificate no longer verifies against " ~ init_trust_kept_where ~ ' ('
               ~ (init_trust_now.why | default('') | plain_text | trim | truncate(200)) ~ ')'
               ~ (', and nothing read over root SSH verifies it either (' ~ init_trust | proxmox_trust_said ~ ')'
                  if init_trust_read | bool else ", and just init could not read the host's certificates over root"
                  ~ ' SSH to find one that does')
               ~ ', so the token was not sent: docs/getting-started/proxmox-access.md says what to do'}
             if init_trust_checked | bool else
             {'ok': true, 'text': "Proxmox's certificate verifies against " ~ init_trust_kind ~ ' (SHA-256 '
               ~ init_trust.fingerprint ~ '), read over root SSH and kept in ' ~ init_trust_said
               ~ ' with proxmox_validate_certs on: every run checks it' ~ init_trust_off_said}
             if init_trust_keep_file | bool else
             {'ok': true, 'note': true, 'text': "Proxmox's certificate verifies against " ~ init_trust_kind
               ~ ' (SHA-256 ' ~ init_trust.fingerprint ~ '), read over root SSH, and this run checked it, but nothing'
               ~ ' keeps it for the next: just init at a terminal keeps it in ' ~ init_trust_said ~ ', and so does'
               ~ ' just init --certificate ' ~ init_trust.fingerprint ~ init_trust_given_said}
             if init_trust_found_host | default(false) | bool else
             {'ok': true, 'text': "Proxmox's certificate verifies against this machine's trust store, and"
               ~ ' proxmox_validate_certs is on: every run checks it'}
             if init_trust_keep_store | bool else
             {'ok': true, 'note': true, 'text': "Proxmox's certificate verifies against this machine's trust store,"
               ~ ' and this run checked it, but nothing keeps checking on: '
               ~ ('just init at a terminal turns proxmox_validate_certs on'
               if not init_ask | bool else 'set proxmox_validate_certs: true in ' ~ init_local_said)}
             if init_trust.name | default('') == 'store' else
             {'ok': true, 'note': true, 'text': "Proxmox's certificate is not checked: what https://" ~ init_endpoint
               ~ " presents is the host's own (SHA-256 " ~ init_trust_presented.fingerprint ~ '), but nothing makes it'
               ~ ' verify there (' ~ init_trust | proxmox_trust_said ~ '). Usually the certificate does not name the'
               ~ ' address in ' ~ init_hosts_said ~ ': reach the host by a name or address it holds, as'
               ~ ' docs/getting-started/proxmox-access.md says'}
             if init_trust_read | bool and init_trust_presented.host | default(false) | bool else
             {'ok': false, 'text': 'https://' ~ init_endpoint ~ ' presented no certificate to read ('
               ~ init_trust_presented.why | default('') | plain_text | trim | truncate(200) ~ "), so nothing shows"
               ~ ' that the Proxmox host answers there, and the token was not sent. Check the address in '
               ~ init_hosts_said ~ ', and that the host is up'}
             if init_trust_unshown | bool else
             {'ok': true, 'note': true, 'text': "Proxmox's certificate is not checked, so every run sends the token"
               ~ ' to whatever answers at ' ~ init_endpoint ~ ', and ' ~ init_hosts_said ~ ' names no Proxmox host'
               ~ ' to read it from over root SSH: copy it by hand as docs/getting-started/proxmox-access.md says'}
             if init_proxmox_host | length == 0 else
             {'ok': true, 'note': true, 'text': "Proxmox's certificate is not checked, so every run sends the token"
               ~ ' to whatever answers at ' ~ init_endpoint ~ ', and just init could not read it over root SSH'
               ~ ((' (' ~ (init_trust_files.results | default([]) | map(attribute='msg', default='') | select
                           | first | default('') | plain_text | trim | truncate(200)) ~ ')')
                  if init_trust_files.results | default([]) | map(attribute='msg', default='') | select | list else '')
               ~ ': install your key with ssh-copy-id root@' ~ init_ssh_address ~ ' and run just init again, or'
               ~ ' copy it by hand as docs/getting-started/proxmox-access.md says'} }}
      when: init_trust_working | bool

    # ---------------------------------------------------------------- the API ---
    # The request carries the token, so it is no_log; what is said comes from
    # its status and message alone.
    # Not where the certificate's step held the token (init_token_held): what
    # answers is not the host, or a certificate kept no longer verifies.
    - name: Ask Proxmox for its version
      ansible.builtin.uri:
        url: "{{ proxmox_api_url }}/version"
        headers: "{{ proxmox_api_headers }}"
        follow_redirects: none
        validate_certs: "{{ proxmox_api_validate }}"
        ca_path: "{{ proxmox_api_ca_path | default(omit, true) }}"
        timeout: 10
      register: init_version
      check_mode: false
      failed_when: false
      no_log: true
      when: not init_token_held | default(false) | bool

    - name: Record that the API was not asked
      ansible.builtin.set_fact:
        init_results: >-
          {{ init_results + [{'ok': true, 'skipped': true, 'text': 'the API is not asked, and nothing that needs it'
             ~ ' is checked: the token is not sent while its certificate is as the line above says'}] }}
      when: init_token_held | default(false) | bool

    - name: Record the API's result
      ansible.builtin.set_fact:
        init_results: "{{ init_results + [{'ok': init_api_ok | bool, 'text': init_api_said}] }}"
      vars:
        init_api_message: "{{ init_version.msg | default('') | plain_text | trim }}"
        init_api_said: >-
          {{ 'Proxmox VE ' ~ init_version.json.data.version ~ ' at ' ~ init_endpoint ~ ' accepted ' ~ init_token
             if init_api_ok | bool else
             'Proxmox at ' ~ init_endpoint ~ ' refused the token ' ~ init_token ~ ' (' ~ init_version.status ~ '):'
             ~ ' a token named otherwise goes in local.yml as proxmox_api_user and proxmox_api_token_id, and'
             ~ ' just vault fixes a wrong secret'
             if init_version.status | default(0) in [401, 403] else
             "https://" ~ init_endpoint ~ "'s certificate did not verify (" ~ init_api_message ~ '): '
             ~ init_api_message | proxmox_untrusted_hint(init_trust_said if proxmox_trust_kept | bool else '')
             if init_api_message | proxmox_untrusted_hint | length > 0 else
             'nothing answered at https://' ~ init_endpoint ~ ' (' ~ init_api_message ~ '): check the address in '
             ~ init_hosts_said ~ ', and that this machine reaches it'
             if init_version.status | default(-1) == -1 else
             'Proxmox at ' ~ init_endpoint ~ ' answered ' ~ init_version.status ~ ': ' ~ init_api_message }}
      when: not init_token_held | default(false) | bool

    # ----------------------------------------------------------- privileges ---
    # The privileges in effect at /vms, inherited ones included. The 1 or 0 by
    # each is its propagate flag, not whether it is granted: being listed is.
    - name: Ask Proxmox what the token may do on /vms
      ansible.builtin.uri:
        url: "{{ proxmox_api_url }}/access/permissions?path=/vms"
        headers: "{{ proxmox_api_headers }}"
        follow_redirects: none
        validate_certs: "{{ proxmox_api_validate }}"
        ca_path: "{{ proxmox_api_ca_path | default(omit, true) }}"
        timeout: 10
      register: init_permissions
      check_mode: false
      failed_when: false
      no_log: true
      when: init_api_ok | bool

    - name: Record the privileges' result
      ansible.builtin.set_fact:
        init_results: >-
          {{ init_results + [{'ok': init_permissions.status == 200 and init_privileges_missing | length == 0
                                     and init_privileges_unpropagated | length == 0, 'text': init_privileges_said}] }}
      vars:
        init_privileges_said: >-
          {{ ('Proxmox would not say what the token may do (' ~ init_permissions.status ~ ' '
              ~ init_permissions.msg | default('') | plain_text | trim ~ ')')
             if init_permissions.status != 200 else
             ('the token holds no privilege on /vms at all. A token made with privilege separation (the default,'
              ~ " --privsep 1) has none of its user's: make it with --privsep 0, or give the token itself the"
              ~ " role: pveum aclmod /vms -token '" ~ init_token ~ "' -role AnsibleVM"
              ~ ' (docs/getting-started/proxmox-access.md)')
             if init_privileges_missing | length == init_privileges_wanted | length else
             ('the token lacks ' ~ init_privileges_missing | join(', ') ~ ' on /vms: add '
              ~ ('them' if init_privileges_missing | length > 1 else 'it') ~ ' to its role, the one'
              ~ ' docs/getting-started/proxmox-access.md calls AnsibleVM. just init' ~ init_host_flag
              ~ ' at a terminal, with root SSH to the host, offers to (answer y), or by hand: pveum role modify'
              ~ " AnsibleVM -append 1 -privs '"
              ~ init_privileges_missing | join(' ') ~ "'")
             if init_privileges_missing | length > 0 else
             ('the token holds ' ~ init_privileges_unpropagated | join(', ') ~ ' on /vms but not on the VMs under'
              ~ " it, where Proxmox checks them: its ACL on /vms has Propagate off. Turn it on: pveum aclmod /vms"
              ~ ' -user ' ~ proxmox_api_user ~ ' -role AnsibleVM -propagate 1')
             if init_privileges_unpropagated | length > 0 else
             'the token holds every privilege the project uses on /vms' }}
      when: init_api_ok | bool

    # ----------------------------------------------------------- the template ---
    # A listing that fails is a problem said with the rest, not the end of the run.
    - name: List the cluster
      when: init_api_ok | bool
      block:
        - name: List every VM in the cluster
          ansible.builtin.import_tasks: tasks/cluster_vms.yml

        - name: Note that the cluster was listed
          ansible.builtin.set_fact:
            init_listed: true
      rescue:
        - name: Record that the cluster could not be listed
          ansible.builtin.set_fact:
            init_results: >-
              {{ init_results + [{'ok': false, 'text': 'Proxmox would not list the VMs ('
                 ~ claude_vm_all.status | default('') ~ ' ' ~ claude_vm_all.msg | default('') | plain_text | trim
                 ~ ')'}] }}

    - name: Ask Proxmox for its nodes
      ansible.builtin.uri:
        url: "{{ proxmox_api_url }}/nodes"
        headers: "{{ proxmox_api_headers }}"
        follow_redirects: none
        validate_certs: "{{ proxmox_api_validate }}"
        ca_path: "{{ proxmox_api_ca_path | default(omit, true) }}"
        timeout: 10
      register: init_nodes
      check_mode: false
      failed_when: false
      no_log: true
      when: init_api_ok | bool

    # Read here, before root SSH is checked: a template that differs from what its settings would build is rebuilt
    # by just deploy, over root SSH, as a missing one is built. Its bridge is checked from it below.
    - name: Read the template's configuration
      ansible.builtin.uri:
        url: "{{ proxmox_api_url }}/nodes/{{ init_template.node }}/qemu/{{ init_template.vmid }}/config"
        headers: "{{ proxmox_api_headers }}"
        follow_redirects: none
        validate_certs: "{{ proxmox_api_validate }}"
        ca_path: "{{ proxmox_api_ca_path | default(omit, true) }}"
        timeout: 10
      register: init_template_config
      check_mode: false
      failed_when: false
      no_log: true
      when: init_template_readable | bool

    # roles/proxmox_template's drift entry point, which deploy.yml runs too: a set_fact, changing nothing.
    - name: Compare the template with what its settings would build
      ansible.builtin.include_role:
        name: proxmox_template
        tasks_from: drift
      vars:
        proxmox_template_drift_config: "{{ init_template_config.json.data | default({}) }}"
      when: init_template_built | bool and init_template_config.status | default(0) == 200

    # ------------------------------------------------------------- the route ---
    # How just deploy will reach the VMs (vm_ssh_route, lib/claude_vm/route.py):
    # through the Proxmox host, its login is checked below, after root SSH, as a
    # run's start makes it. No forward: no VM's address is read here, and the
    # first run that has one makes it. A hop setting that is not one plain word
    # (vm_ssh_jump with an @ in it) is a problem of its own. Another host's is
    # its own local.yml's, never the shared one's, which no run against it may
    # read (a setting of one network: lib/claude_vm/hosts/kinds.py).
    - name: Settle how just deploy will reach the VMs
      vm_route:
        do: settle
        setting: >-
          {{ (init_local_settings.vm_ssh_route | default('auto', true)) if init_host_name | length > 0
             else vm_ssh_route | default('auto') }}
        host: "{{ init_proxmox_host }}"
        jump: >-
          {{ hostvars[init_proxmox_host].vm_ssh_jump | default('', true) if init_proxmox_host | length > 0 else '' }}
        policy: accept-new
      register: init_route
      check_mode: false
      failed_when: false

    - name: Record the template's result
      ansible.builtin.set_fact:
        init_results: "{{ init_results + [init_template_result] }}"
      vars:
        init_holder_where: >-
          {{ init_vmid_holder.node | default('') ~ (', which is down' if init_vmid_holder.node | default('')
             in init_down_nodes else '') }}
        init_template_differences: "{{ proxmox_template_drift | default([]) | join('; ') }}"
        # Through the Proxmox host, just deploy reaches it over SSH all the same, as the VMs' hop.
        init_hop_beside: >-
          {{ ' but the hop to the VMs' if (init_route.route | default({})).route | default('direct') == 'host' else '' }}
        init_template_result: >-
          {{ {'ok': false,
              'text': 'the template ' ~ proxmox_template_name ~ ' on ' ~ init_template.node ~ ' keeps no record of'
                      ~ ' its build, so just deploy refuses it: remove it (qm destroy ' ~ proxmox_template_vmid
                      ~ ') if it is an old build of this project, or set proxmox_template_rebuild to false'}
             if init_template_refused | bool else
             {'ok': true,
              'text': 'the template ' ~ proxmox_template_name ~ ' on ' ~ init_template.node ~ ' differs from its'
                      ~ ' settings (' ~ init_template_differences ~ '): just deploy rebuilds it, over root SSH'}
             if init_template_rebuilt | bool else
             {'ok': true,
              'text': 'the template ' ~ proxmox_template_name ~ ' on ' ~ init_template.node ~ ' differs from its'
                      ~ ' settings (' ~ init_template_differences ~ '), and is kept as it is since'
                      ~ ' proxmox_template_rebuild is false, so just deploy needs no root SSH' ~ init_hop_beside}
             if init_template_built | bool and init_template_differences | length > 0 else
             {'ok': true,
              'text': 'the template ' ~ proxmox_template_name ~ ' is on ' ~ init_template.node
                      ~ ', so just deploy needs no root SSH' ~ init_hop_beside}
             if init_template_built | bool else
             {'ok': false,
              'text': 'there is no template ' ~ proxmox_template_name ~ ' yet, and VMID ' ~ proxmox_template_vmid
                      ~ ', where just deploy would build it, is taken by '
                      ~ (init_vmid_holder.name | default('a ' ~ init_vmid_holder.type | default('guest')))
                      ~ ' on ' ~ init_holder_where ~ ': set proxmox_template_vmid to a free VMID in local.yml, or'
                      ~ ' proxmox_template_name to the template there'}
             if init_vmid_holder | length > 0 else
             {'ok': true,
              'text': 'there is no template ' ~ proxmox_template_name ~ ' yet: just deploy builds it at VMID '
                      ~ proxmox_template_vmid ~ ', over root SSH'} }}
      when: init_listed | default(false) | bool

    - name: Record that no host can build the template
      ansible.builtin.set_fact:
        init_results: >-
          {{ init_results + [{'ok': false, 'text': 'the template '
             ~ ('differs from its settings' if init_template_rebuilt | bool else 'is not built yet')
             ~ ', and just deploy builds it over SSH to the host of the proxmox group in ' ~ init_hosts_said
             ~ ', which has none'}] }}
      when: (not init_template_built | bool or init_template_rebuilt | bool) and init_proxmox_host | length == 0

    # -------------------------------------------------------------- root SSH ---
    # Only while the template is missing or is to be rebuilt, or Proxmox would not
    # say: the build is the one step that connects to the host, as root, with
    # these settings.
    # Its short host name is the host's Proxmox node name.
    - name: Run hostname on the Proxmox host over root SSH
      ansible.builtin.command:
        argv: [hostname, -s]
      # Rendered even when the task is skipped: never empty.
      delegate_to: "{{ init_proxmox_host | default('localhost', true) }}"
      register: init_ssh
      changed_when: false
      check_mode: false
      failed_when: false
      ignore_unreachable: true
      when: init_ssh_wanted | bool

    - name: Record root SSH's result
      ansible.builtin.set_fact:
        init_ssh_node: "{{ init_ssh.stdout | default('') | trim if init_ssh_ok else '' }}"
        init_results: >-
          {{ init_results + [{'ok': init_ssh_ok, 'text':
             ('root SSH to ' ~ init_ssh_address ~ ' works, and it is node ' ~ init_ssh.stdout | trim
              ~ (' (just deploy rebuilds the template)' if init_template_rebuilt | bool
                 else ' (the template is not built yet)' if init_listed | default(false) | bool
                 else ' (whether the template is built could not be checked)'))
             if init_ssh_ok else
             ('root SSH to ' ~ init_ssh_address ~ ' failed (' ~ (init_ssh.msg | default(init_ssh.stderr | default('')))
              | plain_text | trim | truncate(300) ~ '): just deploy builds the template over it. Install your key'
              ~ ' with ssh-copy-id root@' ~ init_ssh_address)}] }}
      vars:
        # A boolean already, so read as it is: under | bool, ansible-lint, which cannot render it, saw a string.
        init_ssh_ok: "{{ not (init_ssh.unreachable | default(false)) and init_ssh.rc | default(1) == 0 }}"
      when: init_ssh_wanted | bool

    # --------------------------------------------------------------- the hop ---
    # Where the route is the Proxmox host, its login as a run's start makes it:
    # unusable, just deploy would stop, so it is a problem. Where every host is
    # given a jump of its own (as localhost reads what every host is given), a
    # run's start puts the login off, and a VM that brings its own takes no
    # hop: only the aliases go through it, unless claude_ssh_options names a
    # jump too, when nothing needs the hop at all and no login is made.
    - name: Work out what needs the hop
      ansible.builtin.set_fact:
        init_every_jump: >-
          {{ ansible_ssh_common_args | default(lookup('ansible.builtin.config', 'ssh_common_args',
                                                      plugin_type='connection', plugin_name='ssh'))
             | ssh_jump(ansible_ssh_extra_args | default('')) }}
        init_alias_jump: >-
          {{ (claude_ssh_options | default({})).keys() | map('lower') | select('in', ['proxyjump', 'proxycommand'])
             | list | length > 0 }}
      check_mode: false

    - name: Log in to the Proxmox host as the VMs' hop
      vm_route:
        do: login
        route: "{{ init_route.route }}"
      register: init_hop
      check_mode: false
      failed_when: false
      when:
        - (init_route.route | default({})).route | default('direct') == 'host'
        - not (init_every_jump | length > 0 and init_alias_jump | bool)

    # From the action's own verdict (ok): failed_when false clears the result's failed.
    - name: Record the route's result
      vars:
        init_route_through: >-
          {{ init_route.route.hop.label | default('') ~ ' (vm_ssh_route: ' ~ init_route.route.setting | default('')
             ~ ')' }}
        init_route_jumped: >-
          {{ 'the VMs are reached by the jump every host is given (' ~ init_every_jump | one_line(120) ~ ')' }}
      ansible.builtin.set_fact:
        init_results: >-
          {{ init_results + [{'ok': false, 'text': init_route.msg | default('the route could not be settled')
                                                  | plain_text | trim}]
             if init_route.route is not defined else
             init_results + [{'ok': true, 'text': init_route_jumped ~ ', and the aliases by the one claude_ssh_options'
                                                  ~ ' names, so just deploy needs no hop through ' ~ init_route_through}]
             if init_hop is skipped and (init_route.route | default({})).route | default('direct') == 'host' else
             init_results + [{'ok': init_hop.ok | default(true) | bool,
                              'text': (init_hop.msg | default('') | plain_text | trim)
                                      if not init_hop.ok | default(true) | bool
                                      else (init_route_jumped ~ ', and only the aliases go through '
                                            ~ init_route_through ~ ', whose login works')
                                      if init_every_jump | length > 0
                                      else 'the VMs are reached through ' ~ init_route_through
                                           ~ ', and its login works'}]
             if init_hop is not skipped else init_results }}

    # --------------------------------------------------------------- the node ---
    - name: Record the node's result
      ansible.builtin.set_fact:
        init_results: "{{ init_results + [init_node_result] }}"
      vars:
        init_node_result: >-
          {{ {'ok': false, 'text': 'Proxmox would not list its nodes (' ~ init_nodes.status | default('')
              ~ ' ' ~ init_nodes.msg | default('') | plain_text | trim ~ ')'}
             if init_nodes.status | default(0) != 200 else
             {'ok': false, 'text': 'the host reported a node named ' ~ init_node_reported | string | plain_text | to_json
              ~ ', which is not a name Proxmox gives a node, so just init writes nothing for it'}
             if init_node_reported | string | length > 0 and init_node_derived | length == 0 else
             {'ok': false, 'text': 'which node ' ~ init_ssh_address ~ ' is cannot be told until root SSH to it works,'
              ~ ' and the cluster has ' ~ init_all_nodes | join(', ') ~ ': just deploy builds the template there and'
              ~ ' clones it on proxmox_node (' ~ proxmox_node ~ ')'}
             if init_node_derived | length == 0 else
             {'ok': false, 'text': init_node_why ~ ', but the cluster has no node ' ~ init_node_derived ~ ' ('
              ~ init_all_nodes | join(', ') ~ '): set proxmox_node in local.yml to the node that host is'}
             if init_node_derived not in init_all_nodes else
             {'ok': true, 'text': 'node ' ~ proxmox_node ~ ': ' ~ ('it holds the template, and just deploy creates the'
              ~ ' VMs there' if init_template_built | bool else 'just deploy builds the template there, and creates'
              ~ ' the VMs there')}
             if init_node_derived == proxmox_node else
             {'ok': true, 'text': 'node ' ~ init_node_derived ~ ': written into local.yml as proxmox_node, since '
              ~ init_node_why}
             if init_node_writes | bool and init_ask | bool else
             {'ok': false, 'text': init_node_why ~ ', but proxmox_node is ' ~ proxmox_node ~ ', and VMs are cloned on'
              ~ ' the node that holds the template: set proxmox_node: ' ~ init_node_derived ~ ' in local.yml'
              ~ (', or build a template on ' ~ proxmox_node ~ ' with a proxmox_template_name of its own'
                 if init_node_set | bool else ' (just init at a terminal writes it)')} }}
      when: init_listed | default(false) | bool

    # ------------------------------------------------------------ the storage ---
    # What the node lists for VM disks is filtered by the token's own rights
    # (Datastore.Audit or AllocateSpace), so a storage another project grants
    # it - the homeserver's - is listed without being named here.
    - name: List the storages for VM disks on the node
      ansible.builtin.uri:
        url: "{{ proxmox_api_url }}/nodes/{{ init_node }}/storage?content=images&enabled=1"
        headers: "{{ proxmox_api_headers }}"
        follow_redirects: none
        validate_certs: "{{ proxmox_api_validate }}"
        ca_path: "{{ proxmox_api_ca_path | default(omit, true) }}"
        timeout: 10
      register: init_storages
      check_mode: false
      failed_when: false
      no_log: true
      when: init_node_listable | bool

    - name: Ask Proxmox what the token may do on each storage
      ansible.builtin.uri:
        url: "{{ proxmox_api_url }}/access/permissions?path=/storage/{{ item.storage | urlencode }}"
        headers: "{{ proxmox_api_headers }}"
        follow_redirects: none
        validate_certs: "{{ proxmox_api_validate }}"
        ca_path: "{{ proxmox_api_ca_path | default(omit, true) }}"
        timeout: 10
      register: init_storage_privileges
      check_mode: false
      failed_when: false
      no_log: true
      loop: "{{ init_storages.json.data | default([]) if init_node_listable | bool else [] }}"

    # ------------------------------------------------------------- the bridge ---
    # Every clone inherits the template's NIC, so with a template the bridge is
    # its net0's, and only SDN.Use on it is checked; without one, proxmox_bridge
    # is the one the build will use, listed and suggested as the storage is.
    # Bridges of the local zone only: an SDN VNet is neither listed nor checked.
    - name: List the bridges on the node
      ansible.builtin.uri:
        url: "{{ proxmox_api_url }}/nodes/{{ init_node }}/network?type=any_local_bridge"
        headers: "{{ proxmox_api_headers }}"
        follow_redirects: none
        validate_certs: "{{ proxmox_api_validate }}"
        ca_path: "{{ proxmox_api_ca_path | default(omit, true) }}"
        timeout: 10
      register: init_bridges
      check_mode: false
      failed_when: false
      no_log: true
      when: init_node_listable | bool and not init_template_built | bool

    - name: Ask Proxmox what the token may do on each bridge
      ansible.builtin.uri:
        url: "{{ proxmox_api_url }}/access/permissions?path=/sdn/zones/localnetwork/{{ item.iface | urlencode }}"
        headers: "{{ proxmox_api_headers }}"
        follow_redirects: none
        validate_certs: "{{ proxmox_api_validate }}"
        ca_path: "{{ proxmox_api_ca_path | default(omit, true) }}"
        timeout: 10
      register: init_bridge_privileges
      check_mode: false
      failed_when: false
      no_log: true
      loop: >-
        {{ ([{'iface': init_template_bridge}] if init_template_built | bool and init_template_bridge | length > 0
            else init_bridges.json.data | default([]) if init_node_listable | bool and not init_template_built | bool
            else []) }}

    # -------------------------------------------------------- the values given ---
    # Every value given is held to what the node lists before anything is
    # written, so a bridge that will not do leaves the storage unwritten too.
    # Where it cannot be held to anything yet - the node unknown, a listing
    # refused - it is refused, rather than written unchecked or dropped.
    - name: Refuse a value given that cannot be checked yet
      ansible.builtin.fail:
        msg: >-
          {{ init_given_unchecked | join(' and ') }} cannot be checked yet ({{ init_unchecked_why if not
          init_node_listable | bool else 'Proxmox would not list them' }}), so just init does not write
          {{ 'it' if init_given_unchecked | length == 1 else 'them' }}: fix what the lines above say, and run it again.
      vars:
        init_given_unchecked: >-
          {{ (['--storage ' ~ init_given.storage]
              if init_given.storage is defined and not init_storages_listed | bool else [])
             + (['--bridge ' ~ init_given.bridge]
                if init_given.bridge is defined and not init_template_built | bool and not init_bridges_listed | bool
                else []) }}
      when: init_given_unchecked | length > 0

    # A bridge given while the template exists: the template's own is nothing to
    # do, so a scripted just init runs again; another cannot apply, clones take
    # the template's NIC.
    - name: Refuse a bridge given that is not the template's
      ansible.builtin.fail:
        msg: >-
          --bridge {{ init_given.bridge }}: the template {{ proxmox_template_name }} is built, and every clone takes
          its NIC, on {{ init_template_bridge or 'its bridge' }}. --bridge matters only before the template is built.
      when: init_given.bridge is defined and init_template_built | bool and init_given.bridge != init_template_bridge

    - name: Check the storage given before anything is written
      ansible.builtin.include_tasks: tasks/init_choose.yml
      vars:
        <<: &init_storage
          init_choose_setting: proxmox_storage
          init_choose_what: storage
          init_choose_value: "{{ proxmox_storage }}"
          init_choose_set: "{{ 'proxmox_storage' in init_local_settings }}"
          init_choose_given: "{{ init_given.storage | default('') }}"
          init_choose_flag: --storage
          init_choose_candidates: >-
            {{ init_storage_privileges.results | default([])
               | init_candidates('storage', '/storage/', init_token_privileges.storage) }}
          init_choose_path: /storage/
          init_choose_node: "{{ init_node }}"
          init_choose_seen_by: [Datastore.Audit, Datastore.AllocateSpace]
        init_choose_only_check: true
      when: init_given.storage is defined and init_storages_listed | bool

    - name: Check the bridge given before anything is written
      ansible.builtin.include_tasks: tasks/init_choose.yml
      vars:
        <<: &init_bridge
          init_choose_setting: proxmox_bridge
          init_choose_what: bridge
          init_choose_value: "{{ proxmox_bridge }}"
          init_choose_set: "{{ 'proxmox_bridge' in init_local_settings }}"
          init_choose_given: "{{ init_given.bridge | default('') }}"
          init_choose_flag: --bridge
          init_choose_candidates: >-
            {{ init_bridge_privileges.results | default([])
               | init_candidates('iface', '/sdn/zones/localnetwork/', init_token_privileges.bridge) }}
          init_choose_path: /sdn/zones/localnetwork/
          init_choose_node: "{{ init_node }}"
          init_choose_seen_by: [SDN.Audit, SDN.Use]
          init_choose_unlisted_note: " (a bridge of the local zone: an SDN VNet is not checked here)"
        init_choose_only_check: true
      when: init_given.bridge is defined and init_bridges_listed | bool

    # ------------------------------------------------------------- the writes ---
    - name: Write proxmox_node into local.yml
      ansible.builtin.include_tasks: tasks/init_local_setting.yml
      vars:
        init_setting_key: proxmox_node
        init_setting_value: "{{ init_node_derived }}"
      when: (init_ask | bool) and init_node_known | bool and init_node_writes | bool

    - name: Settle the storage
      ansible.builtin.include_tasks: tasks/init_choose.yml
      vars: *init_storage
      when: init_storages_listed | bool

    - name: Settle the bridge
      ansible.builtin.include_tasks: tasks/init_choose.yml
      vars: *init_bridge
      when: init_bridges_listed | bool

    # The template's bridge: SDN.Use on it, nothing to choose; and a template
    # with none on net0 is no template a VM can be reached through.
    - name: Record the template's bridge's result
      ansible.builtin.set_fact:
        init_results: >-
          {{ init_results + [{'ok': init_template_bridge | length > 0 and init_lacks | length == 0, 'text':
             ("the template's net0 has no bridge, or its configuration could not be read: every clone inherits"
              ~ ' that NIC, so its VMs would be unreachable. Rebuild the template (just deploy --only template'
              ~ init_host_flag ~ ', after removing it), with proxmox_bridge set')
             if init_template_bridge | length == 0 else
             ('bridge ' ~ init_template_bridge ~ ", the template's: the token has SDN.Use on it")
             if init_lacks | length == 0 else
             ('bridge ' ~ init_template_bridge ~ ", the template's, which every clone inherits: the token lacks"
              ~ ' SDN.Use on /sdn/zones/localnetwork/' ~ init_template_bridge ~ ': pveum aclmod'
              ~ ' /sdn/zones/localnetwork/' ~ init_template_bridge ~ ' -user ' ~ proxmox_api_user ~ ' -role AnsibleVM')}] }}
      vars:
        init_lacks: >-
          {{ (init_bridge_privileges.results | default([])
              | init_candidates('iface', '/sdn/zones/localnetwork/', init_token_privileges.bridge)
              | first | default({'lacks': init_token_privileges.bridge})).lacks }}
      when: init_template_readable | bool

    # What could not be listed is said, never passed over: the run ends on it.
    # A listing Proxmox refused is a problem; one that could not be made yet,
    # its cause already said, is noted.
    - name: Record what could not be checked
      ansible.builtin.set_fact:
        init_results: "{{ init_results + [item] }}"
      loop: >-
        {{ (([{'ok': false, 'skipped': true, 'text': 'the storage is not checked: ' ~ init_unchecked_why}]
             if not init_node_listable | bool else
             [{'ok': false, 'text': 'Proxmox would not list the storages on ' ~ init_node ~ ' ('
               ~ init_storages.status | default('') ~ ' ' ~ init_storages.msg | default('') | plain_text | trim ~ ')'}]
             if not init_storages_listed | bool else [])
            + ([{'ok': false, 'skipped': true, 'text': "the template's bridge is not checked: node "
                 ~ init_template.node ~ ' is not up'}]
               if init_template_built | bool and not init_template_readable | bool else
               [{'ok': false, 'skipped': true, 'text': 'the bridge is not checked: ' ~ init_unchecked_why}]
               if not init_template_built | bool and not init_node_listable | bool else
               [{'ok': false, 'text': 'Proxmox would not list the bridges on ' ~ init_node ~ ' ('
                 ~ init_bridges.status | default('') ~ ' ' ~ init_bridges.msg | default('') | plain_text | trim ~ ')'}]
               if not init_template_built | bool and not init_bridges_listed | bool else []))
           if init_api_ok | bool else [] }}
      loop_control:
        label: "{{ item.text }}"

    # ---------------------------------------------------- a renamed password ---
    # vault.yml's vm_password is vault_vm_password from 1.0; one still set would
    # give the VMs no password, so it is named here, before any deploy.
    - name: Record a console password under its old name
      ansible.builtin.set_fact:
        init_results: >-
          {{ init_results + [{'ok': false, 'text': 'vm_password is set, which is vault_vm_password from 1.0: rename'
             ~ ' it in vault.yml, with just vault'}] }}
      when: vm_password | default('', true) | string | length > 0

    # ----------------------------------------------------------- the VM's key ---
    - name: Look for a public key, as the VMs would get none
      ansible.builtin.find:
        paths: "{{ init_ssh_dir }}"
        patterns: "*.pub"
      register: init_public_keys
      when: init_keyless | bool

    - name: Record the key's result
      ansible.builtin.set_fact:
        init_results: >-
          {{ init_results + [{'ok': vm_ssh_public_keys | length > 0, 'text':
             ('the VMs get ' ~ vm_ssh_public_keys | length ~ ' SSH key' ~ ('' if vm_ssh_public_keys | length == 1 else 's'))
             if vm_ssh_public_keys | length > 0 else
             ('the VMs get only vault_vm_password, which is for the Proxmox console: SSH to them takes a key, and just'
              ~ ' deploy configures them over SSH. Put yours in local.yml as vm_ssh_public_keys')
             if not init_keyless | bool else
             ('the VMs would get no SSH key, so just deploy refuses them: put yours in local.yml, as'
              ~ ' vm_ssh_public_keys: ["<the line in ' ~ (init_public_keys.files | map(attribute='path') | sort | first)
              ~ '>"]')
             if init_public_keys.files | default([]) | length > 0 else
             ('the VMs would get no SSH key, and ' ~ init_ssh_dir ~ ' has no public key: make one with ssh-keygen'
              ~ ' -t ed25519')}] }}

    # ------------------------------------------------- another host's own ---
    # A host of just init --host's: what it sets for itself, in its own
    # local.yml (init_host.always), where it does not set it yet - the node, the
    # storage and the bridge as the checks above settled them, the rest as this
    # run reads them, the shared files' - and its default VM's name, never the
    # first host's, as a VM name is one host's. Only once every check passed: a
    # value the checks could not hold to the host is never written for it, and a
    # run against the host refuses it until each is there.
    - name: Read the host's local.yml again
      ansible.builtin.slurp:
        src: "{{ init_local_file }}"
      register: init_host_local_read
      when: (init_host_name | length > 0) and init_problems | length == 0 and init_unchecked | length == 0

    - name: Write what the host sets for itself into its local.yml
      ansible.builtin.include_tasks: tasks/init_local_setting.yml
      vars:
        init_setting_key: "{{ item }}"
        init_setting_value: >-
          {{ init_host.default_vm if item == 'vm_default_name' else lookup('ansible.builtin.vars', item) }}
      loop: >-
        {{ (init_host.always | default([]) + ['vm_default_name'])
           | reject('in', (init_host_local_read.content | b64decode | from_yaml) or {}) | list
           if init_host_local_read is not skipped else [] }}
      # The host's name was given on the command line (just init --host): a value given, as every write's is.
      when: (init_host_name | length > 0) and init_problems | length == 0 and init_unchecked | length == 0

    # ---------------------------------------------------------------- the end ---
    - name: Remove the run's copy of the certificate
      ansible.builtin.file:
        path: "{{ init_trust_run_file }}"
        state: absent
      when: init_trust_run_copy | default(false) | bool

    - name: Say what each check found
      ansible.builtin.debug:
        msg: |-
          {% for result in init_results %}
          {{ '  --   ' if result.skipped | default(false) else '  note ' if result.note | default(false)
             else '  ok   ' if result.ok else '  !!   ' }}{{ result.text }}
          {% endfor %}
          {% if init_problems | length == 0 and init_unchecked | length == 0 and init_github_set | bool %}
          {{ init_deploy_next }}
          {% endif %}

    # NEXT STEPS (callback_plugins/agent_warehouse.py): each problem with its
    # fix, what could not be checked, or just deploy; nothing while only the
    # GitHub username is missing, which init_settings.yml's records. A run that
    # stopped at once, a value still the example's, records nothing.
    - name: Keep what is left to do for the end of the run
      ansible.builtin.set_stats:
        data:
          claude_vm_next: "{{ {'just init': {'init_check': init_left}} }}"
        aggregate: true
        per_host: false

    - name: Fail when a check found a problem
      ansible.builtin.fail:
        msg: >-
          just init found {{ init_problems | length }} problem{{ '' if init_problems | length == 1 else 's' }}
          (the lines marked !! above) for just deploy: fix {{ 'it' if init_problems | length == 1 else 'them' }},
          then run just init again.
      when: init_problems | length > 0
