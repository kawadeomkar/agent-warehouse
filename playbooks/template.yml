---
# One-time: build a cloud-init enabled Ubuntu template on the Proxmox host.
# Runs over SSH on the PVE node because importing a disk image needs `qm`.
- name: Build the cloud-init VM template
  hosts: proxmox
  become: true
  # The role reads no ansible_* facts, so there is nothing worth gathering. What
  # lets deploy.yml skip this play without an SSH connection is the import's
  # when:, which ansible-core applies to the implicit fact-gathering task too,
  # not this line - it only saves a pointless gather on the first run, when the
  # play does execute.
  gather_facts: false
  # A new Proxmox host has no root remote_tmp yet either, and the build's
  # get_url would make it and warn.
  pre_tasks:
    - name: Make root's Ansible temporary directory
      ansible.builtin.import_tasks: tasks/remote_tmp.yml
  roles:
    - role: proxmox_template
      # A template you built is yours: the project builds none beside it.
      when: proxmox_template_custom | default('', true) | length == 0
  tasks:
    - name: Say that a template you built is used
      ansible.builtin.debug:
        msg: >-
          proxmox_template_custom names the template "{{ proxmox_template_custom }}", so no template is built: new VMs
          clone that one.
      when: proxmox_template_custom | default('', true) | length > 0
