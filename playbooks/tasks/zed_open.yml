---
# Zed's window, for playbooks/code.yml's window step, after the session copies
# and the notes: the Claude task just code writes on the VM, beside the
# repositories and never in one, the shared helper it runs, the window itself,
# and what is said of it. Why Claude is a task the user starts, and why it has
# no tag or key of the project's: docs/architecture/decisions.md §15.4.
# `zed ssh://<alias><folder>` goes through the alias this run refreshed, which
# Zed reads from ~/.ssh/config as ssh does: one path, since Zed refuses a
# second ssh:// path in one command (seen on Zed 1.26.2), and a second command
# would race the window the first is still connecting. Imported only when the
# editor is Zed; nothing of the other editor's (its workspace file, its
# helpers) is written.

# What the task runs, by path, first: a task written before it, the copy then
# failing, would run a file that is not there. Only where the editors list's
# task is written at all (code_claude_task_written: just code's directory
# inside the projects directory, the folder of the window that lists it); the
# same file every time, so a run that only reopens a window rewrites nothing;
# run by bash, never executed itself, hence 0644. A helpers directory that
# exists keeps its mode, as just code's own directory does.
- name: zed_open | Look for the directory for the helpers on the VM
  ansible.builtin.stat:
    path: "{{ code_helpers_dir }}"
    get_checksum: false
  delegate_to: "{{ claude_vm_names[0] }}"
  register: code_zed_helpers_dir_found
  when: code_claude_task_written | bool

- name: zed_open | Make the directory for the helpers on the VM
  ansible.builtin.file:
    path: "{{ code_helpers_dir }}"
    state: directory
    mode: "{{ omit if code_zed_helpers_dir_found.stat.exists | default(false) else '0755' }}"
  delegate_to: "{{ claude_vm_names[0] }}"
  when: code_claude_task_written | bool

- name: zed_open | Write the shared helpers on the VM
  ansible.builtin.copy:
    src: "{{ code_shared_helper }}"
    dest: "{{ code_helpers_dir }}/{{ code_shared_helper }}"
    mode: "0644"
  delegate_to: "{{ claude_vm_names[0] }}"
  loop: "{{ code_shared_helpers }}"
  loop_control:
    loop_var: code_shared_helper
  when: code_claude_task_written | bool

# Never over a tasks file that is someone else's (code_zed_tasks_foreign,
# which tasks/zed_check.yml read before the notes). The file's text is fixed,
# and the helper's path is the one thing variable in it, an argument held to
# code_helper_path_pattern. No cwd, so the task runs in the window's folder,
# Zed's default for a folder's tasks; a new terminal for every spawn, Zed's
# always-new-tab path, so a spawn never replaces a Claude already running; no
# tag; a label no repository's own "Claude" shares. Zed lists a folder's tasks
# from any .zed/tasks.json in the window's tree, in Restricted Mode too (seen
# on Zed 1.26.2), and runs one only when the user picks it.
- name: zed_open | Look for the directory for Zed's tasks on the VM
  ansible.builtin.stat:
    path: "{{ code_ws_dir }}/.zed"
    get_checksum: false
  delegate_to: "{{ claude_vm_names[0] }}"
  register: code_zed_tasks_dir_found
  when: code_claude_task_written | bool and not code_zed_tasks_foreign | bool

- name: zed_open | Make the directory for Zed's tasks on the VM
  ansible.builtin.file:
    path: "{{ code_ws_dir }}/.zed"
    state: directory
    mode: "{{ omit if code_zed_tasks_dir_found.stat.exists | default(false) else '0755' }}"
  delegate_to: "{{ claude_vm_names[0] }}"
  when: code_claude_task_written | bool and not code_zed_tasks_foreign | bool

- name: zed_open | Write Zed's tasks on the VM
  vars:
    code_zed_tasks:
      - label: Claude (just code)
        command: bash
        args: ["{{ code_start_helper }}"]
        allow_concurrent_runs: true
        use_new_terminal: true
        show_command: false
  ansible.builtin.copy:
    dest: "{{ code_ws_dir }}/.zed/tasks.json"
    content: "{{ code_ownership_marker }}\n{{ code_zed_tasks | to_nice_json(indent=2) }}\n"
    mode: "0644"
  delegate_to: "{{ claude_vm_names[0] }}"
  when: code_claude_task_written | bool and not code_zed_tasks_foreign | bool

- name: zed_open | Open the folder in Zed
  ansible.builtin.command:
    argv:
      - "{{ code_zed_command }}"
      - ssh://{{ claude_vm_names[0] }}{{ code_target }}
  changed_when: true

# Claude in the window, as what was written allows: the task where the window
# lists it, claude typed in Zed's terminal otherwise, and why there is no task
# where one was not written. Zed's behaviour is said as it was seen on Zed
# 1.26.2, by what the user sees, never by version: Zed asks nothing about
# trust, and a later Zed holds a folder's tasks back until it is trusted.
- name: zed_open | Say what was opened
  vars:
    # Written, and so listed in every window whose folder holds just code's
    # directory: the projects directory's, by default. Each a boolean as it is
    # rendered, read as one: a task var put through bool in another of the same
    # task is a string to ansible-lint, which renders them apart.
    code_zed_task_there: "{{ code_claude_task_there | bool }}"
    code_zed_task_listed: "{{ code_zed_task_there and code_ws_dir.startswith(code_target ~ '/') }}"
    code_zed_terminal: >-
      {{ 'Open a terminal there, in the terminal panel, and run claude: the terminal is the VM'
         ~ "'s, and claude is signed in there by just deploy (or just login " ~ claude_vm_names[0]
         ~ ' --only claude).' }}
    code_zed_claude: >-
      {{ 'Open a terminal there, in the terminal panel, and run claude --resume ' ~ code_session_id
         ~ ' to continue the session just code carried over, on '
         ~ code_session_plan.session.branch ~ ' at ' ~ code_session_commit[:12] ~ code_session_moved_said ~ '.'
         ~ code_session_cautions
         if code_session_id | length > 0
         else 'Claude is a task there: "task: spawn" in the command palette lists Claude (just code), which runs'
              ~ " claude in a terminal of its own, the VM's: it picks the folder's last conversation up, or starts"
              ~ ' a fresh one where a claude already has it open, so a second one never ends or shares the first;'
              ~ ' claude is signed in there by just deploy (or just login ' ~ claude_vm_names[0] ~ ' --only claude).'
              ~ ' docs/guides/zed.md: one key, or Claude with no key.'
         if code_zed_task_listed
         else code_zed_terminal
              ~ (' The window of just code ' ~ claude_vm_names[0] ~ ' lists a task, Claude (just code), that does'
                 ~ ' it; docs/guides/zed.md: one key, or Claude with no key.'
                 if code_zed_task_there
                 else ' No Claude task was written: the path of its helper, ' ~ code_start_helper
                      ~ ', holds a character a task is not handed as it is (letters, digits, ".", "_", "-" and "/"'
                      ~ ' are).'
                 if code_terminal and code_editor_claude == 'listed' and code_ws_below | length > 0
                    and code_start_helper is not match(code_helper_path_pattern)
                 else '') }}
    code_zed_foreign_said: >-
      {{ code_ws_dir ~ "/.zed/tasks.json is not just code's, so it was left as it is, and Zed lists no Claude"
         ~ " task of just code's there." if code_zed_tasks_foreign | bool else '' }}
    code_said:
      - Zed is opening {{ code_target }} on {{ claude_vm_names[0] }} ({{ code_reach }}).
      - The first connection installs Zed's remote server on the VM and takes a moment.
      - "{{ code_zed_claude }}"
      - "{{ code_zed_foreign_said }}"
      - >-
        Claude Agent in Zed's Agent Panel runs on the VM as well, signed in the same way, but as a Claude Code of
        its own that Zed installs and updates. Zed asks nothing about trust: Restricted Mode shows at the top left
        of the window once it holds something back, a language server, and trusting the projects window trusts
        every checkout in it.
      # Only in a window that lists the task: elsewhere there is nothing task: spawn could hold back, and a
      # missing task is no trust problem.
      - >-
        {{ 'If task: spawn lists no Claude (just code) and Restricted Mode shows, docs/guides/zed.md says what to do'
           ~ ' instead.' if code_zed_task_listed else '' }}
      - "{{ ('The session notes about the VM are at ' ~ code_notes_file ~ '.') if code_notes | bool else '' }}"
      - "{{ code_sessions_said }}"
  ansible.builtin.debug:
    msg: "{{ code_said | select | join(' ') | trim }}"

# What it says is for the window opening now: nothing left for NEXT STEPS.
- name: zed_open | Keep what is left to do for the end of the run
  ansible.builtin.set_stats:
    data:
      code_next: "{{ {claude_vm_names[0]: {'editor': ''}} }}"
    aggregate: true
    per_host: false
