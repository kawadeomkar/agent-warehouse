---
# Zed's window, for playbooks/code.yml's window step, after the session copies
# and the notes: `zed ssh://<alias><folder>`, through the alias this run
# refreshed, which Zed reads from ~/.ssh/config as ssh does. Zed starts nothing
# when a window opens, and this project writes neither a repository's
# .zed/tasks.json nor the user's own Zed settings (docs/architecture/decisions.md
# §15.4), so claude is started by the user, in Zed's terminal, which runs on the
# VM - said below. Zed's Agent Panel runs Claude Agent on the VM too (seen on
# Zed 1.26: Zed's remote server installs and starts it there, under the VM's
# ~/.claude and claude.ai login), but with a Claude Code of its own, so the
# terminal comes first. Imported only when the editor is Zed; nothing of the
# other editor's (its workspace file, its helpers) is written.
- name: zed_open | Open the folder in Zed
  ansible.builtin.command:
    argv:
      - "{{ code_zed_command }}"
      - ssh://{{ claude_vm_names[0] }}{{ code_target }}
  changed_when: true

- name: zed_open | Say what was opened
  vars:
    code_zed_claude: >-
      {{ 'Open a terminal there, in the terminal panel, and run claude --resume ' ~ code_session_id
         ~ ' to continue the session just code carried over, on '
         ~ code_session_plan.session.branch ~ ' at ' ~ code_session_commit[:12] ~ code_session_moved_said ~ '.'
         ~ code_session_cautions
         if code_session_id | length > 0
         else 'Open a terminal there, in the terminal panel, and run claude: the terminal is the VM'
              ~ "'s, and claude is signed in there by just deploy (or just login " ~ claude_vm_names[0]
              ~ ' --only claude).' }}
    code_said:
      - Zed is opening {{ code_target }} on {{ claude_vm_names[0] }} ({{ code_reach }}).
      - The first connection installs Zed's remote server on the VM and takes a moment.
      - "{{ code_zed_claude }}"
      - >-
        Claude Agent in Zed's Agent Panel runs on the VM as well, signed in the same way, but as a Claude Code of
        its own that Zed installs and updates. Zed opens a folder it has not seen in Restricted Mode, said at the
        top left of the window, and asks nothing: whether to trust it is yours.
      - "{{ ('The session notes about the VM are at ' ~ code_notes_file ~ '.') if code_notes | bool else '' }}"
      - "{{ code_sessions_said }}"
  ansible.builtin.debug:
    msg: "{{ code_said | select | join(' ') | trim }}"

# What it says is for the window opening now: nothing left for NEXT STEPS.
- name: zed_open | Keep what is left to do for the end of the run
  ansible.builtin.set_stats:
    data:
      code_next: "{{ {claude_vm_names[0]: {'editor': ''}} }}"
    aggregate: true
    per_host: false
