---
# The writes of the repository sync, imported by code.yml's window step after
# the session handoff's and every refusal just code has, so a run that stops
# leaves the VM as it was (docs/architecture/lifecycle.md §4.9).
# tasks/repo_read.yml decided what goes (code_repo_plan).
#
# git send-pack, the plumbing under git push, carries this machine's branches
# and tags - its refs alone, each named in full - into the VM checkout's own
# refs of the sync's (refs/agent-warehouse/sent/), over the alias, as the
# session copy's rsync goes. Not git push: send-pack runs no pre-push hook,
# obeys no pushInsteadOf, and writes nothing here. git_sync_apply then decides
# on the VM, from the checkout as it is there, what each branch becomes, and
# moves nothing the VM made. Neither ever fails the step: what they could not
# do is said, and the window opens.
#
# The files git ignores go by rsync into a mirror in just code's own directory
# there, and the apply puts each in place only where the VM has no file of its
# own at its path.
#
# Inputs: code.yml's play vars code_repo_sync, code_repo_plan, code_repo_dir,
# code_repo_target, code_repo_mirror_target and code_repo_receive_pack, and the
# folder code_target.

# The VM user's alone: the manifest names this machine's folders.
- name: repo_write | Make the directory for the repository sync on the VM
  ansible.builtin.file:
    path: "{{ code_repo_dir }}"
    state: directory
    mode: "0700"
  delegate_to: "{{ claude_vm_names[0] }}"
  when: code_repo_sync | bool

# Said before send-pack starts, which shows nothing while it sends: a first
# send of branches never pushed can be large, and here is how to bound it.
- name: repo_write | Say what is sent
  ansible.builtin.debug:
    msg: >-
      Sending {{ code_repo_plan.refs | length }} of {{ code_repo_plan.source }}'s branches and tags to
      {{ claude_vm_names[0] }}, {{ code_repo_plan.send_bytes | human_readable }} of git objects it lacks:
      repo_sync: false sends none, repo_sync_max_size bounds it.
  when: code_repo_sync | bool and code_repo_plan.send

# Its refs on stdin, made from this machine's alone; to a path the VM's
# checkout is held to, after the alias as rsync names one, never an ssh://
# URL; git-receive-pack by its path there, since the VM user's PATH starts with
# ~/.local/bin. A branch a shallow clone there refuses is that branch alone,
# the rest sent, whatever the exit code (1 from git 2.56, 255 from 2.43, whose
# send-pack also fails its own walk): the apply says which arrived. A ref sent
# is a line of its own on standard error, with LC_ALL=C; a send of nothing is
# "Everything up-to-date".
- name: repo_write | Send the branches to the VM
  ansible.builtin.command:
    argv:
      - git
      - --no-optional-locks
      - -C
      - "{{ code_repo_plan.source }}"
      - send-pack
      - --force
      - --stdin
      - --receive-pack={{ code_repo_receive_pack }}
      - "{{ code_repo_target }}"
    stdin: "{{ code_repo_plan.refs | join('\n') }}"
  environment:
    GIT_SSH_COMMAND: ssh -o BatchMode=yes
    GIT_TERMINAL_PROMPT: "0"
    LC_ALL: C
  register: code_repo_sent
  changed_when: code_repo_sent.stderr | default('') is search('(?m)^ [ *+] .* -> refs/agent-warehouse/sent/')
  failed_when: false
  when: code_repo_sync | bool and code_repo_plan.send

# The files of the changes not committed and the files git ignores, into a
# mirror in just code's own directory on the VM, never into the checkout: the
# apply puts each in place. A list of plain files the reader looked at, on
# stdin, each as ./<path>, since rsync takes a line that starts with # or ; for
# a comment. macOS's rsync sends nothing at all of a list with one name gone
# since, and a connection can drop: a failure is said, and the apply takes a
# copy only where it is the file the reader saw, by its size and modification
# time, which -a keeps - never one an earlier run left. rsync's own comparison
# of sizes and times makes a run where nothing changed send nothing.
- name: repo_write | Send the files to the VM
  ansible.builtin.command:
    argv:
      - rsync
      - -az
      - -r
      - --files-from=-
      - --itemize-changes
      - -e
      - ssh -o BatchMode=yes
      - "{{ code_repo_plan.source }}/"
      - "{{ code_repo_mirror_target }}/"
    stdin: "{{ code_repo_plan.files | map('regex_replace', '^', './') | join('\n') }}"
  register: code_repo_files_sent
  changed_when: code_repo_files_sent.stdout | default('') | trim | length > 0
  failed_when: false
  when: code_repo_sync | bool and code_repo_plan.files | length > 0

- name: repo_write | Bring the VM's checkout to what was sent
  git_sync_apply:
    checkout: "{{ code_target }}"
    manifest: "{{ code_repo_dir }}/manifest.json"
    source: "{{ code_repo_plan.source }}"
    branches: "{{ code_repo_plan.branches }}"
    tags: "{{ code_repo_plan.tags }}"
    head: "{{ code_repo_plan.head }}"
    session_branch: "{{ code_repo_plan.session_branch }}"
    tree: "{{ code_repo_plan.tree }}"
    mirror: "{{ code_repo_dir }}/tree"
    stamps: "{{ code_repo_plan.stamps }}"
    ignored: "{{ code_repo_plan.ignored }}"
    gone: "{{ code_repo_plan.gone }}"
    unignored: "{{ code_repo_plan.unignored }}"
    upstreams: "{{ code_repo_plan.upstreams }}"
  delegate_to: "{{ claude_vm_names[0] }}"
  register: code_repo_applied
  when: code_repo_sync | bool

- name: repo_write | Say what was carried
  ansible.builtin.debug:
    msg: >-
      {{ code_repo_plan | repo_sync_said(claude_vm_names[0], code_project, code_repo_applied,
                                         {'rc': code_repo_sent.rc | default(none),
                                          'words': code_repo_sent.stderr | default('') | trim,
                                          'files_rc': code_repo_files_sent.rc | default(none),
                                          'files_words': code_repo_files_sent.stderr | default('') | trim}) }}
  when: code_repo_sync | bool

# NEXT STEPS: a branch or the checkout left because the VM has work of its own
# there, which the person must deal with; '' once nothing is.
- name: repo_write | Keep what is left to do for the end of the run
  ansible.builtin.set_stats:
    data:
      code_next: >-
        {{ {claude_vm_names[0]: {'repository': code_repo_plan | repo_sync_next(claude_vm_names[0], code_project,
                                                                               code_repo_applied,
                                                                               code_editor_flag)}} }}
    aggregate: true
    per_host: false
  when: code_repo_sync | bool

# --session, where the sync carries its repository and so is the one thing
# that moves its checkout: the checkout must now be on the session's branch at
# its commit, or the resumed conversation would describe work the folder does
# not hold - whether the sync ran or not.
- name: repo_write | Fail unless the VM checkout is at the session's commit
  ansible.builtin.assert:
    that:
      - code_repo_applied.tree.brought | default(false)
      - code_repo_applied.tree.head | default('') == code_session_commit
    fail_msg: >-
      {{ code_target }} on {{ claude_vm_names[0] }} was not brought to {{ code_session_plan.session.branch }} at
      {{ code_session_commit[:12] }}, where session {{ code_session_id }} is here:
      {{ (code_repo_applied.tree.why | default('', true) or 'the sync did not move it') | plain_text }}.
    quiet: true
  when: code_repo_carries_session | bool
