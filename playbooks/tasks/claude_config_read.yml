---
# The reads of what just code carries of this machine's Claude Code beside the
# sessions, imported by code.yml's window step after the session handoff's
# (tasks/session_read.yml), once the VM answers (docs/architecture/lifecycle.md
# §4.9): the auto memory of each repository the VM has a checkout of. They
# decide what goes where; nothing is written anywhere.
# tasks/claude_config_write.yml does that, after every refusal just code has.
#
# claude_config_info returns names, sizes and digests, never what a file
# holds.
#
# Inputs: code.yml's play vars code_config_on (any part on), code_config_memory
# (claude_memory_sync), code_session_here and code_session_there (Claude Code's
# directory on this machine and on the VM) and code_projects_dir; the session
# handoff's reads where it ran. Sets code_config_plan.

- name: claude_config_read | Read this machine's Claude Code configuration
  claude_config_info:
    path: "{{ code_session_here }}"
    memory: "{{ code_config_memory | bool }}"
    repo_paths: true
  register: code_config_here
  no_log: true
  when: code_config_on | bool

# The session handoff reads these too, where it runs.
- name: claude_config_read | Read the origin of each project on the VM
  git_checkouts_info:
    under: "{{ code_projects_dir }}"
  delegate_to: "{{ claude_vm_names[0] }}"
  register: code_config_projects
  when: code_config_on | bool and not (code_session_on | bool)

# Which checkout here a repository's notes are in: by its origin and top
# level, as git says them, never by the folder's name. git reads only, as
# git --no-optional-locks.
- name: claude_config_read | Read the checkouts here of the VM's repositories
  git_checkouts_info:
    paths: >-
      {{ code_config_here.repo_paths
         | claude_config_paths(code_config_vm_checkouts,
                               code_session_found.sessions | default([]) | claude_session_dirs
                               if code_session_on | bool else []) }}
  register: code_config_checkouts_here
  when: code_config_memory | bool

- name: claude_config_read | Settle what is carried
  ansible.builtin.set_fact:
    code_config_plan: >-
      {{ code_config_here
         | claude_config_plan(code_config_checkouts_here.checkouts | default([]), code_config_vm_checkouts,
                              code_session_here, code_session_there, {'memory': code_config_memory | bool}) }}
  when: code_config_on | bool
