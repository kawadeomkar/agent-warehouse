---
# Zed, for playbooks/code.yml's window step, before anything is written on
# the VM. On this machine, its command: `zeditor` as some Linux distributions
# name it, or `zed`. Neither name is Zed's alone - ZFS's event daemon is `zed`
# too, in /usr/sbin or, on Arch, /usr/bin, which is why Arch names Zed
# `zeditor` - so every command of either name on PATH is asked its version,
# `zeditor`s first, and the first that says it is Zed is the one run: an
# ssh:// URL is never handed to a daemon. Zed needs no extension for SSH, and
# installs its own server on the VM (~/.zed_server) the first time it
# connects. Then, read on the VM, the tasks file in just code's directory
# there, and last, what was found, for the editor's plan. Imported only when
# the editor is Zed; every name starts with code_zed_ but code_probe, which
# each editor's check sets last, since a skipped task still overwrites its
# register and another editor's file is imported beside this one.
- name: zed_check | Look for Zed's commands on this machine
  ansible.builtin.command:
    argv: [which, -a, zeditor, zed]
  register: code_zed_which
  changed_when: false
  failed_when: false
  check_mode: false  # a read, which --check would skip and so find no Zed

# `zed --version` prints "Zed <version> - <where it is>" (Zed Preview's too);
# ZFS's daemon prints its usage or its own version, never that.
- name: zed_check | Ask each whether it is Zed
  ansible.builtin.command:
    argv: ["{{ code_zed_candidate }}", --version]
  register: code_zed_versions
  changed_when: false
  failed_when: false
  check_mode: false
  loop: "{{ code_zed_which.stdout_lines | default([]) | select | unique | list }}"
  loop_control:
    loop_var: code_zed_candidate

# A tasks file already in just code's directory on the VM is just code's only
# where its first line is just code's marker (lib/claude_vm/editors/common.py);
# Zed reads a tasks file as JSON with comments, so the marker costs it nothing.
# One without it is someone else's: left as it is by the plan, and said.
# Read here, before anything is written there, since the notes, written
# before the window, say whether the task is there. A read, on the VM, only
# where the task is written at all.
- name: zed_check | Read Zed's tasks already on the VM
  ansible.builtin.slurp:
    src: "{{ code_ws_dir }}/.zed/tasks.json"
  delegate_to: "{{ claude_vm_names[0] }}"
  register: code_zed_tasks_found
  failed_when: false
  when: code_claude_task_written | bool

# What was found, for the editor's plan (code_plan, code.yml), which picks
# the command that says it is Zed, refuses a folder Zed's URL cannot carry,
# and leaves a tasks file there that is someone else's: which's lines, what
# each command that answered said of its version, and the first line of the
# tasks file there, if any.
- name: zed_check | Keep what was found
  ansible.builtin.set_fact:
    code_probe:
      which: "{{ code_zed_which.stdout_lines | default([]) | select | list }}"
      versions: >-
        {{ code_zed_versions.results | default([]) | selectattr('rc', 'defined') | selectattr('rc', 'equalto', 0)
           | map(attribute='code_zed_candidate')
           | zip(code_zed_versions.results | default([]) | selectattr('rc', 'defined')
                 | selectattr('rc', 'equalto', 0) | map(attribute='stdout'))
           | list }}
      tasks_head: >-
        {{ (code_zed_tasks_found.content | b64decode).splitlines() | first | default('')
           if code_zed_tasks_found.content is defined else none }}
