---
# The plan of who is on a VPN's network (docs/architecture/custom-code.md §7.11),
# from localhost: each VM as Proxmox and its roles left it, the family's plan
# (vpn_member_plan, lib/claude_vm/vpn/), and its refusal before anything is
# applied (tasks/vpn_apply.yml). Only a VM that is a Proxmox VM is planned:
# Vagrant and the scenarios have none, and nothing is kept for them.
#
# Input, through vars: on the import: claude_vpn_planned, the VPN whose members
# are planned (a key of claude_vpns); claude_vpn_hosts, the names of the VMs;
# claude_vpn_phase, configure or release.
# Begun empty on every import, so that neither is ever an earlier one's: with
# no Proxmox VM to plan, the plan is nothing and nothing is applied.
- name: vpn_members | Begin the VMs to plan, and the plan
  ansible.builtin.set_fact:
    claude_vpn_members: []
    claude_vpn_plan: {}

# Each VM by its name and the VM ID discovery read from Proxmox, never what the
# VM says: its marks as Proxmox holds them (claude_vm_marks; a host added
# without them carries Tailscale's record alone, as tailscale_joined_before),
# what its roles saw, and the network of its own address.
- name: vpn_members | Add each VM as Proxmox and its roles left it
  vars:
    claude_vpn_of: "{{ hostvars[claude_vpn_host] }}"
    claude_vpn_lan: "{{ (claude_vpn_of.ansible_facts | default({})).default_ipv4 | default({}) }}"
  ansible.builtin.set_fact:
    claude_vpn_members: >-
      {{ claude_vpn_members + [{
           'vm': {'name': claude_vpn_host, 'vmid': claude_vpn_of.proxmox_vm_id | default(claude_vpn_of.claude_vm_listed_id) | int},
           'leaving': claude_vpn_phase == 'release',
           'marks': claude_vpn_of.claude_vm_marks
                    | default(['tailscale'] if claude_vpn_of.tailscale_joined_before | default(false) | bool else []),
           'login_seen': claude_vpn_of.tailscale_login_to_record | default(false) | bool,
           'public_key': claude_vpn_of.wireguard_public_key | default(''),
           'handshake': claude_vpn_of.wireguard_handshake | default(false) | bool,
           'lan': (claude_vpn_lan.network ~ '/' ~ claude_vpn_lan.prefix)
                  if claude_vpn_lan.network is defined and claude_vpn_lan.prefix is defined else ''}] }}
  when: >-
    hostvars[claude_vpn_host].proxmox_vm_id is defined
    or hostvars[claude_vpn_host].claude_vm_listed_id | default(0) | int > 0
  loop: "{{ claude_vpn_hosts | select('in', hostvars) | list }}"
  loop_control:
    loop_var: claude_vpn_host

# A hub with an API (wireguard_hub: opnsense): its instance and every peer it
# has, read from this machine through the project's own module, which pins the
# router's certificate, refuses a router below OPNsense 26.7.2 and drops every
# private key the API answers with before anything is kept
# (playbooks/library/opnsense_wireguard.py). At a release, only where a VM
# leaving has an address: a router that cannot be read has nothing to say then.
- name: vpn_members | Read the hub's instance and its peers
  opnsense_wireguard:
    url: "https://{{ hostvars[groups['wireguard_hub'][0]].ansible_host }}"
    cert_sha256: "{{ wireguard_hub_cert_sha256 }}"
    api_key: "{{ wireguard_hub_api_key }}"
    api_secret: "{{ wireguard_hub_api_secret }}"
    instance: "{{ wireguard_hub_instance }}"
    state: read
  register: claude_vpn_hub
  check_mode: false
  when:
    - claude_vpn_planned == 'wireguard'
    - wireguard_hub | default('manual') == 'opnsense'
    - claude_vpn_members | length > 0
    - >-
      claude_vpn_phase != 'release'
      or claude_vpn_members | map(attribute='marks') | flatten | select('match', 'wg-') | list | length > 0

# WireGuard's addresses from the cluster as it is now: a single-name deploy
# lists nothing before (provision lists only for several new VMs, and deploy
# configures with discovery off), and a listing taken at discovery is minutes
# old by the plan - another run may have given an address, or made a VM whose
# peer a prune would take for one whose VM is gone. Included, so that a plan
# that needs none leaves the run's listing as it was.
- name: vpn_members | List the cluster again, for the addresses every VM holds now
  ansible.builtin.include_tasks: cluster_vms.yml
  when:
    - claude_vpn_planned == 'wireguard'
    - claude_vpn_phase == 'configure'
    - claude_vpn_members | length > 0

- name: vpn_members | Plan each VM's place on the network
  ansible.builtin.set_fact:
    claude_vpn_plan: >-
      {{ claude_vpn_planned | vpn_member_plan(claude_vpns, {
           'phase': claude_vpn_phase,
           'tag': claude_vm_tag | lower,
           'reach': vpn_reach | default('lan') if claude_vpn_planned == claude_vpn_key | default('none') else 'lan',
           'members': claude_vpn_members} | combine(claude_vpn_wireguard if claude_vpn_planned == 'wireguard' else {})) }}
  vars:
    # WireGuard's hub and range, from the settings, and every address another
    # VM of the project holds, from Proxmox's listing (claude_vm_all), the
    # members' own left out.
    claude_vpn_wireguard:
      hub: "{{ claude_vpn_hub_read if wireguard_hub == 'opnsense' else claude_vpn_hub_set }}"
      vm_prefix: "{{ wireguard_vm_prefix }}"
      keepalive: "{{ wireguard_keepalive | int }}"
      taken: >-
        {{ claude_vm_all.json.data | default([], true)
           | proxmox_wireguard_taken(claude_vm_tag, claude_vpn_members | map(attribute='vm.vmid') | list) }}
      # Every tagged VM of a complete listing, so that a hub's peer whose VM is gone is pruned: only fleet-wide, and
      # only while every VM the listing holds has its name (a node down leaves one without), never by a named run.
      fleet: >-
        {{ claude_vm_tagged
           if vm_name is not defined and claude_vm_all.json is defined
              and claude_vm_all.json.data | selectattr('type', 'equalto', 'qemu') | rejectattr('name', 'defined')
                  | list | length == 0
           else [] }}
    # The hub as the settings say it (manual), or as the router read it (opnsense): its instance's tunnel network
    # and key are the router's own.
    claude_vpn_hub_set:
      kind: "{{ wireguard_hub }}"
      network: "{{ wireguard_hub_network }}"
      public_key: "{{ wireguard_hub_public_key }}"
      endpoint: "{{ wireguard_hub_endpoint }}"
    claude_vpn_hub_read:
      kind: opnsense
      listed: "{{ claude_vpn_hub.listed | default(false) }}"
      instance: "{{ wireguard_hub_instance }}"
      # Its first IPv4 address: an instance may list an IPv6 one first.
      network: >-
        {{ (claude_vpn_hub.instance | default({})).addresses | default([], true)
           | select('match', '[0-9]+[.][0-9]+[.][0-9]+[.][0-9]+/') | first | default('') }}
      public_key: "{{ (claude_vpn_hub.instance | default({})).public_key | default('') }}"
      endpoint: "{{ wireguard_hub_endpoint }}"
      peers: "{{ claude_vpn_hub.peers | default([]) }}"
  when: claude_vpn_members | length > 0

# Each VPN's plan by its key, for a later play: the VMs' own reads it there.
- name: vpn_members | Keep the plan by its VPN
  ansible.builtin.set_fact:
    claude_vpn_plans: "{{ claude_vpn_plans | default({}) | combine({claude_vpn_planned: claude_vpn_plan}) }}"

- name: vpn_members | Refuse what the plan refuses
  ansible.builtin.assert:
    that: claude_vpn_plan.refusals | default([]) | length == 0
    fail_msg: "{{ claude_vpn_plan.refusals | default([]) | join(' ') }}"
    quiet: true
