---
# Says which tagged VMs a fleet-wide run leaves out because they are named
# after a host of the inventory (claude_vm_inventory_hosts, group_vars/all),
# which add_host would merge them into. Discovery and the alias refresh both
# leave such a VM out (vms_not_named); this is the one place that says so.
# Reads claude_vm_requested, after the cluster listing.

- name: vms_misnamed | Say which tagged VMs are left out for their name
  vars:
    claude_vm_misnamed: >-
      {{ claude_vm_requested | selectattr('name', 'defined') | selectattr('name', 'in', claude_vm_inventory_hosts)
         | map(attribute='name') | list }}
  ansible.builtin.debug:
    msg: >-
      Left out: {{ claude_vm_misnamed | join(', ') }}, tagged {{ claude_vm_tag }} but named like a host of the
      inventory, which a VM must never become. Rename {{ 'it' if claude_vm_misnamed | length == 1 else 'them' }}
      in Proxmox, or ask whoever made {{ 'it' if claude_vm_misnamed | length == 1 else 'them' }}.
  when: claude_vm_misnamed | length > 0
