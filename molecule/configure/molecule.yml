---
# Integration scenario: runs playbooks/configure.yml end to end against a
# container that stands in for the freshly provisioned VM.
dependency:
  name: galaxy
  options:
    requirements-file: ../../requirements.yml
platforms:
  - name: claude-dev
    groups: [claude_vms]
    image: "${MOLECULE_IMAGE:-geerlingguy/docker-ubuntu2404-ansible@sha256:29e6f9d736c3401815d98f626a41c55a54a4ef1edb9d1d1223018746d3acba14}"
    pre_build_image: true
    command: ""
    privileged: true
    cgroupns_mode: host
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
provisioner:
  name: ansible
  env:
    ANSIBLE_ROLES_PATH: ${MOLECULE_PROJECT_DIRECTORY}/roles
    ANSIBLE_FILTER_PLUGINS: ${MOLECULE_PROJECT_DIRECTORY}/filter_plugins
    # just code's session modules, for the handoff check in side_effect.yml.
    ANSIBLE_LIBRARY: ${MOLECULE_PROJECT_DIRECTORY}/playbooks/library
  playbooks:
    converge: converge.yml
    side_effect: side_effect.yml
  inventory:
    # group_vars/all/defaults.yml here is a symlink to the project's committed
    # inventory/group_vars/all/defaults.yml, so the real variable wiring is
    # exercised while the git-ignored local.yml / vault.yml stay out. Test
    # overrides live in host_vars/claude-dev.yml (Molecule ignores inline vars
    # once links are used). The symlink must survive checkout (git, not zip).
    links:
      group_vars: group_vars
      host_vars: host_vars
