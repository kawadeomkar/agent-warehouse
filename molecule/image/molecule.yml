---
# A golden template's image, then the real configure over it: a VM cloned from a
# golden ends as configure alone would make it, with nothing left to install
# (docs/architecture/testing.md §11.3). No idempotence stage: the scrub changes
# things on every run, and configure's own is the configure scenario's.
platforms:
  - name: claude-dev
    groups: [claude_vms]
    image: "${MOLECULE_IMAGE:-geerlingguy/docker-ubuntu2404-ansible@sha256:29e6f9d736c3401815d98f626a41c55a54a4ef1edb9d1d1223018746d3acba14}"
    pre_build_image: true
    command: ""
    privileged: true
    cgroupns_mode: host
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
provisioner:
  # Every playbook here waits 2 s, not the claude_code role's 20, for the Remote Control server it started to fail:
  # the stand-in claude's server never does (tests/molecule/fake_claude.sh). An extra var, since the wait is an
  # internal in the role's vars/main.yml, which outranks every inventory variable.
  options:
    extra-vars: '{"claude_code_remote_control_stay_up_seconds": 2, "claude_vm_golden_container": true}'
  env:
    ANSIBLE_ROLES_PATH: ${MOLECULE_PROJECT_DIRECTORY}/roles
    ANSIBLE_FILTER_PLUGINS: ${MOLECULE_PROJECT_DIRECTORY}/filter_plugins
    # just code's session modules, and what they share, for the handoff check
    # in side_effect.yml.
    ANSIBLE_LIBRARY: ${MOLECULE_PROJECT_DIRECTORY}/playbooks/library
    ANSIBLE_MODULE_UTILS: ${MOLECULE_PROJECT_DIRECTORY}/playbooks/module_utils
  inventory:
    # group_vars/all/defaults.yml here is a symlink to the project's committed
    # inventory/group_vars/all/defaults.yml, so the real variable wiring is
    # exercised while the git-ignored local.yml / vault.yml stay out. Test
    # overrides live in host_vars/claude-dev.yml (Molecule ignores inline vars
    # once links are used). The symlink must survive checkout (git, not zip).
    links:
      group_vars: group_vars
      host_vars: host_vars
scenario:
  test_sequence:
    - dependency
    - cleanup
    - destroy
    - syntax
    - create
    - prepare
    - converge
    - side_effect
    - verify
    - cleanup
    - destroy
