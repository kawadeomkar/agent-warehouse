---
# Internal, not meant to be overridden: the config of the VM this run is
# acting on. For a VM that already exists it is the one the name lookup in
# main.yml fetched (config: current), so nothing reads it a second time. For
# a VM this run has just cloned there is no lookup to read, so present.yml
# reads it by VMID, with retries, into proxmox_vm_config - and only then.
# Keyed off proxmox_vm_exists rather than off whether proxmox_vm_config holds
# anything: the role can run more than once in a play, and a register a run
# never reaches keeps the previous run's answer for another VM.
proxmox_vm_found_config: >-
  {{ ((proxmox_vm_lookup.proxmox_vms if proxmox_vm_exists | bool else proxmox_vm_config.proxmox_vms)
      | default([], true) | first | default({}, true)).get('config', {}) }}

# Internal: the MAC of the VM's own NIC, or "" when it cannot be read - an
# empty config, or a template whose NIC is not proxmox_vm_nic. The callers
# assert on it rather than letting net_mac raise mid-play.
#
# Computed here rather than copied into a fact so it cannot go stale. The
# role can run more than once for the same host in one play - the role
# scenario's side_effect.yml includes it back to back - and a set_fact
# survives a run that skips it, so a fact would hand VM #1's MAC to VM #2. A
# lazy var is re-evaluated against whatever the registers hold right now, and
# a skipped register is overwritten rather than kept.
proxmox_vm_found_mac: >-
  {{ proxmox_vm_found_config.get(proxmox_vm_nic, '') | net_mac('') }}

# Internal: the node that holds the VM the name lookup found, which is where
# every call about an existing VM has to go - a VM migrated since it was
# created is no longer on proxmox_vm_node, and proxmox_kvm's update sends a
# settings call to the node it is given rather than looking the VM up. A VM
# that does not exist yet is about to be cloned on proxmox_vm_node, so that
# is the default; the clone itself always goes there.
proxmox_vm_found_node: >-
  {{ proxmox_vm_lookup.proxmox_vms[0].node | default(proxmox_vm_node, true) }}

# Internal: the address the guest agent reports for the VM's own NIC, or ""
# while the agent has not answered yet. Jinja is lazy, so this is only
# evaluated once proxmox_vm_net has been registered.
proxmox_vm_reported_address: >-
  {{ proxmox_vm_net.proxmox_vms
     | default([], true) | map(attribute='network') | first | default([], true)
     | guest_ipv4(proxmox_vm_found_mac)
     | default('', true) }}

# Internal: the tags of the VM the name lookup found, as a list, split on ";"
# or "," as proxmox_tags splits every VM's. Matching whole elements, not a
# substring, is what keeps "agent-warehouse" from matching
# "agent-warehouse-staging". Lowercased, because Proxmox stores tags
# lowercased by default: a tag configured as "Agent-Warehouse" comes back as
# "agent-warehouse", and main.yml lowercases its side of the comparison to
# match. Each tag 1.x gave the VM (proxmox_vm_tags_1x) is read under its name
# from 2.0, so that a VM 1.x made is owned, finished and keeps its marks as
# before; present.yml writes them so (proxmox_vm_tags_moving).
proxmox_vm_found_tags: "{{ proxmox_vm_tags_now | map('lower') | list }}"

# Internal: the VM's tags as Proxmox gave them, which a refusal names.
proxmox_vm_tags_given: "{{ proxmox_vm_lookup.proxmox_vms[0].tags | default('', true) | proxmox_tags }}"

# Internal: those tags, each the project gave the VM through 1.x under its name
# from 2.0, in its place, every other as given: what present.yml writes.
proxmox_vm_tags_now: "{{ proxmox_vm_tags_given | proxmox_tags_moved(proxmox_vm_sent_tags[0], proxmox_vm_tags_1x) }}"

# Internal: whether the VM carries a tag under its 1.x name, which present.yml
# writes anew once.
proxmox_vm_tags_moving: "{{ proxmox_vm_tags_now != proxmox_vm_tags_given }}"

# Internal: the tags this role writes - proxmox_vm_tags, lowercased the way
# Proxmox stores them, so that what is sent is what the lookup finds again
# even on a datacenter whose tag style keeps case.
proxmox_vm_sent_tags: "{{ proxmox_vm_tags | map('lower') | list }}"

# Internal: the tag a VM carries from the settings call until the start that
# follows it has succeeded. See proxmox_vm_needs_configuration.
proxmox_vm_unfinished_tag: "{{ proxmox_vm_sent_tags[0] }}-unfinished"

# Internal: the mark configure.yml writes (tasks/vm_marks.yml), kept by every
# call below that replaces the tag list: the tag it writes once the VM has held
# a Tailscale login of the tailscale role's (claude_vm_tailscale_tag). A VM
# repaired, or force-updated, would otherwise lose it and be handed the vault's
# Tailscale key again.
proxmox_vm_tailscale_tag: "{{ proxmox_vm_sent_tags[0] }}-tailscale"
proxmox_vm_kept_tags: >-
  {{ ([proxmox_vm_tailscale_tag] if proxmox_vm_tailscale_tag in proxmox_vm_found_tags else [])
     + ([proxmox_vm_sized_tag] if proxmox_vm_sized_found | bool else []) }}

# Internal: a VM whose size is its own, chosen when it was created (just deploy
# alpha --cores 8 --memory 16G): the tag says so where the VM cannot change it,
# and the fleet's size settings are then not this VM's - just status calls no
# difference from them drift, and a repair (proxmox_vm_force_update) keeps the
# size it has. Sized by this run, or found sized; a VM this run sizes is tagged
# only once it is finished, so a run that stops before has sized nothing, and
# the next finishes the VM with the size it gives, or the settings'.
proxmox_vm_sized_tag: "{{ proxmox_vm_sent_tags[0] }}-sized"
# Internal: what the settings call and the resize send: this run's size (proxmox_vm_size) where it gives one, else
# the settings'. The minimum memory follows the settings': below their memory - ballooning - it stays, under the
# size's memory; equal to it - a fixed allocation - it is the size's memory too.
proxmox_vm_cores_sent: "{{ proxmox_vm_size.cores | default(proxmox_vm_cores) }}"
proxmox_vm_memory_sent: "{{ proxmox_vm_size.memory_mb | default(proxmox_vm_memory_mb) }}"
proxmox_vm_memory_min_sent: >-
  {{ proxmox_vm_memory_min_mb if proxmox_vm_size.memory_mb is not defined
     else ([proxmox_vm_memory_min_mb | int, proxmox_vm_memory_sent | int] | min)
     if proxmox_vm_memory_min_mb | int < proxmox_vm_memory_mb | int
     else proxmox_vm_memory_sent }}
proxmox_vm_disk_size_sent: "{{ proxmox_vm_size.disk | default(proxmox_vm_disk_size) }}"
proxmox_vm_size_given: "{{ proxmox_vm_size | length > 0 }}"
proxmox_vm_sized_found: "{{ (proxmox_vm_exists | bool) and (proxmox_vm_sized_tag in proxmox_vm_found_tags) }}"
proxmox_vm_sized: "{{ (proxmox_vm_size_given | bool) or (proxmox_vm_sized_found | bool) }}"
# Internal: the parts of its size a VM found sized keeps on a repair - each one this run does not give: the settings
# call sends none of them (cores, or memory and its minimum) and the disk is not resized, so a part given changes that
# part alone, never the rest to the settings'. And whether an existing VM has another size than this run gives
# (proxmox_vm_found_config, its config).
proxmox_vm_kept_size: >-
  {{ ['cores', 'memory_mb', 'disk'] | reject('in', proxmox_vm_size) | list if proxmox_vm_sized_found | bool else [] }}
proxmox_vm_size_differs: >-
  {{ (proxmox_vm_size.cores is defined and proxmox_vm_found_config.cores | default(0) | int != proxmox_vm_size.cores | int)
     or (proxmox_vm_size.memory_mb is defined
         and proxmox_vm_found_config.memory | default(0) | int != proxmox_vm_size.memory_mb | int)
     or (proxmox_vm_size.disk is defined
         and (proxmox_vm_found_config.scsi0 | default('') | proxmox_disk_bytes) < (proxmox_vm_size.disk | proxmox_disk_bytes)) }}

# Internal: the VM's own list of repositories (just deploy --repos), one line of
# its notes in Proxmox: the notes found - a new VM's are those its clone carries,
# which present.yml reads - what is on the line, and the notes this run sends.
proxmox_vm_found_notes: >-
  {{ ((proxmox_vm_lookup.proxmox_vms if proxmox_vm_exists | bool else proxmox_vm_clone_read.proxmox_vms)
      | default([], true) | first | default({}, true)).get('config', {}).description | default('', true) }}
proxmox_vm_found_repos: "{{ proxmox_vm_found_notes | proxmox_notes_repos }}"
proxmox_vm_notes_sent: "{{ proxmox_vm_found_notes | proxmox_notes_with_repos(proxmox_vm_repos) }}"

# Internal: whether the VM still needs its settings applied, its disk resized
# and a start. Existence alone is not convergence - if a run died between the
# clone and the settings call, the VM exists but has no cloud-init user, no SSH
# keys and no agent, and keying off existence would skip the repair forever and
# then wait out the whole agent poll budget for an agent that was never enabled.
#
# Two markers, because the settings call is not the last step. The cloud-init
# user says the settings call never ran: only that call writes it, and the
# template has none. proxmox_vm_unfinished_tag says it ran but the resize or
# the start after it did not - a disk size Proxmox refused, a start the host
# had no memory for, Ctrl-C. Nothing else in the lookup tells that VM apart
# from a finished one someone shut down, and it must not be left stopped.
# The settings call adds the tag and present.yml removes it only once the start
# has succeeded, so a VM without it is one this project finished (or one made
# before the tag existed) and a stopped one stays stopped.
#
# Neither marker is the ownership tag. present.yml tags a VM the moment it is
# cloned, so that a half-built VM is still recognisably this project's - and
# main.yml refuses to touch an existing VM without the tag, so "untagged" can
# no longer mean "ours, but unfinished".
proxmox_vm_needs_configuration: >-
  {{ (not proxmox_vm_exists)
     or (proxmox_vm_force_update | bool)
     or ((proxmox_vm_lookup.proxmox_vms[0].config | default({}, true)).ciuser
         | default('', true) | length == 0)
     or (proxmox_vm_unfinished_tag in proxmox_vm_found_tags) }}

# Internal: the address whose host key should be forgotten when the VM is
# deleted, as the guest agent reports it while the VM still exists. A VM that is
# stopped, hung or agent-less reports nothing, and destroy.yml runs no discovery
# that could supply an address instead - so such a VM gets the "could not
# determine its address" warning, and its stale key is left for ssh-keygen -R.
# There are no cached facts to evict: the project gathers facts afresh on every
# configure run (ansible.cfg says why there is no fact cache).
proxmox_vm_forget_address: >-
  {{ proxmox_vm_reported_address }}

# Internal: every name this machine may hold the VM's host key under - the
# address, and <name>.<domain> when the SSH aliases and just code connect by
# name (proxmox_vm_known_hosts_domain). A VM created again under the same name
# would otherwise fail its first connection by name on the old key. Never the
# Proxmox host's address, nor another kept one (proxmox_vm_known_hosts_kept),
# under either: the address is the VM's own report, and one that reported the
# host's just before its deletion would have this machine forget the host's
# key, and take whatever answers there next; and a VM named pve, where the
# Proxmox host is reached as pve.lan, would do the same by its name.
proxmox_vm_forget_names: >-
  {{ (([proxmox_vm_forget_address] if proxmox_vm_forget_address | length > 0 else [])
      + ([proxmox_vm_name ~ '.' ~ proxmox_vm_known_hosts_domain]
         if proxmox_vm_known_hosts_domain | length > 0 else []))
     | reject('in', [proxmox_vm_api_host] + proxmox_vm_known_hosts_kept) | list }}
