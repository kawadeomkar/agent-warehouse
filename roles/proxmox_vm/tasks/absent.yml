---
# Included only for a VM that exists (main.yml), so no task here asks again.
# API connection parameters come from module_defaults in main.yml.
- name: absent | Stop the VM
  community.proxmox.proxmox_kvm: # noqa: args[module] - api_* come from module_defaults
    node: "{{ proxmox_vm_node }}"
    vmid: "{{ proxmox_vm_resolved_id }}"
    state: stopped
    force: true
    timeout: "{{ proxmox_vm_timeout }}"

- name: absent | Delete the VM and its disks
  community.proxmox.proxmox_kvm: # noqa: args[module] - api_* come from module_defaults
    node: "{{ proxmox_vm_node }}"
    vmid: "{{ proxmox_vm_resolved_id }}"
    state: absent
    # force also covers a VM that was (re)started between the two tasks;
    # without it the module reports ok and leaves the VM in place.
    force: true
    # A disk that still carries this VMID but that the configuration no
    # longer lists goes with the VM: these are throwaway VMs, deleted often,
    # and a disk left behind would sit on the storage until someone noticed.
    # The VMID is this VM's, by the tag check above, so the disks are too.
    destroy_unreferenced_disks: true
    timeout: "{{ proxmox_vm_timeout }}"

# No SSH host key is forgotten. The VM's is filed under its identity, its SMBIOS
# UUID, which no VM made after it has: a key there can only ever match that VM
# again - its backup, restored with its keys - and any other VM given the same
# UUID, which anyone who may change a VM's hardware on a shared host can do, is
# refused as a changed key. Forgotten, it would let such a VM in on first use,
# and forget the key of another VM restored with the same UUID. Never by an
# address either, which the VM reports: the role touches no file of host keys.
