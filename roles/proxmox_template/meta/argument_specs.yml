---
argument_specs:
  main:
    short_description: Build a cloud-init enabled VM template on a Proxmox VE host
    description:
      - Runs on the PVE node over SSH. Downloads a cloud image, creates a VM with
        `qm`, imports the image as its root disk, adds a cloud-init drive and
        converts the VM to a template, recording in its notes what went into the
        disk. Skipped if the VMID already holds the finished template and it is
        what these settings would build; rebuilt at the same VMID when it differs
        (proxmox_template_rebuild); refused if the VMID holds anything else, on
        this node or another.
    options:
      proxmox_template_vmid:
        type: int
        description: VMID the template is built under. Anything but the finished template there, on this node or another, fails the run.
      proxmox_template_name:
        type: str
        description: Template name. VMs are cloned from it by name, and a finished template at the VMID is recognised by it.
      proxmox_template_image_url:
        type: str
        description: Cloud image downloaded and imported as the template's root disk.
      proxmox_template_image_checksum:
        type: str
        description: get_url checksum spec. Set to an empty string to skip verification.
      proxmox_template_image_dir:
        type: path
        default: /var/lib/vz/agent-warehouse
        description:
          - Directory on the node that keeps the pristine download. Created if missing.
          - Keep it outside the content directories of a storage, or Proxmox lists the
            image in the UI (under template/iso it appeared as an ISO).
      proxmox_template_storage:
        type: str
        description: Proxmox storage the root disk and the cloud-init drive are created on.
      proxmox_template_bridge:
        type: str
        description: Bridge the template's net0 is attached to, and so every clone's.
      proxmox_template_cores:
        type: int
        description: CPU cores of the template itself. proxmox_vm sets each VM's own.
      proxmox_template_memory_mb:
        type: int
        description: Memory of the template itself, in MB. proxmox_vm sets each VM's own.
      proxmox_template_cpu_type:
        type: str
        description: CPU type (qm --cpu), which every VM cloned from the template keeps.
      proxmox_template_ostype:
        type: str
        description: Guest OS type (qm --ostype). l26 is Linux 2.6 or later.
      proxmox_template_qm:
        type: path
        description: Path of qm on the node. Tests point it at a stand-in.
      proxmox_template_install_guest_agent:
        description:
          - Bake qemu-guest-agent into the image with virt-customize.
          - Required for Proxmox to report a DHCP-assigned address.
        type: bool
      proxmox_template_customize_packages:
        description: Packages installed into the image by virt-customize.
        type: list
        elements: str
      proxmox_template_manage_libguestfs:
        description: Install libguestfs-tools on the node. Disable where it is already present or faked.
        type: bool
      proxmox_template_virt_customize:
        type: path
        description: Path of virt-customize on the node. Tests point it at a stand-in.
      proxmox_template_virt_cat:
        type: str
        description: Path of virt-cat on the Proxmox host, which reads a downloaded image's os-release before it is built.
      proxmox_template_rebuild:
        type: bool
        description:
          - Rebuild the template at the same VMID when it differs from what these settings would build - its CPU
            type, OS type, bridge, storage, image, packages or this version's build. VMs are full clones, which do
            not depend on it. One that keeps no record of this project's build is refused, never rebuilt, as it may be
            someone's own.
          - Off, it is kept as it is and the differences are said, for a template a linked clone still uses, which
            Proxmox will not remove, or one changed by hand on purpose.

  # tasks_from: drift, which deploy.yml runs to decide through the API whether to build the template.
  drift:
    short_description: Say how the template differs from what this role would build, changing nothing
    description:
      - Compares the template's config, as the caller read it from Proxmox, with what this role would build - the qm
        settings every clone inherits and, from the record in its notes, the image, packages and build version - and
        records the differences in proxmox_template_drift, empty when there are none. Proxmox is asked nothing, and
        nothing is changed.
    options:
      proxmox_template_drift_config:
        type: dict
        required: true
        description:
          - The template's config, as /nodes/<node>/qemu/<vmid>/config gives it.
  golden_read:
    short_description: Read the listing and the configs golden_select chooses from, once for the run - reading only
    options: &golden_api
      proxmox_template_golden:
        type: bool
        description: >-
          Clone new VMs from a golden template of their key, with the toolchain installed already, so that configure,
          which still runs every task, finds most of its work done; where none is fresh, they clone the base and the
          deploy ends by building one. false clones the base template, as before.
      proxmox_template_golden_disk_size:
        type: str
        description: The least a golden's disk is built at; a larger base keeps its own. A VM with a smaller disk than the golden's clones the base template.
      proxmox_template_golden_cores:
        type: int
        description: The cores of the VM a golden is built on.
      proxmox_template_golden_memory_mb:
        type: int
        description: The memory, in MiB, of the VM a golden is built on.
      proxmox_template_known_hosts_dir:
        type: path
        description: Where a build VM's host key is kept while it is built, under the checkout's .cache; never ~/.ssh.
  golden_collect:
    short_description: Delete build VMs left over and golden templates past twice the age a run selects one at
    options:
      <<: *golden_api
      proxmox_template_golden_target:
        type: dict
        description: What this run would build, {key, base, disk, vms} (golden_targets); empty when nothing.
  golden_select:
    short_description: Choose a new VM's template - a fresh golden of its key, else the base - reading only, on this machine
    options:
      <<: *golden_api
      proxmox_template_golden_vm:
        type: str
        required: true
        description: The VM the template is chosen for. One that exists is never cloned, so it gets none.
      proxmox_template_golden_vm_disk:
        type: str
        required: true
        description: The VM's disk size. A golden built with a larger disk is no golden of it.
      proxmox_template_golden_digest:
        type: str
        required: true
        description: The toolchain digest every VM's options share, from the roles a golden carries (toolchain_digest).
      proxmox_template_golden_shared:
        type: bool
        required: true
        description: >-
          Whether the VM's image options are those a build sees. A VM that sets one of its own, as a host var, clones
          the base, since a golden built for it could not be shared.
  golden_build:
    short_description: Build the VM a golden template is made from - a full clone of the base, never ownership-tagged
    options:
      <<: *golden_api
      proxmox_template_golden_target:
        type: dict
        required: true
        description: The key to build for, the base it is built from and the size of its disk, {key, base, disk, vms} (golden_targets).
  golden_template:
    short_description: Make the build VM a golden template - stripped, noted with its key, read back, converted
    options:
      <<: *golden_api
      proxmox_template_build_vm:
        type: dict
        required: true
        description: The build VM, as golden_build recorded it.
  golden_discard:
    short_description: Delete the build VM a failed build left, under its own interlock, and its host key file
    options:
      <<: *golden_api
      proxmox_template_build_vm:
        type: dict
        description: The build VM, as golden_build recorded it, or as much of it as was made.
