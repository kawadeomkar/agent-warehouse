---
# `qm config` reads this node's configs only, so a VMID held by a sibling node
# looks free to the probe. The role used to run the whole build on that answer
# and fail at `qm create`, after the download and virt-customize. Prove the
# cluster-wide check refuses it first: the fake .vmlist lists 8000 on pve2.
- name: Refuse a VMID another node holds
  hosts: all
  become: true
  tasks:
    - name: Try to build the template as VMID 8000
      ansible.builtin.include_tasks: "{{ playbook_dir }}/../../../../tests/molecule/refused.yml"
      vars:
        refused_role: proxmox_template
        proxmox_template_vmid: 8000
        refused_because: [VMID 8000 exists on node pve2, proxmox_template_vmid]
        refused_unless: >-
          proxmox_template built VMID 8000, which .vmlist says node pve2
          holds. The cluster-wide VMID check is not working.

    - name: Assert nothing was built for 8000
      ansible.builtin.stat:
        path: /var/lib/fake-qm/8000.conf
      register: proxmox_template_sibling
      failed_when: proxmox_template_sibling.stat.exists

# The probe sees this node's VMIDs. One that exists but is not the finished
# template - a build that died before `qm template`, or an unrelated VM - must
# be refused, not skipped as "already built" and not built over. Both cases
# fail the same assert, so each is checked for its own cause: 9002 has no
# `template: 1`, 9003 is a finished template of another name.
- name: Refuse a VMID that holds a half-built VM
  hosts: all
  become: true
  tasks:
    - name: Create VMID 9002 as a plain VM, never converted to a template
      ansible.builtin.command:
        argv: [/usr/local/bin/qm, create, "9002", --name, other]
      args:
        creates: /var/lib/fake-qm/9002.conf

    - name: Try to build the template as VMID 9002
      ansible.builtin.include_tasks: "{{ playbook_dir }}/../../../../tests/molecule/refused.yml"
      vars:
        refused_role: proxmox_template
        proxmox_template_vmid: 9002
        refused_because: ['VMID 9002 exists but is not the finished template "ubuntu-24.04-cloudinit"', qm destroy 9002]
        refused_unless: >-
          proxmox_template accepted VMID 9002, which holds a VM that was
          never converted to a template. The reuse check is not working.

    - name: Assert 9002 was left as it was
      ansible.builtin.slurp:
        src: /var/lib/fake-qm/9002.conf
      register: proxmox_template_half_built
      failed_when: >-
        (proxmox_template_half_built.content | b64decode).splitlines() != ['name: other']

- name: Refuse a VMID that holds a finished template of another name
  hosts: all
  become: true
  tasks:
    - name: Create VMID 9003 as a finished template named other-template
      ansible.builtin.shell:
        cmd: /usr/local/bin/qm create 9003 --name other-template && /usr/local/bin/qm template 9003
        creates: /var/lib/fake-qm/9003.conf

    - name: Try to build the template as VMID 9003
      ansible.builtin.include_tasks: "{{ playbook_dir }}/../../../../tests/molecule/refused.yml"
      vars:
        refused_role: proxmox_template
        proxmox_template_vmid: 9003
        refused_because: ['VMID 9003 exists but is not the finished template "ubuntu-24.04-cloudinit"', qm destroy 9003]
        refused_unless: >-
          proxmox_template accepted VMID 9003, a template named
          other-template, as its own. The name check is not working.

    - name: Assert 9003 was left as it was
      ansible.builtin.slurp:
        src: /var/lib/fake-qm/9003.conf
      register: proxmox_template_other_template
      failed_when: >-
        (proxmox_template_other_template.content | b64decode).splitlines()
        != ['name: other-template', 'template: 1']

# A template with no record of this project's build may be its owner's: it is
# refused and left, never rebuilt, which would destroy it.
- name: Refuse to rebuild a template that keeps no record of its build
  hosts: all
  become: true
  tasks:
    - name: Keep 9000's notes for after
      ansible.builtin.slurp:
        src: /var/lib/fake-qm/9000.conf
      register: proxmox_template_recorded_conf

    - name: Take the record out of 9000's notes
      ansible.builtin.lineinfile:
        path: /var/lib/fake-qm/9000.conf
        regexp: "^description: "
        state: absent

    - name: Run the role where it must refuse
      ansible.builtin.include_tasks: "{{ playbook_dir }}/../../../../tests/molecule/refused.yml"
      vars:
        refused_role: proxmox_template
        refused_because: [no record of being built by this project, qm destroy 9000, proxmox_template_rebuild to false]
        refused_unless: proxmox_template rebuilt a template with no record, which may be someone's own.

    - name: Assert 9000 is as it was
      ansible.builtin.command:
        argv: [grep, -c, "^template: 1", /var/lib/fake-qm/9000.conf]
      changed_when: false

    - name: Put 9000's notes back
      ansible.builtin.copy:
        content: "{{ proxmox_template_recorded_conf.content | b64decode }}"
        dest: /var/lib/fake-qm/9000.conf
        mode: "0644"

- name: Refuse a custom image without its checksum, and one of another family
  hosts: all
  become: true
  tasks:
    - name: Run the role with a custom image and no checksum
      ansible.builtin.include_tasks: "{{ playbook_dir }}/../../../../tests/molecule/refused.yml"
      vars:
        refused_role: proxmox_template
        proxmox_template_image_checksum: sha256:https://cloud-images.ubuntu.com/minimal/releases/noble/release/SHA256SUMS
        refused_because: [with no proxmox_template_image_checksum]
        refused_unless: proxmox_template took a custom image with no checksum.

    - name: Say the image holds Fedora
      ansible.builtin.copy:
        content: "ID=fedora\nID_LIKE=\"rhel\"\n"
        dest: /var/lib/fake-virt-cat-os-release
        mode: "0644"

    - name: Try to rebuild from it, on another bridge
      block:
        - name: Run the role where it must refuse
          ansible.builtin.include_tasks: "{{ playbook_dir }}/../../../../tests/molecule/refused.yml"
          vars:
            refused_role: proxmox_template
            proxmox_template_bridge: vmbr2
            refused_because: [no Ubuntu or Debian image, ID=fedora]
            refused_unless: proxmox_template built a template from a Fedora image.
      always:
        - name: Say the image holds Ubuntu again
          ansible.builtin.file:
            path: /var/lib/fake-virt-cat-os-release
            state: absent

# Proxmox keeps a template a linked clone still uses. A rebuild it refuses fails with the setting that keeps the
# template as it is, and leaves it, and no customised image, behind.
- name: Refuse to rebuild a template a linked clone still uses
  hosts: all
  become: true
  tasks:
    - name: Mark 9000 as a linked clone's template
      ansible.builtin.file:
        path: /var/lib/fake-qm/9000.linked
        state: touch
        mode: "0644"

    - name: Try to rebuild it on another bridge
      block:
        - name: Run the role with a bridge 9000 does not have
          ansible.builtin.include_tasks: "{{ playbook_dir }}/../../../../tests/molecule/refused.yml"
          vars:
            refused_role: proxmox_template
            proxmox_template_bridge: vmbr2
            refused_because: [would not remove it to rebuild it, still in use by linked clone, proxmox_template_rebuild to false]
            refused_unless: proxmox_template rebuilt 9000, which Proxmox would not remove.
      always:
        - name: Unmark 9000
          ansible.builtin.file:
            path: /var/lib/fake-qm/9000.linked
            state: absent

    - name: Stat the customised copy the refused rebuild made
      ansible.builtin.stat:
        path: /var/lib/vz/agent-warehouse/agent-warehouse-9000.img
      register: proxmox_template_refused_copy
      failed_when: proxmox_template_refused_copy.stat.exists

# Off, a template that differs is kept as it is, and said.
- name: Keep a template that differs when rebuilding is off
  hosts: all
  become: true
  tasks:
    - name: Run the role on another bridge with rebuilding off
      ansible.builtin.include_role:
        name: proxmox_template
      vars:
        proxmox_template_bridge: vmbr2
        proxmox_template_rebuild: false

    - name: Read 9000, kept
      ansible.builtin.slurp:
        src: /var/lib/fake-qm/9000.conf
      register: proxmox_template_kept_conf
      failed_when: >-
        (proxmox_template_kept_conf.content | b64decode) is not search('(?m)^net0: virtio,bridge=vmbr1$')
