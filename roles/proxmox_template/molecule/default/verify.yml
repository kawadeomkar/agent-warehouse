---
- name: Verify
  hosts: all
  become: true
  tasks:
    - name: Read fake VM config and call log
      ansible.builtin.slurp:
        src: "{{ item }}"
      loop:
        - /var/lib/fake-qm/9000.conf
        - /var/lib/fake-qm/calls.log
      register: proxmox_template_verify_state

    - name: Stat the downloaded image and the customised copy
      ansible.builtin.stat:
        path: "{{ item }}"
      loop:
        - /var/lib/vz/agent-warehouse/noble-server-cloudimg-amd64.img
        - /var/lib/vz/agent-warehouse/agent-warehouse-9000.img
      register: proxmox_template_verify_images

    - name: Stat the image directory
      ansible.builtin.stat:
        path: /var/lib/vz/agent-warehouse
      register: proxmox_template_verify_image_dir

    # Moved by the first build from its 1.x name, with what was in it.
    - name: Stat the image directory by its 1.x name, and what 1.x left in it
      ansible.builtin.stat:
        path: "{{ item }}"
      loop:
        - /var/lib/vz/claude-on-proxmox
        - /var/lib/vz/agent-warehouse/kept-by-1x
      register: proxmox_template_verify_moved

    - name: Assert the image directory moved from its 1.x name
      ansible.builtin.assert:
        that:
          - not proxmox_template_verify_moved.results[0].stat.exists
          - proxmox_template_verify_moved.results[1].stat.exists
        quiet: true

    - name: Assert template was built exactly once with the expected settings
      vars:
        proxmox_template_verify_conf: "{{ proxmox_template_verify_state.results[0].content | b64decode }}"
        proxmox_template_verify_calls: "{{ proxmox_template_verify_state.results[1].content | b64decode | trim | split('\n') }}"
      ansible.builtin.assert:
        that:
          # the pristine download stays, in a directory that is not storage
          # content, and the customised copy is gone once the template is built
          - proxmox_template_verify_images.results[0].stat.exists
          - not proxmox_template_verify_images.results[1].stat.exists
          - proxmox_template_verify_image_dir.stat.isdir
          - proxmox_template_verify_image_dir.stat.mode == '0755'
          - "'ubuntu-24.04-cloudinit' in proxmox_template_verify_conf"
          - "'virtio,bridge=vmbr1' in proxmox_template_verify_conf"
          - "'local-zfs:0,import-from=/var/lib/vz/agent-warehouse/agent-warehouse-9000.img,discard=on' in proxmox_template_verify_conf"
          - "'local-zfs:cloudinit' in proxmox_template_verify_conf"
          - "'order=scsi0' in proxmox_template_verify_conf"
          - "'template: 1' in proxmox_template_verify_conf"
          # the record of the build, in its notes, which a template is compared on with its settings - kept
          # encoded, as Proxmox keeps a description and qm config prints it: a colon as %3A
          - >-
            proxmox_template_verify_conf is search('(?m)^description: Built by agent-warehouse%3A build=1;'
            ~ ' image=http%3A//127.0.0.1%3A8080/noble-server-cloudimg-amd64.img; packages=qemu-guest-agent;'
            ~ ' sha256=[0-9a-f]{64}$')
          # converge's one build: side_effect's template with no record is refused, and idempotence found it as its
          # settings would build it, and built nothing
          - proxmox_template_verify_calls | select('search', '^create 9000 ') | list | length == 1
          - proxmox_template_verify_calls | select('search', '^template 9000') | list | length == 1
          # only the linked clone's refused rebuild tried to remove it, and was refused
          - proxmox_template_verify_calls | select('search', '^destroy 9000') | list | length == 1
          - proxmox_template_verify_calls | select('search', '^destroy ') | list | length == 1
          # side_effect: the sibling node's VMID was probed, never created
          - proxmox_template_verify_calls | select('search', '^config 8000') | list | length == 1
          # side_effect: 9002 and 9003 were created by the scenario itself, once
          # each, and the role touched neither - beside 9000's one build, no
          # create, set or template reached any VMID
          - proxmox_template_verify_calls | select('search', '^create ') | list | length == 3
          - proxmox_template_verify_calls | select('search', '^create 9002 ') | list | length == 1
          - proxmox_template_verify_calls | select('search', '^create 9003 ') | list | length == 1
          - proxmox_template_verify_calls | select('search', '^set ') | list | length == 2
          - proxmox_template_verify_calls | select('search', '^template ') | list | length == 2
          - proxmox_template_verify_calls | select('search', '^template 9003') | list | length == 1
        quiet: true

    - name: Read the fake virt-customize log
      ansible.builtin.slurp:
        src: /var/lib/fake-virt-customize.log
      register: proxmox_template_verify_customize_raw

    - name: Assert the guest agent was baked into a copy of the image
      vars:
        proxmox_template_verify_customize: "{{ proxmox_template_verify_customize_raw.content | b64decode }}"
      ansible.builtin.assert:
        that:
          - "'--install qemu-guest-agent' in proxmox_template_verify_customize"
          # unique machine-ids, so clones do not collide on one DHCP lease
          - "'--truncate /etc/machine-id' in proxmox_template_verify_customize"
          # the pristine download is left alone so get_url stays idempotent
          - "'--add /var/lib/vz/agent-warehouse/agent-warehouse-9000.img' in proxmox_template_verify_customize"
          # converge, and the rebuild Proxmox refused, which customises before it removes the old template; the other
          # refusals in side_effect never got this far
          - proxmox_template_verify_customize.splitlines() | length == 2
        quiet: true
