---
# What a build makes, in one place: the qm settings every clone inherits, and the record of what went into the disk,
# which Proxmox cannot show and so is kept in the template's notes. tasks/main.yml builds from these and tasks/drift.yml
# compares a template with them (proxmox_template_drift in filter_plugins/proxmox.py), so a template that differs from
# them is rebuilt by the next run.

# The build steps' own version. Raise it whenever a change to them changes what a template is - a qm option, a
# virt-customize step, a package the role adds - and every template built before is rebuilt by the next just deploy.
proxmox_template_build: 1

# The default image and its checksum list, which is Ubuntu's own: any other URL needs a checksum given with it.
proxmox_template_image_url_default: https://cloud-images.ubuntu.com/minimal/releases/noble/release/ubuntu-24.04-minimal-cloudimg-amd64.img
proxmox_template_image_checksum_default: sha256:https://cloud-images.ubuntu.com/minimal/releases/noble/release/SHA256SUMS

# The image directory's default, and its name through 1.x, which the build
# moves it from, so the pristine download is not fetched again. A directory the
# user set has no other name.
proxmox_template_image_dir_default: /var/lib/vz/agent-warehouse
proxmox_template_image_dir_1x: /var/lib/vz/claude-on-proxmox

# The qm settings the role gives every template, which no setting changes.
proxmox_template_scsihw: virtio-scsi-pci
proxmox_template_serial0: socket
proxmox_template_vga: serial0

# The packages put into the disk: none without the guest agent, which is what puts them there.
proxmox_template_packages: >-
  {{ proxmox_template_customize_packages | join(',') if proxmox_template_install_guest_agent | bool else '' }}

# What a template built now is, field by field, as proxmox_template_drift compares it.
proxmox_template_wanted:
  cpu: "{{ proxmox_template_cpu_type }}"
  ostype: "{{ proxmox_template_ostype }}"
  bridge: "{{ proxmox_template_bridge }}"
  storage: "{{ proxmox_template_storage }}"
  scsihw: "{{ proxmox_template_scsihw }}"
  agent: "1"
  serial0: "{{ proxmox_template_serial0 }}"
  vga: "{{ proxmox_template_vga }}"
  build: "{{ proxmox_template_build }}"
  image: "{{ proxmox_template_image_url }}"
  packages: "{{ proxmox_template_packages }}"

# How the template at proxmox_template_vmid differs from that, read from `qm config` (tasks/main.yml's first task):
# nothing when there is no template there. Vars, not facts, so each run of the role reads its own register.
proxmox_template_differences: >-
  {{ (proxmox_template_existing.stdout | qm_config) | proxmox_template_drift(proxmox_template_wanted)
     if proxmox_template_existing.rc | default(1) == 0 else [] }}
# Whether that template is rebuilt: it differs, and proxmox_template_rebuild leaves rebuilding on.
proxmox_template_rebuilding: "{{ proxmox_template_differences | length > 0 and proxmox_template_rebuild | bool }}"

# A golden template's internals. Raise the build number whenever a change to how a golden is built changes what one is:
# every golden built before then belongs to no key, and is collected by age.
proxmox_template_golden_build: 1
# How old a golden may be and still be cloned, and how old before it is deleted:
# twice that, so none a run of any checkout has just chosen is deleted under it.
# Not settings: a checkout with a shorter one could delete another's choice.
proxmox_template_golden_max_age: 604800
proxmox_template_golden_collect_age: 1209600
# A build VM another run started less than this long ago is that run's: this
# run clones the base. An older one is left over, and deleted.
proxmox_template_build_fresh: 1800
# How long the build VM may take to report its address: tries, so many seconds apart.
proxmox_template_build_agent_retries: 60
proxmox_template_build_agent_delay: 5
# The boot disk a golden's size is read from and set on, and a template you built
# is held to.
proxmox_template_boot_disk: "{{ proxmox_vm_disk | default('scsi0') }}"
# The template a golden is built from: the user's, when they name one.
proxmox_template_golden_base_name: "{{ proxmox_template_custom | default('', true) or proxmox_template_name }}"
# The names and the tag a golden and a build VM carry. The build tag is never
# the ownership tag: no fleet command (discovery, configure, destroy, the
# aliases) can reach a build VM, by construction.
proxmox_template_golden_prefix: "{{ claude_vm_tag | lower }}-golden-"
proxmox_template_build_prefix: "{{ claude_vm_tag | lower }}-build-"
proxmox_template_build_tag: "{{ claude_vm_tag | lower }}-build"
# The settings a golden must not carry, which a clone would inherit: a golden
# with a cloud-init user would make every clone look configured.
proxmox_template_golden_stripped: [ciuser, cipassword, sshkeys, nameserver, searchdomain, tags]
# Now, UTC, as the golden and build records keep it.
proxmox_template_now: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
