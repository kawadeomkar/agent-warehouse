---
proxmox_template_vmid: 9000
proxmox_template_name: ubuntu-24.04-cloudinit

# Ubuntu Noble's minimal cloud image: 288 packages to the server image's 426,
# without multipathd, fwupd, ModemManager, udisks2, polkit or rsyslog - what a
# headless VM has no use for - and a 260 MB download to 620 MB. The roles
# install what a development VM needs on top (common_packages). Like Ubuntu's
# other minimal images it leaves out manual pages and documentation, which
# `sudo unminimize` puts back. The checksum URL points at Ubuntu's SHA256SUMS
# file; get_url looks up the image filename inside it.
proxmox_template_image_url: https://cloud-images.ubuntu.com/minimal/releases/noble/release/ubuntu-24.04-minimal-cloudimg-amd64.img
proxmox_template_image_checksum: sha256:https://cloud-images.ubuntu.com/minimal/releases/noble/release/SHA256SUMS
# Where the download is kept on the node. Not a content directory of the
# `local` storage (template/iso, say): Proxmox lists whatever it finds there in
# the UI, so the pristine image showed up as an ISO. The customised copy that
# is imported is derived from it and is removed once the template is finished.
proxmox_template_image_dir: /var/lib/vz/agent-warehouse

proxmox_template_storage: local-lvm
proxmox_template_bridge: vmbr0
proxmox_template_cores: 2
proxmox_template_memory_mb: 2048
proxmox_template_cpu_type: host
proxmox_template_ostype: l26

# Bake the QEMU guest agent into the image. Proxmox reads a VM's DHCP-assigned
# address by asking this agent, so without it a cloned VM has no discoverable
# address. Also truncates /etc/machine-id: clones sharing one machine-id send
# the same DHCP client identifier and can be handed the same lease.
proxmox_template_install_guest_agent: true
proxmox_template_customize_packages:
  - qemu-guest-agent
# Off in tests, where libguestfs is faked rather than installed.
proxmox_template_manage_libguestfs: true

# Rebuild the template when it differs from these settings or from this version's build, at the same VMID. One with no
# record of its build is refused, never rebuilt. Off, it is kept as it is and the differences said: for a template a
# linked clone still uses, which Proxmox will not remove, or one changed by hand on purpose.
proxmox_template_rebuild: true

# Paths on the PVE host (overridable for tests).
proxmox_template_qm: /usr/sbin/qm
proxmox_template_virt_customize: /usr/bin/virt-customize
proxmox_template_virt_cat: /usr/bin/virt-cat

# A template you built, by its name, to clone in place of the one this role
# builds (docs/guides/base-image.md). Only read and cloned, never changed.
proxmox_template_custom: ""

# A golden template: a clone of the base template with the toolchain baked in,
# which a new VM is cloned from when its key matches. Off until the first-boot
# upgrade has been measured on a golden days old.
proxmox_template_golden: false
# The least a golden's disk is built at: a base with a larger disk keeps its own,
# and a VM with a smaller disk than the golden's clones the base.
proxmox_template_golden_disk_size: 12G
# The VM a golden is built on.
proxmox_template_golden_cores: 2
proxmox_template_golden_memory_mb: 4096

# The golden entry points run on this machine, and read the inventory's own
# connection, node and VM settings, so how the API is reached has one definition.
# Where a build VM's host key is kept while it is built: never ~/.ssh/known_hosts.
proxmox_template_known_hosts_dir: "{{ playbook_dir }}/../.cache/golden"
