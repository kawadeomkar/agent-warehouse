---
- name: Install development packages
  ansible.builtin.apt:
    name: "{{ dev_tools_apt_packages }}"
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Install Node.js
  ansible.builtin.include_tasks: node.yml
  when: dev_tools_install_node

- name: Install Docker Engine
  ansible.builtin.include_tasks: docker.yml
  when: dev_tools_install_docker

# Off on a VM an earlier run gave Docker: the engine stays, but its group is
# root, so the user leaves it.
- name: Read the docker group
  ansible.builtin.getent:
    database: group
    key: docker
    fail_key: false
  when: not dev_tools_install_docker

- name: Take the user out of the docker group
  ansible.builtin.command:
    argv: [gpasswd, --delete, "{{ dev_tools_user }}", docker]
  changed_when: true
  when:
    - not dev_tools_install_docker
    - dev_tools_user in ((ansible_facts['getent_group'] | default({}))['docker'] | default(['', '', ''], true))[2].split(',')

- name: Install GitHub CLI
  ansible.builtin.include_tasks: gh.yml
  when: dev_tools_install_gh

- name: Install uv
  ansible.builtin.include_tasks: uv.yml
  when: dev_tools_install_uv

- name: Install Rust
  ansible.builtin.include_tasks: rust.yml
  when: dev_tools_install_rust
