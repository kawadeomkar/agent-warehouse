---
dev_tools_user: dev

# Feature toggles
dev_tools_install_node: true
dev_tools_install_docker: true
dev_tools_install_gh: true
dev_tools_install_uv: true
# Rust is optional, and off: the toolchain takes about 520 MB of the user's home.
dev_tools_install_rust: false

# Extra apt packages useful for development. python3-debian is required by the
# deb822_repository module used to add the Node.js, Docker and GitHub CLI repos.
dev_tools_apt_packages:
  - cmake
  - libffi-dev
  - libssl-dev
  - make
  - pipx
  - pkg-config
  - python3-debian
  - python3-dev
  - shellcheck
  - sqlite3

# Node.js (NodeSource)
dev_tools_node_major: 22
dev_tools_npm_global_packages: []

# Docker Engine (official repository). Starting the daemon is skipped inside
# containers, where it cannot run.
dev_tools_docker_packages:
  - docker-ce
  - docker-ce-cli
  - containerd.io
  - docker-buildx-plugin
  - docker-compose-plugin
dev_tools_container_virt_types: [docker, container, containerd, podman, lxc]
dev_tools_docker_manage_service: "{{ ansible_facts['virtualization_type'] not in dev_tools_container_virt_types }}"

# Debian architecture name used by the Docker and GitHub CLI repositories.
dev_tools_deb_arch: "{{ 'arm64' if ansible_facts['architecture'] == 'aarch64' else 'amd64' }}"

# uv (Astral) - pinned release installed from GitHub. The digests are pinned
# here (not fetched alongside the archive) so a compromised release endpoint
# cannot swap both. Update both when bumping the version:
#   curl -L https://github.com/astral-sh/uv/releases/download/<ver>/uv-<target>.tar.gz.sha256
# Never older than the uv pyproject.toml pins for this machine, which
# Dependabot moves: tests/unit/test_pins.py fails when it is. Dependabot reads
# no role default, and a pin nothing moved kept every VM on a uv with
# published advisories.
dev_tools_uv_version: "0.13.5"
dev_tools_uv_arch_map:
  x86_64: x86_64-unknown-linux-gnu
  aarch64: aarch64-unknown-linux-gnu
dev_tools_uv_sha256:
  x86_64: f68d291c75783122dad58ab77def0e13f3233f358731db5d6d7e8715603b928f
  aarch64: 4bb69cf95ed13f23713bb7bc09f241896ea0c75b7c557e615a20604b82f9c403
dev_tools_uv_install_dir: /usr/local/bin

# Rust (rustup from Ubuntu's archive, which conflicts with its rustc and cargo
# packages). rustup installs the toolchain for dev_tools_user, under
# ~/.rustup, and its proxies in /usr/bin (cargo, rustc, ...) run it. The
# toolchain is installed when it is missing and never updated by the role:
# `rustup update` on the VM does that.
dev_tools_rust_toolchain: stable
dev_tools_rust_components: [clippy, rustfmt]
