---
# What login.yml says of gh's login, and records for NEXT STEPS; just status shows the same line, from the same
# words (github_projects_login_report, lib/claude_vm/status/lines.py). Reads only what login_read.yml and the sign-in
# left. Advice only for what can run: the device flow when it would (web), the token sign-in when a vault token waits
# for it - which the whole role does next in this run under just login x --only github - and nothing with
# github_auth: false, which leaves gh alone.
- name: login_report | Report the login state and what to do about it
  ansible.builtin.debug:
    msg: "{{ inventory_hostname }}: {{ github_projects_login_report.line }}"
  register: github_projects_login_reported

# NEXT STEPS (callback_plugins/agent_warehouse.py): the line above while
# there is something left to do - a gh too old to say where gh is the role's
# business, a device-flow login without the workflow scope, a sign-out that nothing in this run ends - and
# nothing otherwise: signed in, gh left alone (github_auth: false), gh not
# installed by choice. A later record of the same VM replaces this one.
- name: login_report | Keep what is left to do for the end of the run
  ansible.builtin.set_stats:
    data:
      github_projects_next: >-
        {{ {inventory_hostname: {'github': github_projects_login_reported.msg if github_projects_login_left | bool else ''}} }}
    aggregate: true
    per_host: false
