---
# The directory this role keeps its files in on the VM, which claude_code
# shares, was ~/.config/claude-on-proxmox through 1.x: moved once to its name
# from 2.0 before anything reads or writes them, so the marker of the role's own
# login comes along and that login stays the role's. Whichever of the two roles
# runs first moves it. Never from just status, which only reads.
- name: names | Look up home directory of {{ github_projects_user }}
  ansible.builtin.getent:
    database: passwd
    key: "{{ github_projects_user }}"

- name: names | Move this role's directory on the VM to its name from 2.0
  ansible.builtin.command:
    argv: [mv, -n, "{{ github_projects_state_dir_1x }}", "{{ github_projects_state_dir }}"]
    creates: "{{ github_projects_state_dir }}"
    removes: "{{ github_projects_state_dir_1x }}"
  become: true
  become_user: "{{ github_projects_user }}"
