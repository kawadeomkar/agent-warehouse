---
- name: Validate configuration
  ansible.builtin.assert:
    that:
      - github_projects_username | length > 0
    fail_msg: "github_projects_username must be set (vault_github_username in vault.yml)."
    quiet: true

# Before the listing, which is made with whatever token the VM holds after
# this: the vault's, or the one gh stored at a login the user made. It reads
# gh's state as just login --only github does (login_read.yml), the user's
# home included, which the projects directory below is resolved from.
- name: Sign gh in and make it git's credential helper
  ansible.builtin.include_tasks: auth.yml

- name: Resolve projects directory
  ansible.builtin.set_fact:
    github_projects_target_dir: "{{ github_projects_dir | projects_dir(github_projects_home_dir) }}"

- name: Ensure projects directory exists
  ansible.builtin.file:
    path: "{{ github_projects_target_dir }}"
    state: directory
    owner: "{{ github_projects_user }}"
    group: "{{ github_projects_user }}"
    mode: "0755"

# The listing, the identity and the clones, in a file of their own so that
# tests/unit/test_github_auth.py can run them with the directory above given.
- name: List and clone the repositories
  ansible.builtin.include_tasks: clone.yml
