---
# Shared settings live in .config/molecule/config.yml at the project root.
dependency:
  name: galaxy
  options:
    requirements-file: ../../../../requirements.yml
platforms:
  - name: claude-on-proxmox-github_projects
    image: "${MOLECULE_IMAGE:-geerlingguy/docker-ubuntu2404-ansible@sha256:29e6f9d736c3401815d98f626a41c55a54a4ef1edb9d1d1223018746d3acba14}"
    pre_build_image: true
    command: ""
    privileged: true
    cgroupns_mode: host
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
provisioner:
  name: ansible
  env:
    # Resolve roles from this repository's roles/ directory (not Galaxy).
    ANSIBLE_ROLES_PATH: ${MOLECULE_PROJECT_DIRECTORY}/..
    # The device flow opens its page through the repository's page_opener
    # filter (filter_plugins/desktop.py) and quotes gh through plain_text
    # (text.py), as proxmox_vm's scenario does for its own.
    ANSIBLE_FILTER_PLUGINS: ${MOLECULE_PROJECT_DIRECTORY}/../../filter_plugins
