---
# Where a VM's guest-agent port appears. Proxmox gives the VM a virtio-serial
# port of this name while its agent is enabled (proxmox_vm sets agent:
# enabled=1), and the VM's udev links it here at boot. qemu-guest-agent's unit
# is bound to that device, so it can run only where this path exists.
common_guest_agent_port: /dev/virtio-ports/org.qemu.guest_agent.0

# The rest of the PATH sshd gives common_user's sessions, after
# common_ssh_path_dirs: the one /etc/environment sets, as it is now, which PAM
# gives every other session. Ubuntu's own value where that file sets none.
common_ssh_path_system: >-
  {{ common_environment.content | default('') | b64decode
     | regex_findall('^PATH="?([^"\n]*)"?[ \t]*$', multiline=True)
     | first | default('', true)
     or '/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin:/usr/games:/usr/local/games:/snap/bin' }}
# The PATH the drop-in gives common_user's ssh sessions, and the drop-in: whole,
# since SetEnv takes no variables.
common_ssh_path: >-
  {{ (common_ssh_path_dirs
      | map('regex_replace', '^', ansible_facts.getent_passwd[common_user][4] ~ '/')
      | list + [common_ssh_path_system]) | join(':') }}
common_ssh_path_dropin: /etc/ssh/sshd_config.d/15-claude-on-proxmox-path.conf

# With common_user_passwordless_sudo off: cloud-init's settings for the user it
# creates, read after cloud.cfg and every drop-in sorted before it.
common_cloud_init_user_cfg: /etc/cloud/cloud.cfg.d/99-claude-on-proxmox-user.cfg
