---
# Converge masked snapd, which had no snap installed. A VM with a snap keeps
# snapd running: the snap would stop working without it. So snapd is put back,
# a snap appears, and the role's masking runs again; verify.yml then finds
# snapd running and every other stand-in still masked. Before that, fwupd's
# timer is left failed, as masking it while it waits leaves it: the run must
# clear that too.
- name: Run the masking again once a snap is installed
  hosts: all
  become: true
  gather_facts: false
  tasks:
    - name: Read what converge left snapd as
      ansible.builtin.command:
        argv: [systemctl, is-enabled, snapd.service]
      register: common_side_effect_snapd
      changed_when: false
      failed_when: common_side_effect_snapd.stdout != 'masked'

    # Both unmasked before either starts: a socket whose service is masked does
    # not start, nor one whose service already runs.
    - name: Unmask snapd
      ansible.builtin.systemd_service:
        name: "{{ item }}"
        masked: false
      loop: [snapd.socket, snapd.service]

    - name: Start snapd again
      ansible.builtin.systemd_service:
        name: "{{ item }}"
        enabled: true
        state: started
      loop: [snapd.socket, snapd.service]

    # Converge stopped the timer before it masked it, so the timer never
    # failed: the clear after the mask has nothing to hide.
    - name: Read what the timer logged in converge
      ansible.builtin.command:
        argv: [journalctl, --no-pager, --output=cat, --unit=fwupd-refresh.timer]
      register: common_side_effect_timer_log
      changed_when: false
      failed_when: >-
        common_side_effect_timer_log.stdout is not search('Stopped')
        or common_side_effect_timer_log.stdout is search('Unit to trigger vanished')

    # The mask before the stop: systemd_service masks first, and the timer,
    # masked under a reload while it waits, fails.
    - name: Start fwupd's timer again
      ansible.builtin.systemd_service:
        name: fwupd-refresh.timer
        masked: false
        state: started

    - name: Mask the timer while it waits
      ansible.builtin.systemd_service:
        name: fwupd-refresh.timer
        masked: true

    - name: Read what that left the timer as
      ansible.builtin.command:
        argv: [systemctl, is-failed, fwupd-refresh.timer]
      register: common_side_effect_timer
      changed_when: false
      failed_when: common_side_effect_timer.stdout != 'failed'

    - name: Install a snap, as snapd keeps one
      ansible.builtin.copy:
        content: "a snap\n"
        dest: /var/lib/snapd/snaps/hello_42.snap
        owner: root
        group: root
        mode: "0644"

    - name: Run the role's masking again
      ansible.builtin.include_role:
        name: common
        tasks_from: masked_units

# The container has no guest-agent port, so converge left the agent's stand-in
# stopped and started the other service. Given a port, the same tasks start
# the agent too, and verify.yml finds it running.
- name: Start the guest agent once the VM has its port
  hosts: all
  become: true
  gather_facts: false
  tasks:
    - name: Read what converge left the agent as
      ansible.builtin.command:
        argv: [systemctl, is-active, qemu-guest-agent.service]
      register: common_side_effect_agent
      changed_when: false
      failed_when: common_side_effect_agent.stdout != 'inactive'

    - name: Give the VM a stand-in for the port
      ansible.builtin.copy:
        content: ""
        dest: /run/agent-warehouse-guest-agent-port
        owner: root
        group: root
        mode: "0600"

    - name: Run the role's services again
      ansible.builtin.include_role:
        name: common
        tasks_from: services
      vars:
        common_guest_agent_port: /run/agent-warehouse-guest-agent-port

# common_ssh_path_dirs: sshd keeps the first SetEnv that applies, so a drop-in
# sorted before the role's that gives dev a PATH of its own wins. The role
# fails naming it, rather than leaving ssh commands without the directories.
# Then [] removes the role's drop-in and the default writes it back, for
# verify.yml to find as converge left it.
- name: Check the PATH sshd gives dev's sessions both ways
  hosts: all
  become: true
  tasks:
    - name: Give dev a PATH of its own in a drop-in sorted first
      ansible.builtin.copy:
        content: "Match User dev\n    SetEnv PATH=/usr/bin:/bin\n"
        dest: /etc/ssh/sshd_config.d/05-molecule-setenv.conf
        owner: root
        group: root
        mode: "0644"

    - name: Run the role's ssh PATH tasks over it
      block:
        - name: Include the ssh PATH tasks, which must fail naming the drop-in that won
          ansible.builtin.include_tasks: "{{ playbook_dir }}/../../../../tests/molecule/refused.yml"
          vars:
            refused_role: common
            refused_tasks_from: ssh_path
            refused_at: Fail when sshd does not give
            refused_because: [/etc/ssh/sshd_config.d/05-molecule-setenv.conf, 'setenv PATH=/usr/bin:/bin']
            refused_unless: the role accepted a drop-in that gives dev another PATH first
      always:
        - name: Remove that drop-in
          ansible.builtin.file:
            path: /etc/ssh/sshd_config.d/05-molecule-setenv.conf
            state: absent

    - name: Run the role's ssh PATH tasks with no directories
      ansible.builtin.include_role:
        name: common
        tasks_from: ssh_path
      vars:
        common_ssh_path_dirs: []

    - name: Look for the role's drop-in
      ansible.builtin.stat:
        path: /etc/ssh/sshd_config.d/15-agent-warehouse-path.conf
      register: common_side_effect_path_dropin
      failed_when: common_side_effect_path_dropin.stat.exists

    - name: Run the role's ssh PATH tasks as converge did
      ansible.builtin.include_role:
        name: common
        tasks_from: ssh_path

# /etc/tmux.conf holding a line of the user's own as well: [] takes the block
# out and nothing else, and the settings go back in beside that line, which
# verify.yml then finds there with the block.
- name: Take the tmux settings out and put them back around a line of the user's
  hosts: all
  become: true
  gather_facts: false
  tasks:
    - name: Add a line of the user's own to /etc/tmux.conf
      ansible.builtin.lineinfile:
        path: /etc/tmux.conf
        line: set -g mouse on

    - name: Run the role's tmux tasks with no settings
      ansible.builtin.include_role:
        name: common
        tasks_from: tmux
      vars:
        common_tmux_settings: []

    - name: Read what that left of /etc/tmux.conf
      ansible.builtin.slurp:
        src: /etc/tmux.conf
      register: common_side_effect_tmux
      failed_when: (common_side_effect_tmux.content | b64decode) != "set -g mouse on\n"

    - name: Run the role's tmux tasks as converge did
      ansible.builtin.include_role:
        name: common
        tasks_from: tmux

# The person's keys over a keys file that holds more, through a ~/.ssh that is a
# link to a folder of dev's: both lines of the listed key, the first with
# options in front and another comment, become the listed form (sshd applies
# the first), the line of a key not on the list is kept, directly before one of
# them, and so is a line of the key commented out; a real key's line becomes
# its listed form, whose options hold a backslash, written as it is; the folder
# the link names is made 0700, as the user, and a second run changes nothing. A key that is none is refused, and so are
# an item of two lines, one commented out and a key listed twice. Then ~/.ssh
# is put back as converge left it, for verify.yml to find the listed key there.
- name: Authorise the keys over a keys file that holds more, through a linked ~/.ssh
  hosts: all
  become: true
  gather_facts: false
  vars:
    common_side_effect_listed: ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIOMoleculeTestKeyDoNotUse0000000000000000000 molecule@test
    common_side_effect_other: ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIOtherKeyKeptDoNotUse0000000000000000000000 kept@test
    # A real key, whose base64 holds r, n and +, listed with options that hold a
    # backslash, which Python's replacement would read as a group's number.
    common_side_effect_real: ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIHMy11wLE9DSZRr7s6m76bSqWqNH+fn6Ga958m5nBwQc rn@test
    common_side_effect_real_listed: 'command="printf x\1y" {{ common_side_effect_real }}'
    common_side_effect_home: "{{ ansible_facts.getent_passwd.dev[4] }}"
  tasks:
    - name: Read dev's home
      ansible.builtin.getent:
        database: passwd
        key: dev

    - name: Move ~/.ssh to a folder of dev's, open to all
      ansible.builtin.command:
        argv: [mv, "{{ common_side_effect_home }}/.ssh", "{{ common_side_effect_home }}/keys-elsewhere"]
      changed_when: true

    - name: Open that folder up
      ansible.builtin.file:
        path: "{{ common_side_effect_home }}/keys-elsewhere"
        state: directory
        mode: "0755"

    - name: Link ~/.ssh to it
      ansible.builtin.file:
        src: "{{ common_side_effect_home }}/keys-elsewhere"
        dest: "{{ common_side_effect_home }}/.ssh"
        state: link
        owner: dev
        group: dev
        follow: false

    - name: Write the listed key twice, first with options and another comment, one commented out, a key not on the list, and the real key
      ansible.builtin.copy:
        content: |
          no-agent-forwarding,no-pty {{ common_side_effect_listed.rsplit(' ', 1)[0] }} another@comment
          # {{ common_side_effect_listed.rsplit(' ', 1)[0] }} commented@out
          {{ common_side_effect_other }}
          {{ common_side_effect_listed.rsplit(' ', 1)[0] }} second@old
          {{ common_side_effect_real.rsplit(' ', 1)[0] }} plain@old
        dest: "{{ common_side_effect_home }}/keys-elsewhere/authorized_keys"
        owner: dev
        group: dev
        mode: "0644"

    - name: Run the role's keys tasks
      ansible.builtin.include_role:
        name: common
        tasks_from: keys
      vars:
        common_user_ssh_public_keys: ["{{ common_side_effect_listed }}", "{{ common_side_effect_real_listed }}"]

    - name: Read what that left of the keys file
      ansible.builtin.slurp:
        src: "{{ common_side_effect_home }}/keys-elsewhere/authorized_keys"
      register: common_side_effect_keys

    - name: Look at the link, the folder it names and the keys file
      ansible.builtin.stat:
        path: "{{ item }}"
        follow: false
      loop:
        - "{{ common_side_effect_home }}/.ssh"
        - "{{ common_side_effect_home }}/keys-elsewhere"
        - "{{ common_side_effect_home }}/keys-elsewhere/authorized_keys"
      register: common_side_effect_keys_stat

    - name: Run the role's keys tasks again
      ansible.builtin.include_role:
        name: common
        tasks_from: keys
      vars:
        common_user_ssh_public_keys: ["{{ common_side_effect_listed }}", "{{ common_side_effect_real_listed }}"]

    - name: Read what the second run left of the keys file
      ansible.builtin.slurp:
        src: "{{ common_side_effect_home }}/keys-elsewhere/authorized_keys"
      register: common_side_effect_keys_again

    - name: Assert the listed form replaced both its lines, the others were kept, the link was followed, and the second run changed nothing
      vars:
        common_side_effect_key: "{{ common_side_effect_listed.rsplit(' ', 1)[0] }}"
      ansible.builtin.assert:
        that:
          - >-
            (common_side_effect_keys.content | b64decode)
            == [common_side_effect_listed, '# ' ~ common_side_effect_key ~ ' commented@out', common_side_effect_other,
                common_side_effect_listed, common_side_effect_real_listed, ''] | join("\n")
          - common_side_effect_keys_again.content == common_side_effect_keys.content
          - common_side_effect_keys_stat.results[0].stat.islnk
          - common_side_effect_keys_stat.results[1].stat.mode == '0700'
          - common_side_effect_keys_stat.results[2].stat.mode == '0600'
          - common_side_effect_keys_stat.results | map(attribute='stat.pw_name') | list == ['dev'] * 3
        quiet: true

    - name: Run the role's keys tasks over a key that is none, two lines, one commented out and a key listed twice
      ansible.builtin.include_tasks: "{{ playbook_dir }}/../../../../tests/molecule/refused.yml"
      vars:
        refused_role: common
        refused_tasks_from: keys
        refused_at: Refuse a listed key that is no public key
        refused_because: "{{ common_side_effect_case.because }}"
        refused_unless: "the role took {{ common_side_effect_case.what }}"
        common_user_ssh_public_keys: "{{ common_side_effect_case.listed }}"
      loop:
        - what: a key that is no public key
          listed: [not-a-key]
          because: ['no public key alone', 'not-a-key']
        - what: an item of two lines
          listed: ["{{ common_side_effect_listed }}\n{{ common_side_effect_other }}"]
          because: ['no public key alone', 'kept@test']
        - what: a key commented out
          listed: ["# {{ common_side_effect_other }}"]
          because: ['no public key alone', '# ssh-ed25519 ']
        - what: a key listed twice
          listed: ["{{ common_side_effect_listed }}", "{{ common_side_effect_listed.rsplit(' ', 1)[0] }} twice@test"]
          because: ['lists the same key twice']
      loop_control:
        loop_var: common_side_effect_case
        label: "{{ common_side_effect_case.what }}"

    - name: Take the link away
      ansible.builtin.file:
        path: "{{ common_side_effect_home }}/.ssh"
        state: absent

    - name: Put the folder back as ~/.ssh
      ansible.builtin.command:
        argv: [mv, "{{ common_side_effect_home }}/keys-elsewhere", "{{ common_side_effect_home }}/.ssh"]
      changed_when: true
