---
# Before anything writes them, the files this role keeps by their 1.x names.
- name: Move this role's files from their 1.x names
  ansible.builtin.include_tasks: names.yml

- name: Configure apt, and bring the packages up to date
  ansible.builtin.include_tasks: apt.yml

- name: Set the timezone
  ansible.builtin.include_tasks: timezone.yml

- name: Set hostname
  ansible.builtin.hostname:
    name: "{{ common_hostname }}"
  when:
    - common_manage_hostname
    - ansible_facts['virtualization_type'] not in common_container_virt_types

- name: Create the user
  ansible.builtin.include_tasks: user.yml

- name: Grant or take away passwordless sudo
  ansible.builtin.include_tasks: sudo.yml

# As the user, not root: authorized_key follows a symlink at ~/.ssh, so as root
# it made the keys file in the link's target and set that directory to 0700,
# wherever it was (ansible.posix 2.2.1 stopped it following a link at the keys
# file, not at the directory). As the user, a link reaches nothing the user
# could not change already.
- name: Authorise SSH keys
  ansible.posix.authorized_key:
    user: "{{ common_user }}"
    key: "{{ item }}"
    state: present
  become: true
  become_user: "{{ common_user }}"
  loop: "{{ common_user_ssh_public_keys }}"
  loop_control:
    label: "{{ item.split(' ')[-1] if item.count(' ') > 1 else item[:32] ~ '...' }}"

- name: Harden sshd, or take the hardening away
  ansible.builtin.include_tasks: sshd.yml

- name: Put ~/.local/bin on PATH for all users
  ansible.builtin.include_tasks: profile.yml

# The same directories for what sshd starts without a login shell.
- name: Put the per-user directories on PATH for ssh commands
  ansible.builtin.include_tasks: ssh_path.yml

- name: Write the tmux settings
  ansible.builtin.include_tasks: tmux.yml

- name: Enable and start services
  ansible.builtin.include_tasks: services.yml
  when: ansible_facts['service_mgr'] == 'systemd'

- name: Mask the services a headless VM has no use for
  ansible.builtin.include_tasks: masked_units.yml
  when:
    - ansible_facts['service_mgr'] == 'systemd'
    - common_masked_units | length > 0
