---
argument_specs:
  main:
    short_description: OS baseline for a development VM
    options:
      common_user:
        type: str
        default: dev
        description: Login user, normally created by cloud-init, that the role gives its shell, groups, sudo rule and keys. Set through vm_user in local.yml.
      common_user_shell:
        type: str
        default: /bin/bash
        description: Login shell of common_user.
      common_user_groups:
        type: list
        elements: str
        default: [sudo]
        description: Groups common_user is added to. Groups it already has are kept.
      common_user_passwordless_sudo:
        type: bool
        default: true
        description:
          - Let common_user run sudo without a password, through a sudoers drop-in, which the playbooks' become relies on.
          - false makes sudo ask for common_user_password, which the playbooks then become root with, and needs it set. It
            removes the role's drop-in and cloud-init's own rule for the user (90-cloud-init-users), keeps a new cloud-init
            instance from writing that rule again (cloud.cfg.d), takes the user out of common_user_groups_revoked, and fails
            if sudo still lets the user run anything without a password.
      common_user_password:
        type: str
        default: ""
        no_log: true
        description:
          - The password sudo asks common_user for when common_user_passwordless_sudo is false, set by the role.
          - Set through vault_vm_password in vault.yml.
      common_user_groups_revoked:
        type: list
        elements: str
        default: [adm, cdrom, lxd]
        description:
          - Groups common_user is taken out of when common_user_passwordless_sudo is false, unless common_user_groups lists one.
          - cloud-init gives the user it creates all three. lxd gets LXD from Ubuntu's lxd-installer on first use, root wherever
            snapd runs; cdrom reads the cloud-init drive, which holds the password's hash; adm reads every system log.
      common_user_ssh_public_keys:
        type: list
        elements: str
        default: []
        description: Public keys added to common_user's authorized_keys. Keys already there are kept. Set through vm_ssh_public_keys in local.yml.
      common_timezone:
        type: str
        default: Etc/UTC
        description: Timezone name from /usr/share/zoneinfo, such as Europe/Berlin, linked to /etc/localtime.
      common_manage_hostname:
        type: bool
        default: true
        description: Set the hostname to common_hostname. Never done in a container (common_container_virt_types).
      common_hostname:
        type: str
        description: Hostname given to the VM. Defaults to the inventory hostname, the VM's name.
      common_harden_ssh:
        type: bool
        default: true
        description: Write an sshd drop-in that turns password logins off, root's included, even where cloud-init was given a password. false removes it.
      common_ssh_path_dirs:
        type: list
        elements: str
        default: [.local/bin, .cargo/bin]
        description:
          - Directories in common_user's home put first on PATH for every session sshd starts for that user, `ssh vm <command>`
            included, which reads no profile. Written as an sshd drop-in (Match User, SetEnv) holding the whole PATH, the
            rest being /etc/environment's, and checked with sshd -T. Login shells get ~/.local/bin from /etc/profile.d,
            and ~/.cargo/bin there too where dev_tools installs Rust. [] removes the drop-in.
      common_tmux_settings:
        type: list
        elements: str
        default:
          - set -g allow-passthrough on
          - set -g focus-events on
          - set -s extended-keys on
          - set -as terminal-features 'xterm*:extkeys'
        description:
          - tmux commands written as one block of /etc/tmux.conf, which tmux reads before ~/.tmux.conf, so a setting of the
            user's own wins; lines of the file outside the block are left as they are. The default is what Claude Code's
            terminal documentation asks for inside tmux - notifications and the progress bar passed through to the outer
            terminal, Shift+Enter told from Enter. allow-passthrough lets a program in a pane write escape sequences to
            the terminal you attach from, as it could without tmux. [] takes the block out.
      common_apt_upgrade:
        type: bool
        default: true
        description: Upgrade the installed packages (apt safe upgrade) on every run.
      common_apt_cache_valid_time:
        type: int
        default: 3600
        description: Seconds the apt cache counts as fresh. An older one is refreshed at the start of the role.
      common_apt_lock_timeout:
        type: int
        default: 600
        description: Seconds each apt task waits for the apt lock, which unattended-upgrades holds on a fresh cloud image after first boot.
      common_apt_keep_downloads:
        type: bool
        default: false
        description:
          - false deletes each package apt downloads once it is installed, empties apt's download cache daily, and
            empties it once of what was left there. true keeps them, as apt-get does by default.
      common_container_virt_types:
        type: list
        elements: str
        default: [docker, container, containerd, podman, lxc]
        description: Virtualisation types under which the hostname is not set, because the host is a container.
      common_packages:
        type: list
        elements: str
        description: Baseline packages every VM gets. Setting it replaces the baseline; add packages with common_extra_packages instead.
      common_extra_packages:
        type: list
        elements: str
        default: []
        description: More packages to install on top of common_packages. Set through vm_extra_packages in local.yml.
      common_enabled_services:
        type: list
        elements: str
        default: [qemu-guest-agent]
        description: >-
          Services enabled at boot and started, where systemd runs. qemu-guest-agent is started only where the VM has its port,
          /dev/virtio-ports/org.qemu.guest_agent.0, which Proxmox adds while the VM's agent is enabled.
      common_masked_units:
        type: list
        elements: str
        default:
          - fwupd.service
          - fwupd-refresh.timer
          - multipathd.service
          - multipathd.socket
          - ModemManager.service
          - udisks2.service
          - snapd.service
          - snapd.socket
          - snapd.seeded.service
        description:
          - Units masked and stopped where systemd runs, of those the VM has; snapd's only while no snap is installed.
            [] masks none, and a unit taken off the list stays masked.
