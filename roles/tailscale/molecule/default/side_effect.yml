---
# After converge and idempotence, the VM the role installed and joined is taken
# through what a fleet meets: a setting changed behind the role's back, the
# feature turned off - which leaves it as it is - and on again, and, after
# Tailscale was taken off by hand, a package host that cannot be reached. The
# VM where Tailscale was installed by hand is switched off too, and must come
# through untouched. verify.yml then checks the state the last step left.
- name: Side effect on the VM the role installed
  hosts: agent-warehouse-tailscale
  become: true
  vars:
    # Chosen, as off is the role's default from 2.1; the stages that turn it off say so themselves.
    tailscale_enabled: true
    tailscale_auth_key: tskey-auth-kGood0CNTRL-TestOnly000000000000000000000
    tailscale_upload_logs: false
    tailscale_daemon_flags: [--tun=userspace-networking]
    tailscale_login_desktop: false
    tailscale_side_effect_state: /root/.tailscale-fake
  tasks:
    # --- A setting changed behind the role's back: one `tailscale set`, once.
    - name: Rename the node behind the role's back
      ansible.builtin.copy:
        content: drifted
        dest: "{{ tailscale_side_effect_state }}/prefs-hostname"
        mode: "0644"

    - name: Run the role over the drift
      ansible.builtin.include_role:
        name: tailscale

    - name: Run the role again, with nothing to change
      ansible.builtin.include_role:
        name: tailscale

    - name: Read what the stand-in was asked
      ansible.builtin.slurp:
        src: "{{ tailscale_side_effect_state }}/calls.log"
      register: tailscale_side_effect_calls

    - name: Assert the drift was set back once, by name, and never by up or with the key
      vars:
        tailscale_side_effect_sets: >-
          {{ (tailscale_side_effect_calls.content | b64decode).splitlines() | select('match', '^set ') | list }}
      ansible.builtin.assert:
        that:
          - tailscale_side_effect_sets == ['set --hostname=agent-warehouse-tailscale']
          - (tailscale_side_effect_calls.content | b64decode).count('--auth-key') == 1
        fail_msg: "{{ tailscale_side_effect_calls.content | b64decode }}"
        quiet: true

    # --- Off: left as it is, unmanaged - running, joined, its package, its
    # repository and its markers - and nothing but reads reach the login. From
    # here on the stand-in answers only while the package's tailscaled runs, as
    # the real CLI does.
    - name: Have the stand-in answer only while tailscaled runs
      ansible.builtin.copy:
        content: ""
        dest: "{{ tailscale_side_effect_state }}/real-daemon"
        mode: "0644"

    - name: Read what the stand-in was asked before turning it off
      ansible.builtin.slurp:
        src: "{{ tailscale_side_effect_state }}/calls.log"
      register: tailscale_side_effect_before_off

    - name: Turn Tailscale off
      ansible.builtin.include_role:
        name: tailscale
      vars:
        tailscale_enabled: false

    - name: Read what turning it off left
      ansible.builtin.stat:
        path: "{{ item }}"
      loop:
        - /etc/apt/sources.list.d/tailscale.sources
        - /etc/systemd/system/tailscaled.service.d/10-agent-warehouse.conf
        - /var/lib/agent-warehouse/tailscale-installed
        - /var/lib/agent-warehouse/tailscale-joined
        - /lib/systemd/system/tailscaled.service
        # The stand-in's login, which a logout would remove.
        - "{{ tailscale_side_effect_state }}/nodekey"
      register: tailscale_side_effect_off

    - name: Read dpkg's word on the package, tailscaled's, and what the stand-in was asked
      ansible.builtin.command:
        argv:
          - sh
          - -c
          - >-
            dpkg-query --show --showformat='${db:Status-Status}' tailscale; echo;
            systemctl is-active tailscaled || true; cat {{ tailscale_side_effect_state }}/calls.log
      register: tailscale_side_effect_off_said
      changed_when: false
      failed_when: false

    - name: Assert it is all there and running, and only read since
      vars:
        tailscale_side_effect_since: >-
          {{ tailscale_side_effect_off_said.stdout_lines[2:]
             [(tailscale_side_effect_before_off.content | b64decode).splitlines() | length:] }}
      ansible.builtin.assert:
        that:
          - tailscale_side_effect_off.results | rejectattr('stat.exists') | list | length == 0
          - tailscale_side_effect_off_said.stdout_lines[0] == 'installed'
          - tailscale_side_effect_off_said.stdout_lines[1] == 'active'
          - tailscale_side_effect_since | reject('match', '^(status|debug) ') | list == []
        fail_msg: >-
          {{ tailscale_side_effect_off.results | rejectattr('stat.exists') | map(attribute='item') | list }}
          {{ tailscale_side_effect_off_said.stdout }}
        quiet: true

    # --- On again: managed again, and nothing to change: it never went.
    - name: Turn Tailscale on again
      ansible.builtin.include_role:
        name: tailscale

    - name: Read the node's state
      ansible.builtin.command:
        argv: [tailscale, status, --json]
      register: tailscale_side_effect_back
      changed_when: false

    - name: Assert it is still joined
      ansible.builtin.assert:
        that: (tailscale_side_effect_back.stdout | from_json).BackendState == 'Running'
        quiet: true

    # --- A package host that cannot be reached, after Tailscale was taken off
    # by hand as the guide says ("Turning it off"): the install fails, its
    # repository comes back out, the marker stays, and apt still works.
    # /etc/hosts is bind-mounted into the container: rename over it fails.
    - name: Make pkgs.tailscale.com unreachable
      ansible.builtin.lineinfile:
        path: /etc/hosts
        line: 127.0.0.1 pkgs.tailscale.com
        unsafe_writes: true

    # The guide's steps, the stand-in's login for Tailscale's own; the device
    # has no tailnet to leave here.
    - name: Take Tailscale off by hand, as the guide says
      ansible.builtin.shell: |
        set -eu
        tailscale logout || true
        DEBIAN_FRONTEND=noninteractive apt-get remove -y -q tailscale
        rm -f /etc/apt/sources.list.d/tailscale.sources \
          /etc/systemd/system/tailscaled.service.d/10-agent-warehouse.conf \
          /var/lib/agent-warehouse/tailscale-installed /var/lib/agent-warehouse/tailscale-joined
        systemctl daemon-reload
      changed_when: true

    - name: Run the role with its package host unreachable
      ansible.builtin.include_tasks: "{{ playbook_dir }}/../../../../tests/molecule/refused.yml"
      vars:
        refused_role: tailscale
        refused_because: [apt cache, could not be fetched]
        refused_at: '^install \| Install Tailscale$'
        refused_unless: The role installed Tailscale with its package host unreachable.

    - name: Read what the failed install left
      ansible.builtin.stat:
        path: "{{ item }}"
      loop:
        - /etc/apt/sources.list.d/tailscale.sources
        - /var/lib/agent-warehouse/tailscale-installed
      register: tailscale_side_effect_failed

    - name: Refresh apt, as common does at the start of every configure
      ansible.builtin.command:
        argv: [apt-get, update]
      register: tailscale_side_effect_apt
      changed_when: false
      failed_when: false

    - name: Assert the repository came back out, the marker stayed, and apt works
      ansible.builtin.assert:
        that:
          - not tailscale_side_effect_failed.results[0].stat.exists
          - tailscale_side_effect_failed.results[1].stat.exists
          - tailscale_side_effect_apt.rc == 0
        fail_msg: "{{ tailscale_side_effect_apt.stderr | default('') }}"
        quiet: true

    - name: Make pkgs.tailscale.com reachable again
      ansible.builtin.lineinfile:
        path: /etc/hosts
        line: 127.0.0.1 pkgs.tailscale.com
        state: absent
        unsafe_writes: true

    - name: Install and join once more, for verify.yml
      ansible.builtin.include_role:
        name: tailscale

    # The markers and tailscaled's drop-in as 1.x named them: the next run moves
    # each to its name from 2.0, the drop-in's comment rewritten as it goes, so
    # tailscaled keeps running as it was - the same process - and verify.yml finds
    # the VM as the run above left it.
    - name: Name the markers' directory and the drop-in as 1.x did
      ansible.builtin.shell: |
        set -eu
        mv /var/lib/agent-warehouse /var/lib/claude-on-proxmox
        d=/etc/systemd/system/tailscaled.service.d
        mv "$d/10-agent-warehouse.conf" "$d/10-claude-on-proxmox.conf"
        sed -i 's/^# agent-warehouse, /# claude-on-proxmox, /' "$d/10-claude-on-proxmox.conf"
        systemctl daemon-reload
      changed_when: true

    - name: Read tailscaled's process before the run that moves them
      ansible.builtin.command:
        argv: [systemctl, show, --property=MainPID, --value, tailscaled]
      register: tailscale_side_effect_pid_before
      changed_when: false

    - name: Run the role on the VM as 1.x left it
      ansible.builtin.include_role:
        name: tailscale

    - name: Read tailscaled's process after it, and where the files are
      ansible.builtin.command:
        argv: [systemctl, show, --property=MainPID, --value, tailscaled]
      register: tailscale_side_effect_pid_after
      changed_when: false

    - name: Look for the markers and the drop-in by both names
      ansible.builtin.stat:
        path: "{{ item }}"
      loop:
        - /var/lib/claude-on-proxmox
        - /etc/systemd/system/tailscaled.service.d/10-claude-on-proxmox.conf
        - /var/lib/agent-warehouse/tailscale-installed
        - /var/lib/agent-warehouse/tailscale-joined
        - /etc/systemd/system/tailscaled.service.d/10-agent-warehouse.conf
      register: tailscale_side_effect_names

    - name: Read the drop-in by its name from 2.0
      ansible.builtin.slurp:
        src: /etc/systemd/system/tailscaled.service.d/10-agent-warehouse.conf
      register: tailscale_side_effect_dropin

    - name: Assert each moved, and tailscaled was not restarted for it
      ansible.builtin.assert:
        that:
          - not tailscale_side_effect_names.results[0].stat.exists
          - not tailscale_side_effect_names.results[1].stat.exists
          - tailscale_side_effect_names.results[2:] | map(attribute='stat.exists') | list == [true, true, true]
          - (tailscale_side_effect_dropin.content | b64decode) is search('^# agent-warehouse, ', multiline=True)
          - tailscale_side_effect_pid_after.stdout == tailscale_side_effect_pid_before.stdout
        quiet: true

- name: Side effect on the VM where Tailscale was installed by hand
  hosts: agent-warehouse-tailscale-byhand
  become: true
  tasks:
    - name: Turn Tailscale off there
      ansible.builtin.include_role:
        name: tailscale
      vars:
        tailscale_enabled: false
        tailscale_login_desktop: false
