---
# Entry point for `just status` (playbooks/status.yml): how this VM is on Tailscale, read as configure reads it and
# said as configure says it, changing nothing. What is installed and whose (ownership.yml), the state read once
# rather than waited on (state.yml), and the report's own line (report.yml), which status shows where something is
# left to do. Where Tailscale is not the VPN, but this role installed it, which configure leaves as it is: its state
# too, so status shows the VM on the tailnet, unmanaged, rather than off. Never the install, the join, the settings
# or the web login: status is read-only.
- name: status | Read what is installed, and who installed it
  ansible.builtin.include_tasks: ownership.yml

# Once, with no waiting for a state that has not settled: status says "connecting" instead.
- name: status | Read Tailscale's state
  ansible.builtin.include_tasks: state.yml
  vars:
    tailscale_settle_seconds: 0
  when: tailscale_wanted | bool or tailscale_status_unmanaged | bool

- name: status | Say how this VM is on Tailscale
  ansible.builtin.include_tasks: report.yml
  when: tailscale_wanted | bool

# What the report shows, and nothing else: no key, no login link.
- name: status | Keep how this VM is on Tailscale
  vars:
    tailscale_status_read: "{{ tailscale_wanted | bool or tailscale_status_unmanaged | bool }}"
  ansible.builtin.set_fact:
    tailscale_status_found:
      enabled: "{{ tailscale_wanted | bool }}"
      installed: "{{ tailscale_installed | bool }}"
      ours: "{{ tailscale_ours | bool }}"
      daemon_up: "{{ tailscale_daemon_up | bool if tailscale_status_read | bool else false }}"
      backend: "{{ tailscale_backend if tailscale_status_read | bool else '' }}"
      case: >-
        {{ tailscale_report_case if tailscale_wanted | bool
           else 'unmanaged' if tailscale_status_unmanaged | bool else 'off' }}
      dns_name: "{{ tailscale_dns_name if tailscale_status_read | bool else '' }}"
      ipv4: "{{ tailscale_ipv4 if tailscale_status_read | bool else '' }}"
      key_expiry: "{{ tailscale_self.KeyExpiry | default('') if tailscale_status_read | bool else '' }}"
      line: >-
        {{ (tailscale_report_reported.msg | default('') | regex_replace('^' ~ (inventory_hostname | regex_escape) ~ ': ', ''))
           if tailscale_wanted | bool else '' }}
      left: "{{ tailscale_report_left | bool if tailscale_wanted | bool else false }}"
