---
# One line per VM: how it is on Tailscale, and the command that does the next thing where there is one
# (tailscale_report_result, the core's words, which just status says too).
- name: report | Say how this VM is on Tailscale
  ansible.builtin.debug:
    msg: "{{ inventory_hostname }}: {{ tailscale_report_result.line }}"
  register: tailscale_report_reported

# NEXT STEPS (callback_plugins/agent_warehouse.py): the line above while
# something is left to do - a page waiting, a login expired, a key refused,
# a node stopped or still connecting, an approval or a sign-in to come, a
# name taken or tags missing - and nothing once it runs as it should, or
# for a Tailscale this role leaves alone. A later record of the VM wins.
- name: report | Keep what is left to do for the end of the run
  ansible.builtin.set_stats:
    data:
      tailscale_next: >-
        {{ {inventory_hostname: {'tailscale': tailscale_report_reported.msg if tailscale_report_left | bool else ''}} }}
    aggregate: true
    per_host: false
