---
# What is on the VM, and who put it there.
#
# dpkg-query rather than package_facts: package_facts needs python3-apt, which
# the developer's Mac - where the unit tests run these files - does not have.
# ${db:Status-Status} is "installed" for an installed package and
# "config-files" after a remove; dpkg-query exits 1 for one it never had.
- name: ownership | Ask dpkg whether Tailscale is installed
  ansible.builtin.command:
    argv: [dpkg-query, --show, "--showformat=${db:Status-Status}", tailscale]
  register: tailscale_dpkg
  changed_when: false
  failed_when: false
  check_mode: false

# A Tailscale that dpkg does not know - Tailscale's static binaries, or the snap
# - is someone else's too: the package installed beside it would start a second
# tailscaled.
- name: ownership | Look for a Tailscale installed outside dpkg
  ansible.builtin.stat:
    path: "{{ item }}"
  loop: "{{ tailscale_foreign_paths }}"
  register: tailscale_foreign

# Written by install.yml before it adds the repository: a Tailscale with no
# marker was installed some other way, and is left alone.
- name: ownership | Look for the marker this role leaves when it installs Tailscale
  ansible.builtin.stat:
    path: "{{ tailscale_installed_marker_path }}"
  register: tailscale_installed_marker

# Through 1.x, in /var/lib/claude-on-proxmox: read there on a VM no run of 2.0
# has moved it on (names.yml), as just status's read is, never moving it here.
- name: ownership | Look for that marker by its 1.x directory
  ansible.builtin.stat:
    path: "{{ tailscale_marker_dir_1x }}/{{ tailscale_installed_marker_path | basename }}"
  register: tailscale_installed_marker_1x
  when: not tailscale_installed_marker.stat.exists and tailscale_marker_dir_1x | length > 0

# The node key of the login this role's own join produced (connect.yml): a
# login made by hand has another, and keeps its own settings.
- name: ownership | Read the node key of the login this role made
  ansible.builtin.slurp:
    src: "{{ tailscale_joined_marker_path }}"
  register: tailscale_joined_marker
  failed_when: false

- name: ownership | Read the node key of the login this role made, by its 1.x directory
  ansible.builtin.slurp:
    src: "{{ tailscale_marker_dir_1x }}/{{ tailscale_joined_marker_path | basename }}"
  register: tailscale_joined_marker_1x
  failed_when: false
  when: tailscale_joined_marker.content is not defined and tailscale_marker_dir_1x | length > 0
