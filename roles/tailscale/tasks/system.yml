---
# The new engine's entry: Tailscale installed by layer 1 (playbooks/system.yml, the part tailscale), where it is the
# VPN, and nothing more. What is installed and who installed it is read first, as main.yml reads it, and the package
# goes on only where Tailscale is the VPN and the role's (no Tailscale yet, or the one its marker marks). The join, the
# settings and the report are the new engine's layer 2, its step vpn-join, and Tailscale not the VPN is left as it is:
# nothing here logs a node out or removes a package (docs/architecture/engine.md §16.10, "Tailscale's install and
# join").
# main.yml's 1.x move (names.yml) is not reached: a new engine's machine has 2.0's paths alone.

- name: system | Read what is installed, and who installed it
  ansible.builtin.include_tasks: ownership.yml

- name: system | Install Tailscale where it is the VPN, and this role installed it or nothing has
  ansible.builtin.include_tasks: install.yml
  when:
    - tailscale_wanted | bool
    - tailscale_ours | bool
