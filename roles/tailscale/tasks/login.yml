---
# Entry point for playbooks/tailscale_login.yml (just login --only tailscale, and just
# deploy's step): say how the VM is on Tailscale, and sign it in by Tailscale's
# web login when asked to. In the role, so that it decides from the same
# vars/main.yml definitions configuration does, and the two cannot disagree.
- name: login | Read what is installed, and who installed it
  ansible.builtin.include_tasks: ownership.yml

# Only where there is a daemon of this role's to ask. A VM with Tailscale off,
# not installed, or installed by hand gets one line below and nothing else:
# no question, no `up`.
- name: login | Read Tailscale's state
  ansible.builtin.include_tasks: state.yml
  when:
    - tailscale_wanted | bool
    - tailscale_installed | bool

- name: login | Say why there is nothing to sign in
  ansible.builtin.debug:
    msg: >-
      {{ inventory_hostname }}:
      {{ 'Tailscale is off (' ~ tailscale_off_setting.name ~ ': ' ~ tailscale_off_setting.value
         ~ '), so there is nothing to sign in.'
         if not (tailscale_wanted | bool)
         else 'Tailscale is not installed; ' ~ tailscale_configure_command ~ ' installs it, and '
              ~ tailscale_login_command ~ ' then signs it in.' }}
  register: tailscale_nothing_reported
  when: not (tailscale_wanted | bool) or not (tailscale_installed | bool)

# NEXT STEPS: an install to run is left to do; Tailscale off is a choice.
- name: login | Keep what is left to do for the end of the run
  ansible.builtin.set_stats:
    data:
      tailscale_next: >-
        {{ {inventory_hostname: {'tailscale': tailscale_nothing_reported.msg if tailscale_wanted | bool else ''}} }}
    aggregate: true
    per_host: false
  when: not (tailscale_wanted | bool) or not (tailscale_installed | bool)

# Whether the web login is what would sign this VM in (tailscale_login_possible).
# The question and the login below go on it, and playbooks/tailscale_login.yml
# reads it after the role, to say why a sign-in it left out was not started -
# so the two cannot disagree. And whether the VM is merely signed out, as the
# report below will say it (its NeedsLogin case): no page still waiting, no
# login expired, no key refused, each of which the report says more of than
# "not started", so tailscale_login.yml's line takes the place of the report's
# in NEXT STEPS only then. Both set every time this entry point runs.
- name: login | Record whether the web login would sign this VM in
  ansible.builtin.set_fact:
    tailscale_login_due: "{{ tailscale_login_possible | bool }}"
    tailscale_login_signed_out: "{{ tailscale_login_possible | bool and tailscale_report_case == 'NeedsLogin' }}"

# just deploy, for every VM but one whose Claude prompt got Enter: the web
# login waits up to tailscale_login_timeout for a browser, so it can always be
# left for later. Where a Claude code was entered someone is here, and Enter
# goes; elsewhere only "y" does. Never asked in a run with no terminal, where
# pause would return at once with nothing, which is Enter:
# playbooks/tailscale_login.yml leaves the VM then (claude_vm_login_unasked;
# vars/main.yml, tailscale_login_go).
- name: login | Ask whether to sign this VM in to Tailscale now
  vars:
    tailscale_login_question: >-
      {{ inventory_hostname }}: Tailscale is not signed in.
      {{ ('Enter signs it in now (a page opens, and this run waits up to ' ~ tailscale_login_wait_said
          ~ ' for the approval); type n and Enter to skip it')
         if tailscale_login_interactive | bool
         else ('Type y and Enter to sign it in now (a page opens, and this run waits up to ' ~ tailscale_login_wait_said
               ~ ' for the approval), or Enter alone to skip') }}
  # The question under a block that sets it apart from the task output
  # around it; the answer is typed after "Answer:".
  ansible.builtin.pause:
    prompt: >-
      {{ tailscale_login_question
         | banner('USER INPUT REQUIRED', host=inventory_hostname, topic='Tailscale sign-in') ~ 'Answer' }}
  register: tailscale_login_asked
  when:
    - tailscale_login_ask | bool
    - tailscale_login_due | bool

- name: login | Sign in by Tailscale's web login
  ansible.builtin.include_tasks: web_login.yml
  when:
    - tailscale_login_go | bool
    - tailscale_login_due | bool

# Whether the VM's Tailscale has had a login, or has a sign-in under way - the
# web login above, approved or still waiting, or one found - for the play after
# the sign-ins to record in Proxmox (tasks/vpn_members.yml), as connect.yml
# says it for configure's. Set every time this entry point runs.
- name: login | Say whether the VM has had a login, for Proxmox to record
  ansible.builtin.set_fact:
    tailscale_login_to_record: >-
      {{ tailscale_wanted | bool and tailscale_installed | bool and tailscale_login_seen | bool }}

# The report configuration gives - which, for a page still waiting for its
# approval, says so: the node's state holds the page.
- name: login | Report how the VM is on Tailscale
  ansible.builtin.include_tasks: report.yml
  vars:
    # This play neither joins with the key nor changes a setting. In just
    # deploy the configure play earlier in the run may have, and said so: its
    # registers are still there, and are not this play's to say again.
    tailscale_report_from_login: true
  when:
    - tailscale_wanted | bool
    - tailscale_installed | bool
