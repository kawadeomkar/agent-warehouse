---
# The user's home, for the entry points that never run main.yml, which
# resolves it for everything else: login.yml keeps the sign-in's files there
# and reads the settings from it, status.yml reads the installed claude and
# the stored login under it. A home already known - set by main.yml in the
# same play, or given as a host var, as the tests give it - is kept.
- name: home | Look up home directory of {{ claude_code_user }}
  ansible.builtin.getent:
    database: passwd
    key: "{{ claude_code_user }}"
  when: claude_code_home is not defined

- name: home | Record where the user's files are
  ansible.builtin.set_fact:
    claude_code_home: "{{ ansible_facts.getent_passwd[claude_code_user][4] }}"
  when: claude_code_home is not defined
