---
# The hub, made by hand as a user's server would be, with the VM's peer added
# from the key its role made; the handshake waited for; a WireGuard link of the
# user's own beside it; then WireGuard off, which verify.yml checks took off the
# role's link, files, key and package, and nothing of the user's.
- name: The hub, the handshake, then WireGuard off
  hosts: all
  become: true
  tasks:
    - name: Read the key and the files the role wrote
      ansible.builtin.stat:
        path: /etc/systemd/network/claude-wg.key
      register: wireguard_molecule_key

    - name: Check the key is root's and systemd-network's alone
      ansible.builtin.assert:
        that:
          - wireguard_molecule_key.stat.exists
          - wireguard_molecule_key.stat.mode == '0640'
          - wireguard_molecule_key.stat.pw_name == 'root'
          - wireguard_molecule_key.stat.gr_name == 'systemd-network'
        quiet: true

    - name: Read the VM's public key from its link
      ansible.builtin.command:
        argv: [wg, show, claude-wg, public-key]
      register: wireguard_molecule_vm_key
      changed_when: false

    # By systemd-networkd, as the role makes its own link: a key file read by
    # networkd, never by wg (prepare.yml says why).
    - name: Write the hub's link, the VM its one peer
      ansible.builtin.copy:
        dest: "/etc/systemd/network/{{ wireguard_molecule_hub_file.name }}"
        content: "{{ wireguard_molecule_hub_file.content }}"
        owner: root
        group: systemd-network
        mode: "0644"
      loop:
        - name: 40-hubwg.netdev
          content: |
            [NetDev]
            Name=hubwg
            Kind=wireguard

            [WireGuard]
            PrivateKeyFile=/etc/systemd/network/40-hubwg.key
            ListenPort=51820

            [WireGuardPeer]
            PublicKey={{ wireguard_molecule_vm_key.stdout | trim }}
            AllowedIPs=198.51.100.130/32
        - name: 40-hubwg.network
          content: |
            [Match]
            Name=hubwg

            [Network]
            LinkLocalAddressing=no
      loop_control:
        loop_var: wireguard_molecule_hub_file
        label: "{{ wireguard_molecule_hub_file.name }}"

    - name: Have systemd-networkd make the hub's link
      ansible.builtin.command:
        argv: [networkctl, reload]
      changed_when: true

    - name: Wait for the VM's link to shake hands with the hub
      ansible.builtin.command:
        argv: [wg, show, claude-wg, latest-handshakes]
      register: wireguard_molecule_handshake
      changed_when: false
      until: (wireguard_molecule_handshake.stdout.split() | last | default('0') | int) > 0
      retries: 40
      delay: 1

    # The routes the network file makes: none to the tunnel network in the main
    # table, and the tunnel address's own rule and table.
    - name: Read the VM's routing
      ansible.builtin.command:
        argv: [sh, -c, 'ip -4 route show table main; echo ---; ip -4 rule show; echo ---; ip -4 route show table 51920']
      register: wireguard_molecule_routes
      changed_when: false

    - name: Check what the VM sends from its LAN address stays off the tunnel
      vars:
        wireguard_molecule_parts: "{{ wireguard_molecule_routes.stdout.split('---') }}"
      ansible.builtin.assert:
        that:
          - "'dev claude-wg' not in wireguard_molecule_parts[0]"
          - "'from 198.51.100.130 lookup 51920' in wireguard_molecule_parts[1]"
          - "'198.51.100.0/24 dev claude-wg' in wireguard_molecule_parts[2]"
        fail_msg: "{{ wireguard_molecule_routes.stdout }}"
        quiet: true

    - name: Make a WireGuard link of the user's own
      ansible.builtin.command:
        argv: [ip, link, add, wg0, type, wireguard]
      changed_when: true

    - name: Turn WireGuard off
      ansible.builtin.import_role:
        name: wireguard
      vars:
        wireguard_wanted: false
        wireguard_off_why: vpn is none
