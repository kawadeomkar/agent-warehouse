---
# The stand-in hub's key: 32 bytes of 1s, a key no real server has, kept for
# side_effect.yml, whose hub systemd-networkd makes with it, as the role makes
# its link - read by networkd, never by wg, which a CI runner's AppArmor kept
# from opening a key file (fopen: Permission denied). And apt's lists, which a
# VM has and the image has not: check mode asks apt about wireguard-tools
# without refreshing them.
- name: Prepare
  hosts: all
  become: true
  tasks:
    - name: Read apt's lists, as a VM has them
      ansible.builtin.apt:
        update_cache: true

    - name: Keep the stand-in hub's private key, for systemd-networkd
      ansible.builtin.copy:
        dest: /etc/systemd/network/40-hubwg.key
        content: "AQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQE=\n"
        owner: root
        group: systemd-network
        mode: "0640"
