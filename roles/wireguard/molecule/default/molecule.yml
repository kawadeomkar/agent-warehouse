---
# Shared settings live in .config/molecule/config.yml at the project root.
#
# One VM, whose link shakes hands with a plain WireGuard interface made beside
# it as its hub (side_effect.yml), the way a user's server would be set up by
# hand: the role never writes the hub. Nothing here leaves the container but
# UDP on its loopback. The link needs the host kernel's WireGuard module, which
# the privileged container shares.
platforms:
  - name: agent-warehouse-wireguard
    image: "${MOLECULE_IMAGE:-geerlingguy/docker-ubuntu2404-ansible@sha256:29e6f9d736c3401815d98f626a41c55a54a4ef1edb9d1d1223018746d3acba14}"
    pre_build_image: true
    command: ""
    privileged: true
    cgroupns_mode: host
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
provisioner:
  env:
    # Resolve roles from this repository's roles/ directory (not Galaxy).
    ANSIBLE_ROLES_PATH: ${MOLECULE_PROJECT_DIRECTORY}/..
    ANSIBLE_FILTER_PLUGINS: ${MOLECULE_PROJECT_DIRECTORY}/../../filter_plugins
scenario:
  # check before converge: converge in check mode on a VM that has never had
  # WireGuard, which must make no key and write nothing.
  test_sequence:
    - dependency
    - cleanup
    - destroy
    - syntax
    - create
    - prepare
    - check
    - converge
    - idempotence
    - side_effect
    - verify
    - cleanup
    - destroy
