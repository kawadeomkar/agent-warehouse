---
# After WireGuard was turned off: the role's link, files, key, package and
# marker gone; the user's own link still there.
- name: Verify
  hosts: all
  become: true
  tasks:
    - name: Look for what the role set up
      ansible.builtin.stat:
        path: "{{ item }}"
      loop:
        - /etc/systemd/network/50-claude-wg.netdev
        - /etc/systemd/network/50-claude-wg.network
        - /etc/systemd/network/claude-wg.key
        - /var/lib/claude-on-proxmox/wireguard-installed
      register: wireguard_molecule_left

    - name: Check none of it is left
      ansible.builtin.assert:
        that: wireguard_molecule_left.results | selectattr('stat.exists') | list | length == 0
        fail_msg: "{{ wireguard_molecule_left.results | selectattr('stat.exists') | map(attribute='item') | list }}"
        quiet: true

    - name: Read the links
      ansible.builtin.command:
        argv: [ip, -o, link, show]
      register: wireguard_molecule_links
      changed_when: false

    - name: Ask dpkg for wireguard-tools, which the role installed
      ansible.builtin.command:
        argv: [dpkg-query, --show, "--showformat=${db:Status-Status}", wireguard-tools]
      register: wireguard_molecule_package
      changed_when: false
      failed_when: false

    - name: Check the role's link and package are gone, and the user's link stays
      ansible.builtin.assert:
        that:
          - "' claude-wg:' not in wireguard_molecule_links.stdout"
          - "' wg0:' in wireguard_molecule_links.stdout"
          - wireguard_molecule_package.stdout != 'installed'
        quiet: true
