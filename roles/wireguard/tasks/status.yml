---
# Entry point for `just status` (playbooks/status.yml): how this VM is on its
# WireGuard network, read and never changed. What is installed and whose
# (ownership.yml), the link's handshake and address (state.yml), and the line
# status shows where something is left to do. Never the key, the files, the
# link or the package.
- name: status | Read what is installed, and who installed it
  ansible.builtin.include_tasks: ownership.yml

- name: status | Read the link's state
  ansible.builtin.include_tasks: state.yml
  when: wireguard_wanted | bool or wireguard_ours | bool

# What the report shows, and nothing else: no key.
- name: status | Keep how this VM is on its WireGuard network
  vars:
    wireguard_case: >-
      {{ 'off' if not (wireguard_wanted | bool)
         else 'no-link' if wireguard_address_read == ''
         else 'never' if wireguard_handshake_age | int < 0
         else 'stale' if wireguard_handshake_age | int > 180
         else 'up' }}
  ansible.builtin.set_fact:
    wireguard_status_found:
      kind: wireguard
      wanted: "{{ wireguard_wanted | bool }}"
      ours: "{{ wireguard_ours | bool }}"
      case: "{{ wireguard_case }}"
      address: "{{ wireguard_address_read.split('/')[0] if wireguard_address_read else '' }}"
      handshake_age: "{{ wireguard_handshake_age | int if wireguard_wanted | bool else -1 }}"
      line: >-
        {{ '' if wireguard_case in ['off', 'up']
           else inventory_hostname ~ ': no WireGuard link yet: just deploy ' ~ inventory_hostname ~ ' --only configure'
                ~ ' sets it up.' if wireguard_case == 'no-link'
           else inventory_hostname ~ ': its WireGuard link has never reached the hub: add its peer to your server, as'
                ~ ' just deploy ' ~ inventory_hostname ~ ' --only configure says it (docs/guides/wireguard.md).'
                if wireguard_case == 'never'
           else inventory_hostname ~ ': its WireGuard link last reached the hub '
                ~ (wireguard_handshake_age | int // 60) ~ ' minutes ago: the server, or the way to it, is down.' }}
      left: "{{ wireguard_case in ['no-link', 'never', 'stale'] }}"
