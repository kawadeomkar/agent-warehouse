---
# wireguard_wanted false: what this role set up taken off again, where its
# marker says it set something up - the link, its two files and the key, and
# wireguard-tools only where the role installed it. Each step only where its
# object exists. A WireGuard of the user's own is never touched: none of its
# names is the role's.
- name: absent | Read what the marker says the role installed
  ansible.builtin.slurp:
    src: "{{ wireguard_installed_marker_path }}"
  register: wireguard_marker_text

- name: absent | Say that WireGuard is being taken off
  ansible.builtin.debug:
    msg: >-
      {{ inventory_hostname }}: {{ wireguard_off_why }}, so the WireGuard link this project set up here
      {{ 'would be taken off; check mode changes nothing.' if ansible_check_mode else 'is being taken off.' }}

- name: absent | Take the link down
  ansible.builtin.command:
    argv: [networkctl, delete, "{{ wireguard_link }}"]
  register: wireguard_link_deleted
  changed_when: wireguard_link_deleted.rc == 0
  failed_when: false

- name: absent | Remove the link's files and the key
  ansible.builtin.file:
    path: "{{ wireguard_absent_path }}"
    state: absent
  loop: ["{{ wireguard_netdev_path }}", "{{ wireguard_network_path }}", "{{ wireguard_key_path }}"]
  loop_control:
    loop_var: wireguard_absent_path

- name: absent | Remove wireguard-tools, which the role installed
  ansible.builtin.apt:
    name: wireguard-tools
    state: absent
  when: (wireguard_marker_text.content | b64decode | trim) == wireguard_marker_installed

- name: absent | Have systemd-networkd read the files again
  ansible.builtin.command:
    argv: [networkctl, reload]
  changed_when: true
  failed_when: false

- name: absent | Remove the marker, last
  ansible.builtin.file:
    path: "{{ wireguard_installed_marker_path }}"
    state: absent
