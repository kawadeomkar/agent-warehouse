---
# The VM's link to its hub, as the members' plan has it (wireguard_tunnel): or -
# with wireguard_wanted false - what this role set up taken off again, where its
# marker is. playbooks/configure.yml runs it in a play after the plan, in a
# block whose rescue records a failure and raises it at the end of the run, so
# a WireGuard problem never costs a VM its SSH alias, its sign-ins or its
# editor. Nothing here may rely on a handler: one would run after that block,
# out of its rescue's reach.
- name: Read what is installed, and who installed it
  ansible.builtin.include_tasks: ownership.yml

- name: Set the link up as the plan has it
  ansible.builtin.include_tasks: configure.yml
  when:
    - wireguard_wanted | bool
    - wireguard_tunnel | length > 0

- name: Take off what this role set up
  ansible.builtin.include_tasks: absent.yml
  when:
    - not (wireguard_wanted | bool)
    - wireguard_ours | bool
