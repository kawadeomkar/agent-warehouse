---
# Entry point for playbooks/configure.yml, before the members' plan: the VM's
# key pair, made on the VM and kept there, and the public key read back for the
# plan, with the link's handshake. The private key is never read by Ansible:
# wg makes it into a file only root and systemd-networkd read, and wg reads it
# there for the public key. Off (wireguard_wanted false), nothing here runs.
- name: key | Read what is installed, and who installed it
  ansible.builtin.include_tasks: ownership.yml

# Where the project's markers live on a VM, beside the Tailscale role's: a
# VM that never had Tailscale has no such directory yet.
- name: key | Make the markers' directory
  ansible.builtin.file:
    path: "{{ wireguard_marker_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

# Before the role's first change, so a run that stops half way still leaves the
# VM's WireGuard the role's to take off again: and whether it installs the
# package, so off removes it only then.
- name: key | Leave the marker before the first change
  ansible.builtin.copy:
    dest: "{{ wireguard_installed_marker_path }}"
    content: "{{ wireguard_marker_found if wireguard_package_present | bool else wireguard_marker_installed }}\n"
    owner: root
    group: root
    mode: "0644"
  when: not (wireguard_ours | bool)

- name: key | Install wireguard-tools
  ansible.builtin.apt:
    name: wireguard-tools
    state: present
    update_cache: true
    cache_valid_time: 3600
  when: not (wireguard_package_present | bool)

# umask first, so the key is never readable by anyone else even for an
# instant; then its group, which networkd reads it as, and its mode.
- name: key | Make the VM's key, once
  ansible.builtin.command:
    argv:
      - sh
      - -c
      - umask 077 && wg genkey > "$1.new" && chgrp systemd-network "$1.new" && chmod 0640 "$1.new" && mv "$1.new" "$1"
      - sh
      - "{{ wireguard_key_path }}"
    creates: "{{ wireguard_key_path }}"

- name: key | Keep the key readable by root and systemd-networkd alone
  ansible.builtin.file:
    path: "{{ wireguard_key_path }}"
    owner: root
    group: systemd-network
    mode: "0640"
  when: not ansible_check_mode

# The public key, from the private one, on the VM: only the public key is
# printed.
- name: key | Read the VM's public key
  ansible.builtin.command:
    argv: [sh, -c, 'wg pubkey < "$1"', sh, "{{ wireguard_key_path }}"]
  register: wireguard_pubkey
  changed_when: false
  failed_when: false
  check_mode: false

- name: key | Read the link's state
  ansible.builtin.include_tasks: state.yml

# For the members' plan on localhost, which reads them through hostvars: set
# on every run, so none is an earlier run's.
- name: key | Keep the public key and whether the link has reached the hub
  ansible.builtin.set_fact:
    wireguard_public_key: "{{ (wireguard_pubkey.stdout | default('') | trim) if wireguard_pubkey.rc | default(1) == 0 else '' }}"
    wireguard_handshake: "{{ wireguard_handshake_age | int >= 0 }}"
