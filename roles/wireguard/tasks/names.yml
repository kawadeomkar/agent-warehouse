---
# Through 1.x the markers' directory, which this role shares with tailscale's,
# was /var/lib/claude-on-proxmox: moved once to its name from 2.0 before anything
# reads it, by whichever of the two roles runs first. Never from just status,
# which reads either name.
- name: names | Move the markers' directory to its name from 2.0
  ansible.builtin.command:
    argv: [mv, -n, "{{ wireguard_marker_dir_1x }}", "{{ wireguard_marker_dir }}"]
    creates: "{{ wireguard_marker_dir }}"
    removes: "{{ wireguard_marker_dir_1x }}"
  when: wireguard_marker_dir_1x | length > 0
