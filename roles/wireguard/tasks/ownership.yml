---
# What is on the VM, and who put it there. dpkg-query rather than
# package_facts, which needs python3-apt; ${db:Status-Status} is "installed"
# for an installed package, and dpkg-query exits 1 for one it never had.
- name: ownership | Ask dpkg whether wireguard-tools is installed
  ansible.builtin.command:
    argv: [dpkg-query, --show, "--showformat=${db:Status-Status}", wireguard-tools]
  register: wireguard_dpkg
  changed_when: false
  failed_when: false
  check_mode: false

# Written before the role's first change on a VM: without it, nothing of
# claude-wg's is the role's to take off.
- name: ownership | Look for the marker this role leaves before its first change
  ansible.builtin.stat:
    path: "{{ wireguard_installed_marker_path }}"
  register: wireguard_installed_marker
