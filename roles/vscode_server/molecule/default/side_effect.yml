---
# What converge.yml cannot show: that the role refuses an sshd on which
# something else has taken the forwarding away, naming the file, and
# that vscode_server_enabled: false removes what an earlier run wrote. The
# container is left as converge.yml made it, so verify.yml checks that state.
- name: Side effect
  hosts: all
  become: true
  tasks:
    # Each takes the forwarding away in a drop-in of its own, and the role must
    # refuse, naming the setting and the file: a drop-in sorted before the
    # role's own, since sshd keeps the first value it reads; DisableForwarding,
    # which overrides both forwarding keywords whatever they say; and a Match
    # block for the VM user, sorted last, which a global `sshd -T` does not
    # apply, so it is only caught because the role reads the configuration for
    # dev's own connection.
    - name: Run the role over a drop-in that takes the forwarding away
      ansible.builtin.include_tasks: tasks/foreign_dropin.yml
      loop:
        - {file: 05-molecule-hardening.conf, content: "AllowTcpForwarding no\n", said: allowtcpforwarding no}
        - {file: 05-molecule-disable.conf, content: "DisableForwarding yes\n", said: disableforwarding yes}
        - {file: 99-molecule-match.conf, content: "Match User dev\n    AllowTcpForwarding remote\n", said: allowtcpforwarding remote}
      loop_control:
        loop_var: vscode_server_foreign
        label: "{{ vscode_server_foreign.file }}"

    - name: Run the role switched off
      ansible.builtin.include_role:
        name: vscode_server
      vars:
        vscode_server_enabled: false

    - name: Stat what the role should have removed
      ansible.builtin.stat:
        path: "{{ item }}"
      register: vscode_server_side_effect_removed
      loop:
        - /etc/ssh/sshd_config.d/20-vscode-server.conf
        - /etc/sysctl.d/60-vscode-server.conf

    - name: Assert both files are gone
      ansible.builtin.assert:
        that: vscode_server_side_effect_removed.results | map(attribute='stat.exists') | select | list | length == 0
        quiet: true

    # Back to the converged state, for verify.yml.
    - name: Run the role switched on again
      ansible.builtin.include_role:
        name: vscode_server
