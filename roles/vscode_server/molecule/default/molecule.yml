---
# Shared settings live in .config/molecule/config.yml at the project root.
platforms:
  - name: agent-warehouse-vscode_server
    image: "${MOLECULE_IMAGE:-geerlingguy/docker-ubuntu2404-ansible@sha256:29e6f9d736c3401815d98f626a41c55a54a4ef1edb9d1d1223018746d3acba14}"
    pre_build_image: true
    command: ""
    privileged: true
    cgroupns_mode: host
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
provisioner:
  env:
    # Resolve roles from this repository's roles/ directory (not Galaxy).
    ANSIBLE_ROLES_PATH: ${MOLECULE_PROJECT_DIRECTORY}/..
    # The sshd -T -C check builds its Match spec through the repository's
    # sshd_match_spec filter.
    ANSIBLE_FILTER_PLUGINS: ${MOLECULE_PROJECT_DIRECTORY}/../../filter_plugins
  inventory:
    host_vars:
      agent-warehouse-vscode_server:
        # Not the defaults, so verify.yml can tell the template was rendered
        # from them rather than copied; every run of the role here has them.
        vscode_server_client_alive_interval: 45
        vscode_server_client_alive_count_max: 4
        vscode_server_inotify_watches: 262144
