---
argument_specs:
  main:
    short_description: Make a VM ready for a remote editor over SSH, and for Claude's sign-in
    description:
      - Writes an sshd drop-in that keeps port forwarding enabled - VS Code's server is reached
        through it, and an editor's port forwards and Claude's sign-in in the browser use it - and
        adds keepalives, asserts the values sshd actually runs with, and raises the inotify watch
        limit an editor's file watcher needs. Disabled, it removes both files.
      - It runs whichever editor just code opens - Claude's sign-in in the browser and Zed's port
        forwards use the same forwarding, and any editor's file watcher the same limit - and keeps
        VS Code's name through 1.x, the --tags name 1.0 promised.
    options:
      vscode_server_enabled:
        type: bool
        description:
          - Write the sshd drop-in and the inotify limit, and check what sshd applies. false removes both files. Set
            through vscode_remote in local.yml.
      vscode_server_user:
        type: str
        description: The user the editor connects as, whose connection the sshd check evaluates Match blocks for.
      vscode_server_client_alive_interval:
        type: int
        description:
          - Seconds of silence after which sshd checks that a connection is alive (ClientAliveInterval); the drop-in sets
            it for every SSH connection, the editor's included.
      vscode_server_client_alive_count_max:
        type: int
        description:
          - Unanswered checks after which sshd drops the connection (ClientAliveCountMax), so a client that went to
            sleep is reaped after interval times count seconds.
      vscode_server_inotify_watches:
        type: int
        description: fs.inotify.max_user_watches, raised for an editor's file watcher on a large workspace.
      vscode_server_container_virt_types:
        type: list
        elements: str
        description: Virtualisation types under which /proc/sys is read-only, so the sysctl file is written but not applied.
