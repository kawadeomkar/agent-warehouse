---
# What a remote editor needs on the host. VS Code's Remote - SSH documents
# bash, tar and curl or wget to install its server, and a glibc system on
# x86_64 or aarch64; VS Code's server, an editor's port forwards and Claude's
# sign-in in the browser need an sshd that allows port forwards over the
# connection; and any file watcher needs an inotify limit large enough to
# watch a workspace. The image and the common role provide the first two; this
# role writes the other two, and checks the sshd one against what sshd
# actually runs with.
#
# None of it is VS Code's alone, so the role runs whichever editor just code
# opens: Claude's sign-in in the browser forwards its callback to the VM over
# `ssh -L` for every editor (roles/claude_code/tasks/browser_login.yml), Zed's
# port forwards are `ssh -L` too, the keepalives reap any editor's session left
# on a sleeping laptop, and any file watcher needs the inotify limit. Its name
# is VS Code's through 1.x, the --tags name 1.0 promised.

- name: Set up and check what a remote editor needs
  when: vscode_server_enabled | bool
  block:
    - name: Look for the tools the server installer needs
      ansible.builtin.command:
        argv: [bash, -c, 'command -v bash tar && { command -v curl || command -v wget; }']
      register: vscode_server_tools
      changed_when: false
      check_mode: false
      failed_when: false

    - name: Fail when the host cannot run VS Code Server
      ansible.builtin.assert:
        that:
          - vscode_server_tools.rc == 0
          - ansible_facts['architecture'] in ['x86_64', 'aarch64']
        fail_msg: >-
          {{ inventory_hostname }} cannot run VS Code Server: it needs bash, tar and curl or wget on
          an x86_64 or aarch64 glibc system, and this host is {{ ansible_facts['architecture'] }} with
          {{ 'all of those tools' if vscode_server_tools.rc == 0 else 'some of those tools missing' }}.
          The common role installs curl and wget; check that it ran.
        quiet: true

    # sshd -t needs its privilege-separation directory, which only exists once
    # sshd has started (not yet the case in a fresh container).
    - name: Ensure sshd privilege separation directory exists
      ansible.builtin.file:
        path: /run/sshd
        state: directory
        owner: root
        group: root
        mode: "0755"

    # A drop-in of its own, after the common role's 10-agent-warehouse.conf: one
    # file per owner, and sshd reads sshd_config.d in lexical order.
    - name: Allow port forwarding over the editor's SSH connection
      ansible.builtin.template:
        src: 20-vscode-server.conf.j2
        dest: /etc/ssh/sshd_config.d/20-vscode-server.conf
        owner: root
        group: root
        mode: "0644"
        validate: /usr/sbin/sshd -t -f %s
      notify: Restart ssh for the editor's drop-in

    # Where the editor's connection will come from: this machine, as Ansible's own
    # SSH connection shows. sudo drops SSH_CONNECTION, hence no become. Without
    # an SSH connection - a container, a local run - there is nothing to read,
    # and the loopback address stands in.
    - name: Find where the editor's connection will come from
      ansible.builtin.command:
        argv: [printenv, SSH_CONNECTION]
      become: false
      register: vscode_server_ssh_connection
      changed_when: false
      check_mode: false
      failed_when: false

    # What sshd will apply to that connection: `sshd -T` parses the files on
    # disk, so this is the configuration the restart notified above puts in
    # place at the end of the play, and nothing has to be restarted first. -C
    # evaluates Match blocks for the user and addresses given; without it they
    # are skipped, and a `Match User dev` that turns forwarding off would pass.
    - name: Read the configuration sshd applies to the editor's connection
      ansible.builtin.command:
        argv:
          - /usr/sbin/sshd
          - -T
          - -C
          - "{{ vscode_server_ssh_connection.stdout | default('') | sshd_match_spec(vscode_server_user) }}"
      register: vscode_server_sshd
      changed_when: false
      check_mode: false

    # Only to name the culprit when the check below fails. Every setting that can
    # take the forwarding away: either keyword turned off or limited to the
    # remote direction (VS Code, an editor's port forwards and Claude's sign-in
    # all forward from the client, which sshd calls local), and DisableForwarding,
    # which overrides both. Indented lines count, because that is how a setting
    # under a Match block is usually written.
    - name: Find what turns forwarding off, if anything does
      ansible.builtin.find:
        paths: [/etc/ssh, /etc/ssh/sshd_config.d]
        patterns: [sshd_config, "*.conf"]
        contains: '(?i)^\s*(AllowTcpForwarding\s+(no|remote)|AllowStreamLocalForwarding\s+(no|remote)|DisableForwarding\s+yes)\b'
      register: vscode_server_forwarding_off
      check_mode: false

    # sshd keeps the first value it reads for a keyword, and a Match block sets
    # its own for the connections it matches, so a drop-in sorted before ours,
    # sshd_config itself or a Match block for this user can each override the
    # file this role just wrote - silently. Reading the result back is what turns
    # that into a named failure instead of a VS Code window that cannot connect,
    # an editor's port forward that cannot open, or a sign-in that falls back to
    # pasting its code.
    - name: Fail when sshd does not allow port forwarding
      vars:
        vscode_server_blocking:
          - allowtcpforwarding no
          - allowtcpforwarding remote
          - allowstreamlocalforwarding no
          - allowstreamlocalforwarding remote
          - disableforwarding yes
        vscode_server_effective: >-
          {{ vscode_server_sshd.stdout_lines
             | select('match', '^(allowtcpforwarding|allowstreamlocalforwarding|disableforwarding) ') | list }}
        vscode_server_culprits: "{{ vscode_server_forwarding_off.files | default([]) | map(attribute='path') | sort | list }}"
      ansible.builtin.assert:
        that: vscode_server_sshd.stdout_lines | intersect(vscode_server_blocking) | length == 0
        fail_msg: >-
          sshd on {{ inventory_hostname }} applies "{{ vscode_server_effective | join('", "') }}" to
          {{ vscode_server_user }}'s connections, so VS Code's Remote - SSH cannot reach the server it
          starts there, an editor's port forward cannot open, and Claude's sign-in in the browser falls
          back to pasting its code. sshd keeps the first value it reads for a keyword and a Match block sets its own,
          so something other than /etc/ssh/sshd_config.d/20-vscode-server.conf decides it{{
            ': ' ~ (vscode_server_culprits | join(', ')) if vscode_server_culprits | length > 0
            else ' - a drop-in sorted before it, /etc/ssh/sshd_config itself, or a Match block' }}.
          Remove that setting, or set vscode_remote: false to leave sshd alone.
        quiet: true

    # Written for the record wherever the role runs, applied only where /proc/sys
    # is writable. ansible.posix.sysctl reads the live value only when it sets it.
    - name: Raise the inotify watch limit for the editor's file watcher
      ansible.posix.sysctl:
        name: fs.inotify.max_user_watches
        value: "{{ vscode_server_inotify_watches }}"
        sysctl_file: /etc/sysctl.d/60-vscode-server.conf
        sysctl_set: "{{ ansible_facts['virtualization_type'] not in vscode_server_container_virt_types }}"
        reload: "{{ ansible_facts['virtualization_type'] not in vscode_server_container_virt_types }}"
        state: present

# Off (vscode_remote: false), the two files the block writes go.
- name: Remove the sshd drop-in
  ansible.builtin.file:
    path: /etc/ssh/sshd_config.d/20-vscode-server.conf
    state: absent
  when: not vscode_server_enabled | bool
  notify: Restart ssh for the editor's drop-in

# The live value stays raised until the next boot; a limit is harmless to
# leave high, and lowering it under a running watcher is not.
- name: Remove the inotify setting
  ansible.builtin.file:
    path: /etc/sysctl.d/60-vscode-server.conf
    state: absent
  when: not vscode_server_enabled | bool
