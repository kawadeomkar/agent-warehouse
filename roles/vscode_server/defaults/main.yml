---
# Make the VM meet what a remote editor and Claude's sign-in in the browser
# need on the host, and prove it, rather than hope OpenSSH's defaults hold.
# False removes what an earlier run wrote.
vscode_server_enabled: true
# The login the editor connects as: the user whose connection the sshd check
# evaluates Match blocks for, and named in messages. The common role owns the
# user itself. Wired from vm_user.
vscode_server_user: dev

# sshd keepalives for the editor's connection. An editor left open on a laptop
# that went to sleep is reaped after interval * count seconds instead of
# holding a session, and its server, for hours.
vscode_server_client_alive_interval: 60
vscode_server_client_alive_count_max: 3

# VS Code's documented figure for watching a large workspace, which any
# editor's file watcher shares. The kernel's default scales with memory and is
# far lower on a 4 GB VM, at which point an editor cannot watch for file
# changes (VS Code says so).
vscode_server_inotify_watches: 524288

# Virtualisation types under which /proc/sys is read-only, so the sysctl file
# is written for the record but not applied.
vscode_server_container_virt_types: [docker, container, containerd, podman, lxc]
